# Publishes the JavaScript / Node.js SDK (`QSDM/source/sdk/javascript`) to
# the public npm registry as the `qsdm-sdk` package. (The bare name `qsdm`
# was rejected by npm's similarity heuristic on first publish — see
# CHANGELOG.md for the rename note. The QSDM brand, repo, binaries, and
# import-time symbols are unaffected; only the npm package id has the
# `-sdk` suffix.)
#
# Trigger:
#   - Push a tag of the form `sdk-js-vX.Y.Z` (e.g. `git tag sdk-js-v0.3.0
#     && git push origin sdk-js-v0.3.0`). The tag suffix MUST match the
#     `version` field in `QSDM/source/sdk/javascript/package.json`; the
#     `version-matches-tag` step below fails the run otherwise so a
#     mistagged release cannot reach the registry.
#   - `workflow_dispatch` for manual re-runs (operator supplies the tag,
#     same matching rule applies).
#
# In-repo footprint (everything except the npm token):
#   - `package.json`               → metadata, files allowlist, prepublishOnly
#   - `qsdm.js`                    → runtime
#   - `qsdm.d.ts`                  → TypeScript declarations
#   - `qsdm.test.js`               → 17 node:test cases (run via prepublishOnly)
#   - `LICENSE`                    → MIT, packaged in tarball
#   - `CHANGELOG.md`               → publish-history record
#
# External requirement:
#   - npm trusted publishing for `qsdm-sdk` with GitHub owner
#     `blackbeardONE`, repository `QSDM`, and workflow file
#     `sdk-javascript-publish.yml` (configured; qsdm-sdk 0.5.0 was
#     published this way on 2026-11-07, with provenance).
#   - There is no token fallback (issue #57): a publish that npm does not
#     authorize through OIDC fails. No long-lived npm credential is kept
#     in GitHub.
#
# Trusted publishing uses the `id-token: write` permission below and creates
# provenance without storing a long-lived npm credential in GitHub.
name: Publish JavaScript SDK to npm

on:
  push:
    tags:
      - "sdk-js-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing sdk-js-v* tag to (re-)publish"
        required: true
        type: string

permissions:
  contents: read
  # provenance attestations are minted by the OIDC token issued to the run.
  id-token: write

concurrency:
  group: sdk-javascript-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish (qsdm-sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: QSDM/source/sdk/javascript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual rerun must publish the requested immutable tag, never
          # whatever happens to be at the default branch at rerun time.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@12.0.2

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package.json version matches tag suffix
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # `sdk-js-v0.3.0`  →  `0.3.0`
          EXPECTED="${TAG#sdk-js-v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::tag suffix '$EXPECTED' does not match package.json version '$ACTUAL'"
            exit 1
          fi
          echo "Publishing qsdm-sdk@${ACTUAL} from tag ${TAG}"

      - name: Run tests (also gated by prepublishOnly)
        run: npm test

      - name: Pack tarball for inspection
        run: |
          set -euo pipefail
          npm pack --dry-run
          npm pack
          ls -la *.tgz

      - name: Publish to npm
        run: |
          set -euo pipefail

          # npm trusted publishing exchanges GitHub's short-lived OIDC token
          # for publish authority. Ignore setup-node's token-oriented npmrc so
          # a stale NODE_AUTH_TOKEN cannot shadow the OIDC path.
          set +e
          OIDC_OUTPUT="$({
            NPM_CONFIG_USERCONFIG=/dev/null npm publish \
              --registry=https://registry.npmjs.org \
              --access public
          } 2>&1)"
          OIDC_STATUS=$?
          set -e
          printf '%s\n' "$OIDC_OUTPUT"
          if [ "$OIDC_STATUS" -eq 0 ]; then
            exit 0
          fi

          # Trusted publishing is the only path (issue #57). Say plainly when npm
          # did not authorize this workflow; every other error is reported as is.
          if printf '%s\n' "$OIDC_OUTPUT" | grep -Eqi \
            'ENEEDAUTH|E401|E403|need auth|unable to authenticate'; then
            echo "::error::npm did not authorize this workflow through trusted publishing. Check the trusted publisher of qsdm-sdk on npmjs.com (owner blackbeardONE, repository QSDM, workflow sdk-javascript-publish.yml)."
          fi
          exit "$OIDC_STATUS"

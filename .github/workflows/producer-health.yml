name: Monitor the QSDM producer

permissions:
  contents: read

# GitHub starts scheduled runs late when it is busy: on 2026-10-20 a */15 schedule ran about every
# five hours. So a scheduled run watches for 5 h 40 min, checking every 15 minutes, and the
# concurrency group queues the next scheduled run behind it. Manual runs do one check.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/producer-health.yml"
      - "scripts/check_producer_health.py"
      - "scripts/test_check_producer_health.py"
      - "scripts/report_producer_incident.py"
      - "scripts/test_report_producer_incident.py"
      - "scripts/watch_producer_health.py"
      - "scripts/test_watch_producer_health.py"

concurrency:
  group: qsdm-producer-health-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  watch-producer:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test the checker, the incident reporter and the watcher
        run: |
          python -m unittest \
            scripts.test_check_producer_health \
            scripts.test_report_producer_incident \
            scripts.test_watch_producer_health

      - name: Check every 15 minutes and keep the incident issue current
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/watch_producer_health.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$RUN_URL"

  check-producer:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      reason: ${{ steps.check.outputs.reason }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test the checker, the incident reporter and the watcher
        run: |
          python -m unittest \
            scripts.test_check_producer_health \
            scripts.test_report_producer_incident \
            scripts.test_watch_producer_health

      - name: Check the public API, chain progress and mining
        id: check
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_producer_health.py --github-output "$GITHUB_OUTPUT"

  report-production-incident:
    needs: check-producer
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Open or resolve the producer incident
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check-producer.result }}
          REASON: ${{ needs.check-producer.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/report_producer_incident.py \
            --result "$RESULT" \
            --reason "$REASON" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$RUN_URL"

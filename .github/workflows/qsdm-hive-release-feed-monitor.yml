name: Monitor QSDM Hive release feed

permissions:
  contents: read

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/qsdm-hive-release-feed-monitor.yml"
      - "QSDM/deploy/releases/hive-release-request.json"
      - "QSDM/deploy/releases/hive-feed-approved.json"
      - "scripts/check_hive_release_feed.py"
      - "scripts/test_check_hive_release_feed.py"
      - "scripts/report_hive_release_feed_incident.py"
      - "scripts/test_report_hive_release_feed_incident.py"
  pull_request:
    paths:
      - ".github/workflows/qsdm-hive-release-feed-monitor.yml"
      - "QSDM/deploy/releases/hive-release-request.json"
      - "QSDM/deploy/releases/hive-feed-approved.json"
      - "scripts/check_hive_release_feed.py"
      - "scripts/test_check_hive_release_feed.py"
      - "scripts/report_hive_release_feed_incident.py"
      - "scripts/test_report_hive_release_feed_incident.py"

concurrency:
  group: qsdm-hive-release-feed-monitor
  cancel-in-progress: true

jobs:
  verify-production-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test feed verifier
        run: |
          python -m unittest \
            scripts.test_check_hive_release_feed \
            scripts.test_report_hive_release_feed_incident

      - name: Read approved Hive release
        id: release
        shell: bash
        env:
          REQUEST_FILE: QSDM/deploy/releases/hive-release-request.json
          APPROVED_FILE: QSDM/deploy/releases/hive-feed-approved.json
        run: |
          set -euo pipefail
          # record FILE SCHEMA: "version commit" of one approved-release record.
          record() {
            [ "$(jq -r '.schema' "$1")" = "$2" ] || { echo "$1: schema is not $2" >&2; exit 1; }
            printf '%s %s\n' "$(jq -r '.version' "$1")" "$(jq -r '.source_commit' "$1")"
          }
          # The GitHub release request, or a release built and signed outside that flow
          # (APPROVED_FILE), whichever names the newer version.
          rec="$(record "$REQUEST_FILE" qsdm.hive.release-request.v1)"
          if [ -f "$APPROVED_FILE" ]; then
            alt="$(record "$APPROVED_FILE" qsdm.hive.feed-approved.v1)"
            newest="$(printf '%s\n%s\n' "${rec%% *}" "${alt%% *}" | sort -V | tail -n 1)"
            if [ "$newest" != "${rec%% *}" ]; then rec="$alt"; fi
          fi
          version="${rec%% *}"
          commit="${rec##* }"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Verify live updater channels and signed envelopes
        if: github.event_name != 'pull_request'
        run: |
          python scripts/check_hive_release_feed.py \
            --expected-version "${{ steps.release.outputs.version }}" \
            --expected-commit "${{ steps.release.outputs.commit }}"

  report-production-incident:
    needs: verify-production-feed
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Open, update, or resolve the updater-feed incident
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.verify-production-feed.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/report_hive_release_feed_incident.py \
            --result "$RESULT" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$RUN_URL"

version: '3.8'

services:
  qsdm-node1:
    image: qsdm:latest
    container_name: qsdm-node1
    restart: unless-stopped
    ports:
      - "8080:8080"  # Network port
      - "127.0.0.1:8081:8081"  # Dashboard (host loopback only)
    volumes:
      - qsdm-data1:/data
      - qsdm-logs1:/logs
    environment:
      - NODE_ID=node1
      - NETWORK_PORT=8080
      - DASHBOARD_PORT=8081
      # Bind the dashboard to all interfaces INSIDE the container: Docker
      # routes to the container's non-loopback interface, so the process
      # default of 127.0.0.1 would be unreachable. Host-side exposure is
      # controlled by the 127.0.0.1 prefix on the port publish above.
      - QSDM_DASHBOARD_BIND_ADDRESS=0.0.0.0
      - STORAGE_TYPE=sqlite
      - STORAGE_PATH=/data/qsdm.db
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
      - CUDA_ENABLED=true
    networks:
      - qsdm-network
    healthcheck:
      # Dashboard /api/health is behind requireAuth (dashboard.go:294); it
      # only answered 200 because a nil auth manager used to fall through
      # unauthenticated. Probe the API's public liveness route instead.
      test: ["CMD", "wget", "-q", "-t", "1", "-O", "/dev/null", "http://localhost:8080/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qsdm-node2:
    image: qsdm:latest
    container_name: qsdm-node2
    restart: unless-stopped
    ports:
      - "8082:8080"  # Network port
      - "127.0.0.1:8083:8081"  # Dashboard (host loopback only)
    volumes:
      - qsdm-data2:/data
      - qsdm-logs2:/logs
    environment:
      - NODE_ID=node2
      - NETWORK_PORT=8080
      - DASHBOARD_PORT=8081
      # Bind the dashboard to all interfaces INSIDE the container: Docker
      # routes to the container's non-loopback interface, so the process
      # default of 127.0.0.1 would be unreachable. Host-side exposure is
      # controlled by the 127.0.0.1 prefix on the port publish above.
      - QSDM_DASHBOARD_BIND_ADDRESS=0.0.0.0
      - STORAGE_TYPE=sqlite
      - STORAGE_PATH=/data/qsdm.db
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
      - CUDA_ENABLED=true
    networks:
      - qsdm-network
    healthcheck:
      # Dashboard /api/health is behind requireAuth (dashboard.go:294); it
      # only answered 200 because a nil auth manager used to fall through
      # unauthenticated. Probe the API's public liveness route instead.
      test: ["CMD", "wget", "-q", "-t", "1", "-O", "/dev/null", "http://localhost:8080/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qsdm-node3:
    image: qsdm:latest
    container_name: qsdm-node3
    restart: unless-stopped
    ports:
      - "8084:8080"  # Network port
      - "127.0.0.1:8085:8081"  # Dashboard (host loopback only)
    volumes:
      - qsdm-data3:/data
      - qsdm-logs3:/logs
    environment:
      - NODE_ID=node3
      - NETWORK_PORT=8080
      - DASHBOARD_PORT=8081
      # Bind the dashboard to all interfaces INSIDE the container: Docker
      # routes to the container's non-loopback interface, so the process
      # default of 127.0.0.1 would be unreachable. Host-side exposure is
      # controlled by the 127.0.0.1 prefix on the port publish above.
      - QSDM_DASHBOARD_BIND_ADDRESS=0.0.0.0
      - STORAGE_TYPE=sqlite
      - STORAGE_PATH=/data/qsdm.db
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
      - CUDA_ENABLED=true
    networks:
      - qsdm-network
    healthcheck:
      # Dashboard /api/health is behind requireAuth (dashboard.go:294); it
      # only answered 200 because a nil auth manager used to fall through
      # unauthenticated. Probe the API's public liveness route instead.
      test: ["CMD", "wget", "-q", "-t", "1", "-O", "/dev/null", "http://localhost:8080/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Monitoring stack
  prometheus:
    image: prom/prometheus:latest
    container_name: qsdm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - qsdm-network

  grafana:
    image: grafana/grafana:latest
    container_name: qsdm-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - qsdm-network

volumes:
  qsdm-data1:
    driver: local
  qsdm-data2:
    driver: local
  qsdm-data3:
    driver: local
  qsdm-logs1:
    driver: local
  qsdm-logs2:
    driver: local
  qsdm-logs3:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  qsdm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16


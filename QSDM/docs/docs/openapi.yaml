          in: path
          required: true
          description: Trace id, as listed by GET /contracts/traces.
          schema:
            type: string
      responses:
        '200':
          description: Call trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCallTrace'
        '401':
          description: Missing, malformed, invalid or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No retained trace has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':

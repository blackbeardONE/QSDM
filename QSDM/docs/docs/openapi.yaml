              schema:
                $ref: '#/components/schemas/Error'

  /contracts/traces/ws:
    get:
      tags:
        - Contracts
      summary: Stream recent contract call traces over WebSocket
      description: |
        Upgrades the connection to a WebSocket and sends one text message at once and then every 2 seconds: a JSON object with type "contract_traces", timestamp (RFC 3339 time) and traces (the n most recent ContractCallTrace objects, newest first, or null when none are retained). Client messages are ignored; the stream ends when a write fails. The handler does not check the method itself; the WebSocket upgrader answers 405 to a handshake that does not use GET. Answers 503 until a contract engine with a call tracer is attached to the API server.
      operationId: streamContractTraces
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      parameters:
        - name: n
          in: query
          required: false
          description: Number of recent traces in each message. Values that are not positive integers fall back to 10.
          schema:
            type: integer
            format: int64
            default: 10
      responses:
        '101':
          description: Switching Protocols. The server then streams the trace messages described above.
        '400':
          description: Not a valid WebSocket handshake (Connection or Upgrade header missing, unsupported Sec-WebSocket-Version, or bad Sec-WebSocket-Key). Plain-text body.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing, malformed, invalid or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: A WebSocket handshake with a method other than GET. Plain-text body.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: The upgrade failed because the response writer does not support connection hijacking. Plain-text body.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: No contract engine or call tracer is attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/trace/{trace_id}:
    get:
      tags:
        - Contracts
      summary: Get one contract call trace
      description: |
        Returns a retained call trace by id. Answers 503 until a contract engine with a call tracer is attached to the API server.

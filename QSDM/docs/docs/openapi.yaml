        consensus task store or, without one, a replay of the task-action log
        named by QSDM_TASK_ACTION_LOG_PATH), manifest fields and live stake,
        reward and submission figures replace the registry values of the
        tasks it covers. With
        neither the registry file nor task state configured the answer is 200
        with `configured: false` and no tasks. Rate limit: 600 GET requests
        per minute per client IP and path; the default per-IP limit and the
        per-role limit do not apply.
      operationId: listTasks
      x-qsdm-access: public
      responses:
        '200':
          description: The merged task catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksListResponse'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            The registry file cannot be read or parsed, or replaying the
            task-action log failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/state:
    get:
      tags:
        - Tasks
      summary: List task state
      description: |
        Returns every task in the task state store (stake, reward pool,
        rewards, participants and submissions) with a fingerprint of the whole
        store. On a validator with consensus wiring the store is the live
        chain state (`source: chain`); otherwise, when
        QSDM_TASK_ACTION_LOG_PATH is set, the store is rebuilt from that log
        on every request (`source: operator-overlay`); otherwise it is empty
        and `configured` is false. Rate limit: 600 GET requests per minute per
        client IP and path; the default per-IP limit and the per-role limit do
        not apply.
      operationId: listTaskStates
      x-qsdm-access: public
      responses:
        '200':
          description: The task state store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatesResponse'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Replaying the task-action log failed (operator-overlay mode only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/actions:
    get:
      tags:
        - Tasks
      summary: List logged task actions
      description: |
        Returns records of the signed task-action log named by
        QSDM_TASK_ACTION_LOG_PATH in log order (oldest first), optionally
        filtered. The limit counts matching records from the start of the
        log, so when more records match than the limit allows, the newest
        ones are left out. Without the log path the answer is 200 with
        `configured: false` and no actions. Rate limit: 600 GET requests per
        minute per client IP and path; the default per-IP limit and the
        per-role limit do not apply.
      operationId: listTaskActions
      x-qsdm-access: public
      parameters:
        - name: task_id
          in: query
          required: false
          description: Return only actions for this task ID (exact match after trimming).
          schema:
            type: string
        - name: sender
          in: query
          required: false
          description: Return only actions from this wallet address (exact match after trimming and lower-casing).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of records. A missing, zero or non-numeric value
            means 100, and values above 500 are reduced to 500. A negative
            value removes the limit and returns every matching record.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Matching log records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskActionsListResponse'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The task-action log cannot be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/actions/submit-signed:
    post:
      tags:
        - Tasks
      summary: Submit a wallet-signed task action
      description: |
        Verifies an ML-DSA signed task action, adds it to the validator
        mempool as a `qsdm/tasks/v1` transaction, then appends it to the
        task-action log named by QSDM_TASK_ACTION_LOG_PATH. An action ID that
        is already in the log is refused with 409; this handler does not check
        the nonce. Answers 503 when the log path is not set, the node wallet
        service is unavailable, or no task mempool is installed.
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: submitSignedTaskAction
      x-qsdm-access: public
      x-qsdm-follower: refused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskActionEnvelope'
      responses:
        '200':
          description: |
            Accepted: added to the mempool (`mempool_status` is `submitted`,
            or `duplicate` when the mempool already held this transaction) and
            appended to the log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskActionSubmitResponse'
        '400':
          description: |
            The body does not decode as an envelope within 1 MiB, a field
            fails validation, or `sender` is not hex(sha256(public_key)).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not POST.
          headers:
            Allow:
              description: The allowed method, POST.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The action ID is already in the log (`status` is `duplicate`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskActionSubmitResponse'
        '422':
          description: |
            `public_key` or `signature` is not valid hex, or the signature does
            not verify (Error body); or the mempool refused the transaction
            (TaskActionSubmitResponse with `status: rejected` and
            `mempool_status` set to `rejected` or `encode_failed`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/TaskActionSubmitResponse'
        '500':
          description: |
            Reading or appending the log failed. When appending fails, the
            action may already be in the mempool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            QSDM_TASK_ACTION_LOG_PATH is not set, the wallet service is
            unavailable, or the node is a read-only follower (Error body); or
            no task mempool is installed (TaskActionSubmitResponse with
            `status: rejected` and `mempool_status: not_configured`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/TaskActionSubmitResponse'

  /tasks/actions/{action_id}:
    get:
      tags:
        - Tasks
      summary: Get one logged task action
      description: |
        Returns the task-action log record whose envelope `id` equals
        `action_id`. Only the first 500 records of the log are searched, so a
        later action answers 404. Answers 503 when QSDM_TASK_ACTION_LOG_PATH
        is not set. Rate limit: 600 GET requests per minute per client IP and
        path; the default per-IP limit and the per-role limit do not apply.
      operationId: getTaskAction
      x-qsdm-access: public
      parameters:
        - name: action_id
          in: path
          required: true
          description: Action ID, compared after trimming spaces and slashes.
          schema:
            type: string
      responses:
        '200':
          description: The log record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskActionRecord'
        '400':
          description: The action ID is blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No record with this ID among the first 500 log records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The task-action log cannot be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: QSDM_TASK_ACTION_LOG_PATH is not set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{task_id}:
    get:
      tags:
        - Tasks
      summary: Get one catalog task
      description: |
        Returns one task from the merged catalog that GET /tasks serves,
        together with the catalog sources and fingerprint. Rate limit: 600 GET
        requests per minute per client IP and path; the default per-IP limit
        and the per-role limit do not apply.
      operationId: getTask
      x-qsdm-access: public
      parameters:
        - name: task_id
          in: path
          required: true
          description: |
            Task ID, matched exactly. The handler URL-unescapes the value once
            more after the router has decoded it. A task whose ID is `state`
            or `actions` cannot be read here, because those paths are other
            routes.
          schema:
            type: string
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: The task ID is blank or is not a valid URL-escaped string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No catalog task has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            The registry file cannot be read or parsed, or replaying the
            task-action log failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{task_id}/state:
    get:
      tags:
        - Tasks
      summary: Get the state of one task
      description: |
        Returns one task's entry in the task state store described under
        GET /tasks/state. A catalog task that has no state yet returns an
        empty state (zero amounts, no participants or submissions); a task
        that has state but is not in the catalog is still returned. Rate
        limit: 600 GET requests per minute per client IP and path; the default
        per-IP limit and the per-role limit do not apply.
      operationId: getTaskState
      x-qsdm-access: public
      parameters:
        - name: task_id
          in: path
          required: true
          description: |
            Task ID, matched exactly. The handler URL-unescapes the value once
            more after the router has decoded it.
          schema:
            type: string
      responses:
        '200':
          description: The task's state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStateResponse'
        '400':
          description: The task ID is blank or is not a valid URL-escaped string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The task is neither in the catalog nor in the task state store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            The registry file cannot be read or parsed, or replaying the
            task-action log failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{task_id}/submissions:
    get:
      tags:
        - Tasks
      summary: Get the submissions of one task
      description: |
        Returns the `submissions` map of one catalog task, keyed by round and
        then by sender: from task state when the task has state, otherwise
        from its registry entry. Rate limit: 600 GET requests per minute per
        client IP and path; the default per-IP limit and the per-role limit do
        not apply.
      operationId: getTaskSubmissions
      x-qsdm-access: public
      parameters:
        - name: task_id
          in: path
          required: true
          description: |
            Task ID, matched exactly. The handler URL-unescapes the value once
            more after the router has decoded it.
          schema:
            type: string
      responses:
        '200':
          description: The task's submissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionsResponse'
        '400':
          description: The task ID is blank or is not a valid URL-escaped string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No catalog task has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            The registry file cannot be read or parsed, or replaying the
            task-action log failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /streams/nonce:
    get:
      tags:
        - Streams
      summary: Get the next consensus stream-action nonce
      description: |
        Returns the exact current account nonce required by the sender's next
        `qsdm/streams/v1` action. This is not `/wallet/nonce.next`: wallet
        transfer envelopes use a one-based wire nonce, while contract actions
        use the account's current expected nonce. An account the ledger does
        not hold yet returns `action_nonce: 0` with `present: false`; receipt
        and settle actions may create that account. The address is looked up
        as sent (trimmed, not lower-cased). Answers 503 when no consensus
        account state is installed on this node.
      operationId: getStreamActionNonce
      x-qsdm-access: public
      parameters:
        - name: sender
          in: query
          required: true
          description: |
            Wallet address, 32 to 128 hex characters. Stream actions use the
            64-character lower-case form.
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{32,128}$'
      responses:
        '200':
          description: Current consensus action nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamActionNonceResponse'
        '400':
          description: Missing or invalid sender
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Consensus account state is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /streams/actions/submit-signed:
    post:
      tags:
        - Streams
      summary: Submit a wallet-signed CELL stream action
      description: |
        Accepts an ML-DSA-87 signed `qsdm/streams/v1` action. The action's
        shape, the wallet signature and the current consensus nonce are
        verified before mempool admission; unknown JSON fields are rejected.
        Consensus application verifies the signature again and applies the
        stateful rules (stream existence, payer or provider role, receipt
        sequence and session signature, budget and time limits), so a 200
        does not guarantee that the action applies. Supported actions are
        open, receipt, pause, resume, settle, and close. Answers 503 when no
        stream mempool or no consensus account state is installed.
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: submitSignedStreamAction
      x-qsdm-access: public
      x-qsdm-follower: refused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamActionEnvelope'
      responses:
        '200':
          description: |
            Action accepted (`mempool_status: submitted`) or already present in
            the mempool (`mempool_status: duplicate`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamActionSubmitResponse'
        '400':
          description: |
            Malformed envelope: JSON that does not decode into the envelope
            (wrong types or an unknown field), or a body over 1 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not POST.
          headers:
            Allow:
              description: The allowed method, POST.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Invalid action shape or signature, a nonce other than the sender's
            current consensus nonce, or a mempool rejection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Stream submission or live consensus account state is not
            configured, or the node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /streams:
    get:
      tags:
        - Streams
      summary: List CELL streams
      description: |
        Returns every stream in the consensus stream store that passes the
        optional filters, sorted by stream ID, without paging. Answers 503
        when no stream state is installed on this node.
      operationId: listStreams
      x-qsdm-access: public
      parameters:
        - name: payer
          in: query
          required: false
          description: Payer wallet address, compared case-insensitively.
          schema:
            type: string
        - name: provider
          in: query
          required: false
          description: Provider wallet address, compared case-insensitively.
          schema:
            type: string
        - name: service_id
          in: query
          required: false
          description: Service ID, exact match after trimming.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: |
            Stream status (`active`, `paused` or `closed`), compared
            case-insensitively; any other value matches nothing.
          schema:
            type: string
      responses:
        '200':
          description: Consensus stream projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamsResponse'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Stream state is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /streams/{stream_id}:
    get:
      tags:
        - Streams
      summary: Get one CELL stream
      description: |
        Returns one stream from the consensus stream store. Answers 503 when
        no stream state is installed on this node; that check comes before the
        stream ID is examined.
      operationId: getStream
      x-qsdm-access: public
      parameters:
        - name: stream_id
          in: path
          required: true
          description: |
            Stream ID, at most 128 bytes after URL decoding (the handler
            unescapes the value once more after the router has decoded it).
            IDs accepted by `open` match the pattern; other values answer 404,
            except `actions`, which answers 400.
          schema:
            type: string
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
      responses:
        '200':
          description: Consensus stream projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamResponse'
        '400':
          description: |
            The stream ID is blank or `actions`, is not a valid URL-escaped
            string, or is longer than 128 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Stream state is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /mining/work:
    get:
      tags:
        - Mining
      summary: Get mining work
      description: |
        Returns the work payload a miner solves for one block height.
        Without `height` the handler asks the MiningService for the tip
        height + 1 (the reference service clamps a height above the tip
        down to the tip). Returns 503 until a MiningService is installed,
        and while the service reports that work is unavailable.
        Bypasses the API rate limiters; the audit log records successful
        requests at DEBUG level.
      operationId: miningWork
      x-qsdm-access: public
      parameters:
        - name: height
          in: query
          required: false
          description: Block height, unsigned decimal. Defaults to the tip height + 1.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Work payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningWork'
        '400':
          description: height is not an unsigned decimal integer (plain text `invalid height`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '500':
          description: The MiningService failed to build the work payload (plain-text error).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: No MiningService installed, or the service reports work unavailable.
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /mining/submit:
    post:
      tags:
        - Mining
      summary: Submit a mining proof
      description: |
        Submits one proof to the MiningService. The body must be
        byte-identical to the canonical proof encoding
        (`mining.Proof.CanonicalJSON`); any other encoding is rejected
        with reject_reason `non-canonical`. Bodies over 1 MiB are
        rejected with 400. Returns 503 until a MiningService is
        installed, and while the service reports mining unavailable.
        Bypasses the API rate limiters; the audit log records successful
        requests at DEBUG level. A recovery producer
        (QSDM_RECOVERY_SIGNED_TRANSFERS_ENABLED=1) admits this route only
        while the mining canary admission is open, and otherwise answers 503.
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: miningSubmit
      x-qsdm-access: public
      x-qsdm-follower: refused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiningProof'
      responses:
        '200':
          description: Proof accepted (`accepted` true, `proof_id` set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningSubmitResponse'
        '400':
          description: |
            Proof rejected (JSON with `accepted` false, `reject_reason` and
            `detail`), or the body could not be read (plain text starting
            `read body:`, for example when it exceeds 1 MiB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningSubmitResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than POST (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, POST.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '500':
          description: Unexpected MiningService error (JSON with `accepted` false and `detail` only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningSubmitResponse'
        '503':
          description: No MiningService installed, or the service reports mining unavailable.
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /mining/account:
    get:
      tags:
        - Mining
      summary: Account balance and nonce
      description: |
        Reads one address from the node's canonical account store: CELL
        balance, account nonce, and whether the store has the address.
        Lets a miner check that rewards landed and pick the nonce of its
        next enrollment transaction. Returns 503 until a
        MiningAccountProbe is installed. Bypasses the API rate limiters.
      operationId: miningAccount
      x-qsdm-access: public
      parameters:
        - name: address
          in: query
          required: true
          description: Account address.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Balance snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningAccount'
        '400':
          description: address is missing or empty (plain text `address parameter is required`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: No MiningAccountProbe installed.
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /mining/emission:
    get:
      tags:
        - Mining
      summary: Emission schedule snapshot
      description: |
        Returns the mining emission schedule state at the chain tip:
        per-block reward, cumulative emission, remaining supply and the
        next halving. Returns 503 until a MiningEmissionProbe is
        installed. Bypasses the API rate limiters.
      operationId: miningEmission
      x-qsdm-access: public
      responses:
        '200':
          description: Emission snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningEmission'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: No MiningEmissionProbe installed.
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /mining/blocks:
    get:
      tags:
        - Mining
      summary: Recent block headers
      description: |
        Returns the block headers of the inclusive height range
        [from, to], ascending by height. `limit` only sets the default
        `from` (max(0, to - limit + 1)); a range wider than 200 heights
        is rejected. `to` is not clamped here and is echoed as given;
        headers stop at the tip. Returns 503 until a MiningBlocksProbe is
        installed. Bypasses the API rate limiters.
      operationId: miningBlocks
      x-qsdm-access: public
      parameters:
        - name: from
          in: query
          required: false
          description: First height. Defaults to max(0, to - limit + 1).
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: to
          in: query
          required: false
          description: Last height. Defaults to the tip.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Window used for the default `from`. 0 or absent means 20; values above 200 are treated as 200.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 20
      responses:
        '200':
          description: Header page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningBlocksPage'
        '400':
          description: from, to or limit is not an unsigned integer, from is greater than to, or the range exceeds 200 headers (plain text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: No MiningBlocksProbe installed.
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /receipts:
    get:
      tags:
        - Receipts
      summary: Recent transactions list
      description: |
        Height-range list endpoint that powers the chain dashboard's
        "recent transactions" tile. Public: anyone observing the
        chain can independently render the recent-tx stream without
        an operator session. Returns 503 until a probe is wired.
        Receipts come newest first (heights from `to` down to `from`,
        block order within a height), at most `limit` of them. `to`
        defaults to the tip and is clamped to it; `from` defaults to
        max(0, to - limit + 1).
      operationId: receiptsRecent
      x-qsdm-access: public
      parameters:
        - name: from
          in: query
          required: false
          description: Lowest height. Defaults to max(0, to - limit + 1).
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: to
          in: query
          required: false
          description: Highest height. Defaults to the tip; larger values are clamped to the tip.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Maximum receipts returned, and the window for the default `from`. 0 or absent means 20; values above 200 are treated as 200.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 20
      responses:
        '200':
          description: Recent receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptListPage'
        '400':
          description: from, to or limit is not an unsigned integer, or from is greater than to (plain text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: Receipts probe not wired
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /receipts/{tx_id}:
    get:
      tags:
        - Receipts
      summary: Per-transaction receipt
      description: |
        Read-only per-tx outcome probe (TxApplied / TxFailed log +
        status code). Receipts live on-chain implicitly via the
        state-root hash, so exposing them publicly is the canonical
        "trust transparency" posture: anyone who saw a tx submission
        can independently confirm it landed and at what status.
        Everything after `/receipts/` is the tx_id. Returns 503 until
        a receipt probe is wired.
      operationId: receiptByTxID
      x-qsdm-access: public
      parameters:
        - name: tx_id
          in: path
          required: true
          description: Transaction ID, at most 256 bytes.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptView'
        '400':
          description: tx_id is empty or longer than 256 bytes (plain text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '404':
          description: No receipt for tx_id (plain text `receipt not found`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: Receipts probe not wired
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /mining/spec-anomalies:
    get:
      tags:
        - Mining
      summary: Recent GPU spec anomalies
      description: |
        Tier-2 telemetry advisory output: the checker's counters plus the
        newest records whose claimed GPU specs disagreed with the
        reference catalog or named an unknown SKU, newest first.
        Advisory only; anomalies do not reject proofs. Returns 503 until
        a spec-anomalies probe is installed (the reference node installs
        it when QSDM_SPEC_CHECK_ENABLED is set). Bypasses the API rate
        limiters.
      operationId: miningSpecAnomalies
      x-qsdm-access: public
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum records. Values above 500 are treated as 500.
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 50
      responses:
        '200':
          description: Counters and recent anomalies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecAnomaliesResponse'
        '400':
          description: limit is not an integer, or is 0 or negative (plain text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: No spec-anomalies probe installed.
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /mining/penalty:
    get:
      tags:
        - Mining
      summary: Tier-3 reward penalty state
      description: |
        Tier-3 reward-downgrade state. With `address`, returns that
        miner's sliding-window snapshot; a miner the engine has not seen
        gets a zero snapshot with `multiplier` 1.0, still 200. Without
        `address`, returns every tracked miner plus the resolved penalty
        config. Returns 503 until a penalty probe is installed (the
        reference node installs it when both QSDM_SPEC_CHECK_ENABLED and
        QSDM_SPEC_PENALTY_ENABLED are set). Bypasses the API rate
        limiters.
      operationId: miningPenalty
      x-qsdm-access: public
      parameters:
        - name: address
          in: query
          required: false
          description: Miner address. When present, only that miner is returned.
          schema:
            type: string
      responses:
        '200':
          description: PenaltyView when `address` is given, otherwise PenaltyOverview.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PenaltyView'
                  - $ref: '#/components/schemas/PenaltyOverview'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: No penalty probe installed.
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /mining/challenge:
    get:
      tags:
        - Mining
      summary: Issue a mining challenge
      description: |
        Mints a fresh challenge (nonce, issue time, signer id,
        signature) on every call; nothing is cached and the response
        carries `Cache-Control: no-store`. A version 2 proof echoes the
        nonce and issued_at in its attestation. Returns 503 until a
        ChallengeIssuer is installed. Bypasses the API rate limiters; the
        audit log records successful requests at DEBUG level.
      operationId: miningChallenge
      x-qsdm-access: public
      responses:
        '200':
          description: Fresh challenge.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '500':
          description: The issuer failed (plain text starting `challenge issuer error:`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: No ChallengeIssuer installed.
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /mining/enroll:
    post:
      tags:
        - Enrollment
      summary: Submit a signed enrollment
      description: |
        Admits a signed qsdm/enroll/v2 transaction whose payload kind is
        `enroll` to the mempool. The handler checks the envelope fields,
        the ML-DSA-87 signature and the payload kind; the mempool
        admission gate then validates the payload fields. 202 means the
        transaction is in the pool, not that the enrollment succeeded:
        balance and node_id / gpu_uuid uniqueness are checked when a block
        applies it. After admission the original envelope is relayed to
        peers when P2P broadcast is configured. Returns 503 until an
        enrollment mempool is installed. Bypasses the API rate limiters.
        A recovery producer (QSDM_RECOVERY_SIGNED_TRANSFERS_ENABLED=1) also
        answers 503.
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: miningEnroll
      x-qsdm-access: public
      x-qsdm-follower: refused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentSubmitRequest'
      responses:
        '202':
          description: Transaction admitted to the mempool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningTxAccepted'
        '400':
          description: |
            Plain text. The body is not one JSON object of the request
            shape (unknown fields and trailing values are rejected); id,
            sender or payload_b64 is missing; contract_id is not
            `qsdm/enroll/v2`; public_key or sender fails envelope
            verification; payload_b64 is not valid base64; the payload has
            no `kind` or its kind is not `enroll`; or the mempool rejected
            the transaction (`rejected: ...`, including payload-field
            validation and a nonce already pending for the sender).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than POST (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, POST.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '409':
          description: A transaction with this id is already in the pool (plain text `tx already in pool`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '422':
          description: signature is not 4627-byte hex or does not verify against public_key (plain text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: |
            No enrollment mempool installed (JSON body, Retry-After: 5), or
            the mempool is full (plain text `mempool full; retry later`,
            no Retry-After).
          headers:
            Retry-After:
              description: Always 5 (seconds); sent only with the JSON body.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'

  /mining/unenroll:
    post:
      tags:
        - Enrollment
      summary: Submit a signed unenrollment
      description: |
        Admits a signed qsdm/enroll/v2 transaction whose payload kind is
        `unenroll` to the mempool, starting the unbond of an enrolled
        node_id. Same envelope, checks and status codes as
        POST /mining/enroll; ownership and the record state are checked
        when a block applies the transaction. After admission the
        original envelope is relayed to peers when P2P broadcast is
        configured. Returns 503 until an enrollment mempool is installed.
        Bypasses the API rate limiters. A recovery producer
        (QSDM_RECOVERY_SIGNED_TRANSFERS_ENABLED=1) also answers 503.
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: miningUnenroll
      x-qsdm-access: public
      x-qsdm-follower: refused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentSubmitRequest'
      responses:
        '202':
          description: Transaction admitted to the mempool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningTxAccepted'
        '400':
          description: |
            Plain text. The body is not one JSON object of the request
            shape (unknown fields and trailing values are rejected); id,
            sender or payload_b64 is missing; contract_id is not
            `qsdm/enroll/v2`; public_key or sender fails envelope
            verification; payload_b64 is not valid base64; the payload has
            no `kind` or its kind is not `unenroll`; or the mempool
            rejected the transaction (`rejected: ...`, including
            payload-field validation and a nonce already pending for the
            sender).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than POST (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, POST.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '409':
          description: A transaction with this id is already in the pool (plain text `tx already in pool`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '422':
          description: signature is not 4627-byte hex or does not verify against public_key (plain text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: |
            No enrollment mempool installed (JSON body, Retry-After: 5), or
            the mempool is full (plain text `mempool full; retry later`,
            no Retry-After).
          headers:
            Retry-After:
              description: Always 5 (seconds); sent only with the JSON body.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'

  /mining/enrollment/{node_id}:
    get:
      tags:
        - Enrollment
      summary: Enrollment record by node_id
      description: |
        Returns the on-chain enrollment record of one node_id without its
        HMAC key, plus the derived `phase` and `slashable` fields.
        node_id is the rest of the path after `/mining/enrollment/`; one
        trailing `/` is ignored and any other `/` is rejected. Returns
        503 until an enrollment registry is installed. Bypasses the API
        rate limiters.
      operationId: miningEnrollmentByNodeID
      x-qsdm-access: public
      parameters:
        - name: node_id
          in: path
          required: true
          description: Enrolled node_id, at most 64 bytes, no `/`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: Enrollment record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRecord'
        '400':
          description: node_id is empty, contains `/`, is longer than 64 bytes, or the registry reports it invalid (plain text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '404':
          description: No record for node_id (plain text `no enrollment record for node_id`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '500':
          description: The registry lookup failed (plain text starting `enrollment lookup failed:`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: No enrollment registry installed.
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /mining/enrollments:
    get:
      tags:
        - Enrollment
      summary: List enrollment records
      description: |
        Pages through the enrollment registry in lexicographic node_id
        order. `cursor` is an exclusive lower bound; pass the previous
        page's `next_cursor` to continue. Returns 503 until an enrollment
        lister is installed. Bypasses the API rate limiters.
      operationId: miningEnrollments
      x-qsdm-access: public
      parameters:
        - name: cursor
          in: query
          required: false
          description: Exclusive lower bound on node_id. Empty starts at the beginning.
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: Page size. 0 or absent means 50; the reference registry treats values above 500 as 500.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 50
        - name: phase
          in: query
          required: false
          description: Only records in this phase. Absent or empty means every phase.
          schema:
            type: string
            enum:
              - active
              - pending_unbond
              - revoked
      responses:
        '200':
          description: One page of records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListPage'
        '400':
          description: limit is not a non-negative integer, phase is unknown, or cursor is longer than 64 bytes (plain text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: No enrollment lister installed.
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /mining/slash:
    post:
      tags:
        - Slashing
      summary: Submit a slashing transaction
      description: |
        Admits a qsdm/slash/v1 transaction to the mempool. The handler
        decodes the payload and runs the stateless slash checks; the
        mempool admission gate repeats them and requires a positive fee.
        202 means the transaction is in the pool, not that the slash
        succeeded: evidence, enrollment and stake are checked when a
        block applies it (see GET /mining/slash/{tx_id}). Not public: it
        needs a Bearer JWT and, like every non-public POST, the
        X-Timestamp, X-Nonce and X-Signature request-signing headers.
        Returns 503 until a slashing mempool is installed. Bypasses the
        API rate limiters. A recovery producer
        (QSDM_RECOVERY_SIGNED_TRANSFERS_ENABLED=1) also answers 503.
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: miningSlash
      x-qsdm-access: authenticated
      x-qsdm-follower: refused
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlashSubmitRequest'
      responses:
        '202':
          description: Transaction admitted to the mempool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningTxAccepted'
        '400':
          description: |
            Plain text. The body is not a JSON object of the request shape
            (unknown fields are rejected); id, sender or payload_b64 is
            missing; contract_id is not `qsdm/slash/v1`; payload_b64 is not
            valid base64; the payload does not decode (`payload not a
            valid slash envelope: ...`) or fails the field checks (`slash
            payload invalid: ...`); or the mempool rejected the
            transaction (`rejected: ...`, including a fee that is not
            positive and a nonce already pending for the sender).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than POST (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, POST.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '409':
          description: A transaction with this id is already in the pool (plain text `tx already in pool`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: |
            No slashing mempool installed (JSON body, Retry-After: 5), or
            the mempool is full (plain text `mempool full; retry later`,
            no Retry-After).
          headers:
            Retry-After:
              description: Always 5 (seconds); sent only with the JSON body.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'

  /mining/slash/{tx_id}:
    get:
      tags:
        - Slashing
      summary: Slash receipt by tx_id
      description: |
        Returns the applied or rejected outcome the chain recorded for a
        slash transaction. tx_id is the rest of the path after
        `/mining/slash/`; one trailing `/` is ignored and any other `/` is
        rejected. The reference receipt store keeps at most 10000
        receipts and evicts the oldest first, so an unknown or evicted
        tx_id answers 404. Not public: it needs a Bearer JWT. Returns 503
        until a slash receipt store is installed. Bypasses the API rate
        limiters.
      operationId: miningSlashReceiptByTxID
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      parameters:
        - name: tx_id
          in: path
          required: true
          description: Slash transaction ID, at most 256 bytes, no `/`.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: Slash receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlashReceipt'
        '400':
          description: tx_id is empty, contains `/`, or is longer than 256 bytes (plain text).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '404':
          description: No receipt for tx_id (plain text `no slash receipt for tx_id (unknown or evicted)`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '405':
          description: Method other than GET (plain text `method not allowed`).
          headers:
            Allow:
              description: The accepted method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MiningTextError'
        '503':
          description: No slash receipt store installed.
          headers:
            Retry-After:
              description: Always 5 (seconds).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

components:
  responses:
    SubmeshPolicy422:
      description: |
        Submesh policy: submesh profiles are loaded and the serialized ledger
        record is larger than the strictest positive `max_tx_size` among
        them.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unprocessable Entity
            message: 'payload exceeds submesh max_tx_size: payload size 900 exceeds strictest submesh max_tx_size 512'
            status: 422

    WalletService503:
      description: |
        The node's wallet service did not initialize at startup (on CGO
        builds usually liboqs or OpenSSL; see the server log).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Service Unavailable
            message: "wallet service not available (wallet did not initialize at node startup; check logs \u2014 e.g. liboqs/OpenSSL on CGO builds)"
            status: 503

  parameters:
    NgcIngestSecretPrimary:
      name: X-QSDM-NGC-Secret
      in: header
      required: false
      description: |
        The node's NGC ingest secret (QSDM_NGC_INGEST_SECRET). Send this
        header or the legacy one; the node reads this one first.
      schema:
        type: string

    NgcIngestSecretLegacy:
      name: X-QSDMPLUS-NGC-Secret
      in: header
      required: false
      description: |
        Pre-rebrand name of the same header, read only when X-QSDM-NGC-Secret
        is absent or blank.
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: QSDM token
      description: |
        Access token from `POST /auth/login`: URL-safe base64 of the JSON
        claims, a dot, and URL-safe base64 of the node's signature over them
        (its ML-DSA key, or HMAC-SHA256 with the configured JWT secret in
        builds without one). `POST /auth/logout` revokes it. Requests other
        than GET also need the `X-Timestamp`, `X-Nonce` and `X-Signature`
        headers described in the introduction.

  schemas:
    Error:
      type: object
      description: Error body written by `writeErrorResponse` (pkg/api/middleware.go).
      required:
        - error
        - message
        - status
      properties:
        error:
          type: string
          description: HTTP status text, for example `Bad Request`
        message:
          type: string
          description: What went wrong
        status:
          type: integer
          description: HTTP status code, the same as the response status

    # ------------------------------------------------------------------
    # Health
    # ------------------------------------------------------------------

    HealthResponse:
      type: object
      description: Body of GET /health (HealthCheck in pkg/api/handlers.go).
      required:
        - status
        - timestamp
        - version
        - git_sha
        - build_date
        - product
        - tagline
        - nvidia_lock
      properties:
        status:
          type: string
          enum:
            - healthy
        timestamp:
          type: integer
          format: int64
          description: Server time in Unix seconds.
        version:
          type: string
          description: |
            pkg/buildinfo.Version as injected at build time; "dev" for a build
            made outside the release pipeline. Unlike GET /status, no
            environment fallback is applied.
        git_sha:
          type: string
          description: Commit the binary was built from; "unknown" when not injected.
        build_date:
          type: string
          description: Build timestamp; "unknown" when not injected.
        product:
          type: string
          example: QSDM
        tagline:
          type: string
          example: Quantum-Secure Dynamic Mesh Ledger
        nvidia_lock:
          $ref: '#/components/schemas/HealthNvidiaLock'

    HealthNvidiaLock:
      type: object
      description: NVIDIA-lock posture and NGC ingest counters reported by GET /health.
      required:
        - enabled
        - proof_ok
        - max_proof_age_seconds
        - node_id_binding_enabled
        - hmac_required
        - ingest_nonce_required
        - ingest_nonce_ttl_seconds
        - http_blocks_total
        - ngc_challenge_issued_total
        - ngc_challenge_rate_limited_total
        - ngc_ingest_nonce_pool_size
        - p2p_gate_enabled
        - p2p_rejects_total
        - ngc_proof_ingest
      properties:
        enabled:
          type: boolean
          description: Whether the NVIDIA lock is enabled on this node.
        proof_ok:
          type: boolean
          description: |
            Whether a qualifying NGC proof was ingested within
            max_proof_age_seconds. Evaluated even when the lock is disabled,
            and without consuming the proof.
        max_proof_age_seconds:
          type: integer
          format: int64
          description: Maximum accepted proof age (900 when not configured).
        node_id_binding_enabled:
          type: boolean
          description: True when proofs must carry this node's expected node ID.
        hmac_required:
          type: boolean
          description: True when proofs must carry a valid proof HMAC.
        ingest_nonce_required:
          type: boolean
          description: True when proof ingest must use a nonce from /monitoring/ngc-challenge.
        ingest_nonce_ttl_seconds:
          type: integer
          format: int64
          description: Lifetime of an ingest nonce (600 when not configured).
        http_blocks_total:
          type: integer
          format: int64
          description: State-changing API calls refused by the lock since process start.
        ngc_challenge_issued_total:
          type: integer
          format: int64
          description: Ingest challenges issued since process start.
        ngc_challenge_rate_limited_total:
          type: integer
          format: int64
          description: Challenge requests refused by the rate limiter since process start.
        ngc_ingest_nonce_pool_size:
          type: integer
          format: int64
          description: Ingest nonces currently outstanding.
        p2p_gate_enabled:
          type: boolean
          description: True when the lock is enabled and also gates P2P transaction ingress.
        p2p_rejects_total:
          type: integer
          format: int64
          description: P2P transactions refused by the lock since process start.
        ngc_proof_ingest:
          type: object
          description: Counters for POST /monitoring/ngc-proof since process start.
          required:
            - accepted_total
            - rejected_total
            - rejected_by_reason
          properties:
            accepted_total:
              type: integer
              format: int64
            rejected_total:
              type: integer
              format: int64
            rejected_by_reason:
              type: object
              required:
                - ingest_disabled
                - unauthorized
                - body_read
                - body_too_large
                - invalid_json
                - missing_cuda_hash
                - nonce
                - hmac
                - other
              properties:
                ingest_disabled:
                  type: integer
                  format: int64
                unauthorized:
                  type: integer
                  format: int64
                body_read:
                  type: integer
                  format: int64
                body_too_large:
                  type: integer
                  format: int64
                invalid_json:
                  type: integer
                  format: int64
                missing_cuda_hash:
                  type: integer
                  format: int64
                nonce:
                  type: integer
                  format: int64
                hmac:
                  type: integer
                  format: int64
                other:
                  type: integer
                  format: int64

    HealthLiveResponse:
      type: object
      description: Body of GET /health/live.
      required:
        - status
        - timestamp
        - product
      properties:
        status:
          type: string
          enum:
            - alive
        timestamp:
          type: integer
          format: int64
          description: Server time in Unix seconds.
        product:
          type: string
          example: QSDM

    HealthReadyResponse:
      type: object
      description: Body of GET /health/ready, for both 200 and 503.
      required:
        - status
        - timestamp
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        timestamp:
          type: integer
          format: int64
          description: Server time in Unix seconds.
        checks:
          type: object
          required:
            - storage
            - wallet_service
          properties:
            storage:
              type: string
              description: |
                "ok", or "failed: " followed by the reason ("storage not
                configured" or the error from Ready()).
            wallet_service:
              type: string
              enum:
                - ok
                - unavailable
              description: Informational; never changes the status code.

    # ------------------------------------------------------------------
    # Status
    # ------------------------------------------------------------------

    NodeStatus:
      type: object
      description: Public node status returned by GET /status (StatusResponse in pkg/api/handlers_status.go).
      required:
        - chain_tip
        - peers
        - node_role
        - network
        - coin
        - branding
        - tokenomics
        - task_actions_ready
        - consensus_auth
      properties:
        node_id:
          type: string
          description: |
            Node ID given to the API server with SetBridgeRelay (cmd/qsdm
            passes its libp2p host ID when a bridge relay is configured);
            omitted when empty.
        version:
          type: string
          description: |
            pkg/buildinfo.Version when injected at build time; otherwise
            QSDM_BUILD_VERSION, then QSDMPLUS_BUILD_VERSION, then the Go
            toolchain version (runtime.Version()).
        git_sha:
          type: string
          description: Commit the binary was built from; "unknown" when not injected.
        build_date:
          type: string
          description: Build timestamp; "unknown" when not injected.
        uptime:
          type: string
          description: |
            Time since the process started, as a Go duration string truncated
            to whole seconds (for example 72h3m5s).
        chain_tip:
          type: integer
          format: int64
          description: Current chain height; 0 until the server wires a chain-tip source.
        peers:
          type: integer
          format: int64
          description: Peer count; 0 until the server wires a peer-count source.
        node_role:
          type: string
          enum:
            - validator
            - miner
          description: Configured role; an unset or invalid role is reported as validator.
        network:
          type: string
          description: |
            Network label from branding.NetworkLabel(): "QSDM", a space, a
            U+00B7 middle dot, a space and "CELL".
        coin:
          $ref: '#/components/schemas/NodeStatusCoin'
        branding:
          $ref: '#/components/schemas/NodeStatusBranding'
        tokenomics:
          $ref: '#/components/schemas/NodeStatusTokenomics'
        task_actions_ready:
          type: boolean
          description: |
            True only when signed task actions can be accepted: a task-action
            mempool is wired and QSDM_TASK_ACTION_LOG_PATH is set.
        consensus_auth:
          $ref: '#/components/schemas/ConsensusAuthInfo'
        mining:
          $ref: '#/components/schemas/NodeStatusMining'

    NodeStatusCoin:
      type: object
      description: Native coin metadata from pkg/branding.
      required:
        - name
        - symbol
        - decimals
        - smallest_unit
      properties:
        name:
          type: string
          example: Cell
        symbol:
          type: string
          example: CELL
        decimals:
          type: integer
          format: int64
          example: 8
        smallest_unit:
          type: string
          example: dust

    NodeStatusBranding:
      type: object
      description: Product branding from pkg/branding.
      required:
        - name
      properties:
        name:
          type: string
          example: QSDM
        legacy_name:
          type: string
          description: Previous product name; omitted when empty.
          example: QSDM+
        full_title:
          type: string
          description: Tagline plus the name in parentheses; omitted when empty.
          example: Quantum-Secure Dynamic Mesh Ledger (QSDM)

    NodeStatusTokenomics:
      type: object
      description: |
        Emission-schedule snapshot at the reported chain tip
        (chain.DefaultEmissionSchedule). Amounts are in dust (1 CELL =
        100000000 dust); the *_cell strings are decimal CELL values with 8
        fractional digits, for display only.
      required:
        - cap_dust
        - cap_cell
        - emitted_dust
        - emitted_cell
        - remaining_dust
        - block_reward_dust
        - block_reward_cell
        - current_epoch
        - next_halving_height
        - next_halving_eta_seconds
        - target_block_time_seconds
        - blocks_per_epoch
      properties:
        cap_dust:
          type: integer
          format: int64
          description: Mining cap, the most that will ever be emitted through mining.
        cap_cell:
          type: string
        emitted_dust:
          type: integer
          format: int64
          description: Cumulative mining emission up to and including chain_tip.
        emitted_cell:
          type: string
        remaining_dust:
          type: integer
          format: int64
          description: cap_dust minus emitted_dust (never negative).
        block_reward_dust:
          type: integer
          format: int64
          description: Reward for the next block (chain_tip + 1).
        block_reward_cell:
          type: string
        current_epoch:
          type: integer
          format: int64
          description: Zero-based epoch of chain_tip.
        next_halving_height:
          type: integer
          format: int64
          description: First height of the next epoch; 0 once past the final halving.
        next_halving_eta_seconds:
          type: integer
          format: int64
          description: |
            (next_halving_height - chain_tip) times target_block_time_seconds;
            0 when there is no further halving.
        target_block_time_seconds:
          type: integer
          format: int64
        blocks_per_epoch:
          type: integer
          format: int64

    NodeStatusMining:
      type: object
      description: |
        Mining-protocol posture at the reported chain tip (MiningInfo, built
        by buildMiningInfo). The field is omitempty on a pointer, but this
        handler always sets it. Fork heights use math.MaxUint64 internally
        for "not scheduled"; that sentinel is never sent.
      required:
        - protocol_versions_accepted
        - fork_v2_active
        - fork_v2_tc_active
        - enrollment_contract
        - signed_enrollment_required
        - signed_enrollment_activation_height
        - deferred_bond_from_rewards
        - deferred_bond_activation_height
        - deferred_bond_work_difficulty
      properties:
        protocol_versions_accepted:
          type: array
          description: Proof versions the verifier accepts at chain_tip; [2] once the v2 fork is active, otherwise [1].
          items:
            type: integer
            format: int64
        fork_v2_height:
          type: integer
          format: int64
          description: |
            Activation height of the v2 attestation fork. Omitted when the
            fork is not scheduled, and also when it is scheduled at height 0
            (omitempty drops a zero). Branch on fork_v2_active instead.
        fork_v2_active:
          type: boolean
          description: True when the v2 fork is scheduled and chain_tip has reached it.
        fork_v2_tc_height:
          type: integer
          format: int64
          description: |
            Activation height of the v2 TC fork (pkg/mining.ForkV2TCHeight).
            Omitted when not scheduled or when 0.
        fork_v2_tc_active:
          type: boolean
          description: True when the TC fork is scheduled and chain_tip has reached it.
        attestation_types_required:
          type: array
          description: |
            Accepted Attestation.Type values (nvidia-cc-v1 and nvidia-hmac-v1)
            when the v2 fork is active; omitted otherwise.
          items:
            type: string
        min_enroll_stake_dust:
          type: integer
          format: int64
          description: Stake required for an nvidia-hmac-v1 enrollment, when the v2 fork is active; omitted otherwise.
        enrollment_contract:
          type: string
          description: Enrollment contract ID new submissions must use.
          example: qsdm/enroll/v2
        signed_enrollment_required:
          type: boolean
          description: Always true.
        signed_enrollment_activation_height:
          type: integer
          format: int64
          description: Height from which unsigned v1 enrollments are invalid in blocks.
        deferred_bond_from_rewards:
          type: boolean
          description: |
            True when a zero-balance miner may build its enrollment bond from
            mining rewards: the v2 fork is active and chain_tip has reached
            deferred_bond_activation_height.
        deferred_bond_activation_height:
          type: integer
          format: int64
        deferred_bond_work_difficulty:
          type: integer
          format: int32
          description: Work difficulty required for a deferred-bond enrollment (enrollment.DeferredBondWorkDifficulty).

    ConsensusAuthInfo:
      type: object
      description: Public consensus-authentication rollout posture reported by GET /status.
      required:
        - signed_consensus_supported
        - require_signed_votes
        - signed_message_activation_height
        - signed_consensus_active
        - unsigned_consensus_traffic_accepted
        - task_action_signature_activation_height
        - task_action_signatures_active
        - tx_content_root_activation_height
        - tx_content_root_active
        - poe_activation_height
        - poe_active
      properties:
        signed_consensus_supported:
          type: boolean
          description: True when the binary can sign and verify consensus messages (always true).
        require_signed_votes:
          type: boolean
          description: Configured enforcement flag for signed BFT and consensus artifacts.
        signed_message_activation_height:
          type: integer
          format: int64
          description: |
            Height where unsigned consensus artifacts stop being accepted. 0
            means from genesis: enforcement then depends on
            require_signed_votes alone.
        signed_consensus_active:
          type: boolean
          description: |
            True when require_signed_votes is set and either
            signed_message_activation_height is 0 or the chain tip has reached
            it.
        unsigned_consensus_traffic_accepted:
          type: boolean
          description: The negation of signed_consensus_active.
        task_action_signature_activation_height:
          type: integer
          format: int64
          description: Height where signed task actions become required; 0 means not scheduled.
        task_action_signatures_active:
          type: boolean
          description: True when the activation height is non-zero and the chain tip has reached it.
        tx_content_root_activation_height:
          type: integer
          format: int64
          description: Height where transaction content roots become required; 0 means not scheduled.
        tx_content_root_active:
          type: boolean
          description: True when the activation height is non-zero and the chain tip has reached it.
        poe_activation_height:
          type: integer
          format: int64
          description: |
            First height at which signed wallet transfers must name committed
            parents (Proof-of-Entanglement); 0 means not scheduled.
        poe_active:
          type: boolean
          description: Whether the PoE parent rules govern the next block (chain tip + 1).

    # ------------------------------------------------------------------
    # Versions
    # ------------------------------------------------------------------

    VersionCatalog:
      type: object
      description: Body of GET /versions.
      required:
        - current
        - versions
      properties:
        current:
          type: string
          description: The supported version; always "v1" in this code.
          example: v1
        versions:
          type: array
          description: Every registered version. The order is not guaranteed.
          items:
            $ref: '#/components/schemas/VersionDescriptor'

    VersionDescriptor:
      type: object
      description: One API major version (APIVersion in pkg/api/versioning.go).
      required:
        - name
        - prefix
        - status
        - deprecated_at
        - sunset_at
      properties:
        name:
          type: string
          example: v1
        prefix:
          type: string
          example: /api/v1
        status:
          type: string
          enum:
            - active
            - deprecated
            - sunset
        deprecated_at:
          type: string
          format: date-time
          description: |
            Always present: encoding/json does not omit a zero time.Time, so
            an unset value is 0001-01-01T00:00:00Z.
          example: '0001-01-01T00:00:00Z'
        sunset_at:
          type: string
          format: date-time
          description: Always present; 0001-01-01T00:00:00Z when unset.
          example: '0001-01-01T00:00:00Z'
        successor_version:
          type: string
          description: Omitted when empty.
          example: v2
        migration_guide_url:
          type: string
          description: Omitted when empty.

    # ------------------------------------------------------------------
    # Chain
    # ------------------------------------------------------------------

    ChainBlocksResponse:
      type: object
      description: Body of GET /chain/blocks.
      required:
        - tip
        - from
        - to
        - blocks
      properties:
        tip:
          type: integer
          format: int64
          description: Tip reported by the block source (the durable tip for cmd/qsdm; 0 while unset).
        from:
          type: integer
          format: int64
          description: First height of the window actually served.
        to:
          type: integer
          format: int64
          description: Last height of the window actually served.
        blocks:
          type: array
          description: |
            Blocks the source returned for the window, at most `limit`; an
            empty array (never null) when there are none. Each element is
            passed through as the source serialised it.
          items:
            $ref: '#/components/schemas/ChainBlock'

    ChainBlock:
      type: object
      description: |
        One block as the cmd/qsdm block source serialises it (encoding/json
        of pkg/chain.Block).
      required:
        - height
        - prev_hash
        - hash
        - timestamp
        - transactions
        - state_root
        - total_fees
        - gas_used
        - producer_id
        - producer_auth
      properties:
        height:
          type: integer
          format: int64
        prev_hash:
          type: string
        hash:
          type: string
        timestamp:
          type: string
          format: date-time
        transactions:
          type: array
          nullable: true
          description: Transactions in block order; null when the block's transaction list is nil.
          items:
            $ref: '#/components/schemas/ChainBlockTransaction'
        state_root:
          type: string
        total_fees:
          type: number
          format: double
        gas_used:
          type: integer
          format: int64
        producer_id:
          type: string
        producer_auth:
          $ref: '#/components/schemas/ChainBlockProducerAuth'

    ChainBlockTransaction:
      type: object
      description: |
        A transaction inside a block (pkg/mempool.Tx). Most keys are the Go
        field names, because those fields carry no json tags.
      required:
        - ID
        - Sender
        - Recipient
        - Amount
        - Fee
        - GasLimit
        - Nonce
        - Payload
        - AddedAt
      properties:
        ID:
          type: string
        Sender:
          type: string
        Recipient:
          type: string
        Amount:
          type: number
          format: double
        Fee:
          type: number
          format: double
        GasLimit:
          type: integer
          format: int64
        Nonce:
          type: integer
          format: int64
        Payload:
          type: string
          format: byte
          nullable: true
          description: Base64 payload; null when the payload is nil.
        contract_id:
          type: string
          description: Omitted when empty.
        signature:
          type: string
          description: Omitted when empty.
        public_key:
          type: string
          description: Omitted when empty.
        AddedAt:
          type: string
          format: date-time
          description: Mempool admission time recorded with the transaction.

    ChainBlockProducerAuth:
      type: object
      description: |
        Authenticator for producer_id (pkg/chain.BFTWireAuth). Always present,
        because encoding/json does not omit a struct; {} for an unsigned
        block.
      properties:
        public_key:
          type: string
          format: byte
          description: ML-DSA-87 public key; omitted when empty.
        signature:
          type: string
          format: byte
          description: Omitted when empty.

    ChainParentsResponse:
      type: object
      description: Body of GET /chain/parents (PoEParentsResponse in pkg/api/handlers_poe.go).
      required:
        - tip
        - poe_activation_height
        - poe_active
        - min_parents
        - max_parents
        - window_blocks
        - parents
        - recent
      properties:
        tip:
          type: integer
          format: int64
          description: Durable chain tip the parents were read at.
        poe_activation_height:
          type: integer
          format: int64
          description: 0 means the parent rules are not scheduled.
        poe_active:
          type: boolean
          description: Whether the rules govern the next block (tip + 1).
        min_parents:
          type: integer
          format: int64
          description: Fewest parents a transfer must name (poe.MinParents, 2).
        max_parents:
          type: integer
          format: int64
          description: Most parents a transfer may name (poe.MaxParents, 10).
        window_blocks:
          type: integer
          format: int64
          description: How many recent blocks a parent may come from (poe.ParentWindowBlocks, 8640).
        parents:
          type: array
          description: The suggested parent_cells value, the min_parents most recently committed transaction IDs.
          items:
            type: string
        recent:
          type: array
          description: Up to `limit` committed IDs with their heights, newest first (at least min_parents).
          items:
            $ref: '#/components/schemas/ChainParentRef'

    ChainParentRef:
      type: object
      description: One committed transaction a wallet may name as a parent.
      required:
        - id
        - height
      properties:
        id:
          type: string
        height:
          type: integer
          format: int64

    # ------------------------------------------------------------------
    # Network
    # ------------------------------------------------------------------

    NetworkTopology:
      type: object
      description: Live topology view built by internal/topology.BuildLiveView.
      required:
        - title
        - description
        - live_peer_count
        - cells
        - links
      properties:
        title:
          type: string
          example: Live network topology
        description:
          type: string
          description: Human-readable caption; it differs between the empty and the populated view.
        live_peer_count:
          type: integer
          format: int64
          description: Peers the provider reported, connected or not.
        healthy_peers:
          type: integer
          format: int64
          description: Peers that are connected and have a reputation of 0 or more. Omitted when there are no peers.
        cells:
          type: array
          description: The local node first, then one cell per peer, sorted by region and then ID.
          items:
            $ref: '#/components/schemas/NetworkTopologyCell'
        links:
          type: array
          description: |
            One link from the local node to each peer, then one `adjacent`
            link from each peer to the next one around the ring (none when
            there is only one peer).
          items:
            $ref: '#/components/schemas/NetworkTopologyLink'

    NetworkTopologyCell:
      type: object
      description: |
        One node of the view. The local cell carries only id, label, x, y, z
        and role; peer cells carry every field.
      required:
        - id
        - label
        - x
        - y
        - z
        - role
      properties:
        id:
          type: string
          description: |
            Peer ID, or for the local cell the provider's local ID, falling
            back to the node ID and then to "local".
        label:
          type: string
          description: '"Local node" for the local cell, otherwise the peer ID.'
        x:
          type: number
          format: double
        y:
          type: number
          format: double
          description: Peers sit above the local node when connected and below it when not.
        z:
          type: number
          format: double
        role:
          type: string
          enum:
            - vertex
            - parent
            - stale
            - degraded
          description: |
            vertex for the local node; stale for a peer that is not connected;
            degraded for a connected peer with reputation below -0.25; parent
            otherwise.
        region:
          type: string
        reputation:
          type: number
          format: double
          description: Peer reputation clamped to -1..1.
        messages_in:
          type: integer
          format: int64
          description: Messages received from the peer in the provider's last window.
        latency_ms:
          type: integer
          format: int64
        connected:
          type: boolean

    NetworkTopologyLink:
      type: object
      required:
        - from
        - to
        - kind
      properties:
        from:
          type: string
        to:
          type: string
        kind:
          type: string
          enum:
            - dependency
            - stale
            - degraded
            - adjacent
          description: |
            For local-to-peer links, the peer's state (dependency, stale or
            degraded); adjacent for peer-to-peer ring links.

    # ------------------------------------------------------------------
    # Trust
    # ------------------------------------------------------------------

    TrustSummary:
      type: object
      description: Anti-claim transparency widget payload of GET /trust/attestations/summary.
      required:
        - attested
        - total_public
        - ratio
        - fresh_within
        - last_attested_at
        - last_checked_at
        - ngc_service_status
        - scope_note
      properties:
        attested:
          type: integer
          format: int64
          description: Peers whose latest attestation is within fresh_within.
        total_public:
          type: integer
          format: int64
          description: |
            Every known public peer, attested or not, including this node.
            Always emitted so a UI renders "X of Y", never a bare "X".
        ratio:
          type: number
          format: double
          description: attested / total_public (0..1); 0 when total_public is 0.
        fresh_within:
          type: string
          description: Freshness window as a Go duration string (default 15m0s).
        last_attested_at:
          type: string
          format: date-time
          nullable: true
          description: |
            RFC3339 time of the newest attestation seen, fresh or stale; null
            when no attestation has ever been seen.
        last_checked_at:
          type: string
          format: date-time
          description: RFC3339 time of the refresh that produced this summary.
        ngc_service_status:
          type: string
          enum:
            - healthy
            - degraded
            - outage
          description: |
            healthy when no attestation was ever seen or the newest one is
            within half the window; degraded when fresh attestations exist but
            the newest is older than half the window; outage when attestations
            were seen but none is within the window.
        scope_note:
          type: string
          description: |
            Fixed caveat that the NVIDIA lock is an opt-in, per-operator API
            policy and not a consensus rule (see NVIDIA_LOCK_CONSENSUS_SCOPE.md).
            Included verbatim in every summary so scrapers cannot strip it
            without altering the body.

    TrustAttestation:
      type: object
      description: One row of TrustRecent.attestations.
      required:
        - node_id_prefix
        - attested_at
        - fresh_age_seconds
        - gpu_architecture
        - gpu_available
        - ngc_hmac_ok
        - region_hint
      properties:
        node_id_prefix:
          type: string
          description: |
            First 8 characters of the peer ID, a U+2026 ellipsis character and
            its last 4 characters. IDs shorter than 12 characters are padded
            with "*" first.
        attested_at:
          type: string
          format: date-time
        fresh_age_seconds:
          type: integer
          format: int64
          description: Age of the attestation at the last refresh.
        gpu_architecture:
          type: string
          description: Empty when the source did not report one.
        gpu_available:
          type: boolean
        ngc_hmac_ok:
          type: boolean
        region_hint:
          type: string
          enum:
            - eu
            - us
            - apac
            - other

    TrustRecent:
      type: object
      description: Body of GET /trust/attestations/recent.
      required:
        - fresh_within
        - count
        - attestations
      properties:
        fresh_within:
          type: string
          description: Freshness window as a Go duration string.
        count:
          type: integer
          format: int64
          description: Number of rows in attestations.
        attestations:
          type: array
          nullable: true
          description: |
            Fresh attestations, newest first. null, not an empty array, when
            count is 0.
          items:
            $ref: '#/components/schemas/TrustAttestation'

    TrustError:
      type: object
      description: Error body of the trust endpoints (404 when disabled, 503 while warming up).
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - trust aggregator warming up
            - trust endpoints disabled on this node

    # ------------------------------------------------------------------
    # Audit
    # ------------------------------------------------------------------

    AuditCategory:
      type: string
      description: Checklist category (pkg/audit Category constants).
      enum:
        - cryptography
        - authentication
        - authorisation
        - network
        - smart_contracts
        - bridge
        - storage
        - api
        - governance
        - infrastructure
        - supply_chain
        - runtime
        - secret_rotation
        - rebrand
        - tokenomics
        - mining_audit
        - trust_api

    AuditSeverity:
      type: string
      description: Checklist severity (pkg/audit Severity constants).
      enum:
        - critical
        - high
        - medium
        - low
        - info

    AuditStatus:
      type: string
      description: Checklist status (pkg/audit Status constants).
      enum:
        - pending
        - passed
        - failed
        - waived

    AuditSummary:
      type: object
      description: |
        Wire shape of GET /audit/summary. Mirrors `dashboardAuditSummaryView`
        in `internal/dashboard/audit.go`; pinned by
        `TestAuditAPI_WireParity_DashboardAndAPI`.
      required:
        - summary
        - score
        - has_blocking_findings
        - blocking_count
        - blocking_preview
        - evidence_provenance
        - generated_at
      properties:
        summary:
          type: object
          description: Bucket counts from audit.Checklist.Summary(); all five keys are always present.
          required:
            - total
            - passed
            - pending
            - failed
            - waived
          properties:
            total:
              type: integer
              format: int64
            passed:
              type: integer
              format: int64
            pending:
              type: integer
              format: int64
            failed:
              type: integer
              format: int64
            waived:
              type: integer
              format: int64
        score:
          type: number
          format: double
          description: (passed + waived) / total * 100, from 0 to 100; 0 when the checklist is empty.
        has_blocking_findings:
          type: boolean
          description: |
            True if any critical or high item is still pending or failed. The
            single-bit "is the audit gated?" answer for clients that do not
            want to count buckets.
        blocking_count:
          type: integer
          format: int64
          description: |
            Critical and high items still pending or failed. Distinct from
            the length of blocking_preview, which is capped at 5.
        blocking_preview:
          type: array
          maxItems: 5
          description: |
            Up to 5 still-blocking items in checklist order. Empty array (not
            null) when nothing blocks.
          items:
            $ref: '#/components/schemas/AuditBlockingItem'
        evidence_provenance:
          type: object
          description: |
            Count of the passed items by reviewed_by. The three evidence:*
            buckets are always present (even at zero); any other reviewer
            lands in "other".
          required:
            - 'evidence:live-deploy'
            - 'evidence:in-tree-tests'
            - 'evidence:in-tree'
            - other
          properties:
            'evidence:live-deploy':
              type: integer
              format: int64
            'evidence:in-tree-tests':
              type: integer
              format: int64
            'evidence:in-tree':
              type: integer
              format: int64
            other:
              type: integer
              format: int64
        generated_at:
          type: string
          format: date-time
          description: RFC3339 UTC wall-clock time at response time.

    AuditBlockingItem:
      type: object
      description: One row of AuditSummary.blocking_preview (a critical or high item that is pending or failed).
      required:
        - id
        - category
        - severity
        - status
        - title
      properties:
        id:
          type: string
          example: crypto-01
        category:
          $ref: '#/components/schemas/AuditCategory'
        severity:
          $ref: '#/components/schemas/AuditSeverity'
        status:
          $ref: '#/components/schemas/AuditStatus'
        title:
          type: string

    AuditItemsResponse:
      type: object
      description: Wire shape of GET /audit/items.
      required:
        - items
        - total_matches
        - generated_at
      properties:
        items:
          type: array
          description: Matching items in checklist order; an empty array (not null) when nothing matches.
          items:
            $ref: '#/components/schemas/AuditChecklistItem'
        total_matches:
          type: integer
          format: int64
          description: Always equal to the length of items; explicit so clients can render "showing N matches" without counting.
        filters:
          $ref: '#/components/schemas/AuditEchoedFilters'
        generated_at:
          type: string
          format: date-time
          description: RFC3339 UTC wall-clock time at response time.

    AuditChecklistItem:
      type: object
      description: One pkg/audit.ChecklistItem as serialised by the public API.
      required:
        - id
        - category
        - severity
        - title
        - description
        - status
      properties:
        id:
          type: string
          example: crypto-01
        category:
          $ref: '#/components/schemas/AuditCategory'
        severity:
          $ref: '#/components/schemas/AuditSeverity'
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/AuditStatus'
        notes:
          type: string
          description: Omitted when empty.
        reviewed_by:
          type: string
          description: |
            Who or what verified the item, for example evidence:live-deploy,
            evidence:in-tree-tests, evidence:in-tree or owner-decision.
            Omitted when empty.
        reviewed_at:
          type: string
          format: date-time
          description: Review time; omitted when the item has none.

    AuditEchoedFilters:
      type: object
      description: |
        The filter values the server applied. The whole object is omitted
        when no filter was set; within it, unset filters are omitted.
      properties:
        category:
          $ref: '#/components/schemas/AuditCategory'
        severity:
          $ref: '#/components/schemas/AuditSeverity'
        status:
          $ref: '#/components/schemas/AuditStatus'

    # ------------------------------------------------------------------
    # Attest
    # ------------------------------------------------------------------

    AttestRejectionKind:
      type: string
      description: Rejection site (recentrejects.RejectionKind).
      enum:
        - archspoof_unknown_arch
        - archspoof_gpu_name_mismatch
        - archspoof_cc_subject_mismatch
        - hashrate_out_of_band

    AttestRejectionReason:
      type: string
      description: Counter reason label of an archspoof_* rejection.
      enum:
        - unknown_arch
        - gpu_name_mismatch
        - cc_subject_mismatch

    AttestRecentRejectionsPage:
      type: object
      description: One page of GET /attest/recent-rejections (RecentRejectionsListPageView).
      required:
        - records
        - has_more
        - total_matches
        - filters
      properties:
        records:
          type: array
          description: Matching records in ascending seq order; an empty array (not null) when nothing matches.
          items:
            $ref: '#/components/schemas/AttestRecentRejection'
        next_cursor:
          type: integer
          format: int64
          description: seq of the last record in this page, to pass back as cursor. Omitted when the page is empty.
        has_more:
          type: boolean
          description: True when at least one more record after this page matches the same filters.
        total_matches:
          type: integer
          format: int64
          description: |
            Matches counted while building this page with the store that
            internal/v2wiring installs: the records returned plus one when
            has_more is true. It is not a store-wide total.
        filters:
          $ref: '#/components/schemas/AttestRecentRejectionsFilters'

    AttestRecentRejectionsFilters:
      type: object
      description: |
        The filters the server applied. Always present; unset filters are
        omitted, so the object is {} when none was given.
      properties:
        kind:
          $ref: '#/components/schemas/AttestRejectionKind'
        reason:
          $ref: '#/components/schemas/AttestRejectionReason'
        arch:
          type: string
        since:
          type: integer
          format: int64

    AttestRecentRejection:
      type: object
      description: One rejection record (RecentRejectionView).
      required:
        - seq
        - recorded_at
        - kind
      properties:
        seq:
          type: integer
          format: int64
          description: Store-assigned sequence number, starting at 1.
        recorded_at:
          type: string
          format: date-time
          description: When the verifier observed the rejection.
        kind:
          $ref: '#/components/schemas/AttestRejectionKind'
        reason:
          $ref: '#/components/schemas/AttestRejectionReason'
        arch:
          type: string
          description: |
            For archspoof_unknown_arch, the rejected value the operator
            supplied; for hashrate_out_of_band, the canonical architecture.
            Omitted when empty.
        height:
          type: integer
          format: int64
          description: Chain height the proof claimed; omitted when 0.
        miner_addr:
          type: string
          description: Omitted when empty.
        gpu_name:
          type: string
          description: Bundle-reported GPU name (HMAC path); omitted when empty.
        cert_subject:
          type: string
          description: Leaf certificate subject common name (CC path); omitted when empty.
        detail:
          type: string
          description: Verifier detail string, truncated to 200 runes; omitted when empty.

    # ------------------------------------------------------------------
    # Governance
    # ------------------------------------------------------------------

    GovernanceParams:
      type: object
      description: Body of GET /governance/params (GovernanceParamsView).
      required:
        - active
        - pending
        - registry
        - authorities
        - governance_enabled
      properties:
        active:
          type: object
          description: Parameter name to currently active value; {} (never null) when empty.
          additionalProperties:
            type: integer
            format: int64
        pending:
          type: array
          description: Staged changes sorted by effective_height, then param; [] when none.
          items:
            $ref: '#/components/schemas/GovernancePendingChange'
        registry:
          type: array
          description: Static parameter registry sorted by name.
          items:
            $ref: '#/components/schemas/GovernanceRegistryEntry'
        authorities:
          type: array
          description: Configured governance authorities sorted ascending; [] when governance is disabled.
          items:
            type: string
        governance_enabled:
          type: boolean
          description: False when no authority is configured.

    GovernancePendingChange:
      type: object
      description: One staged parameter change.
      required:
        - param
        - value
        - effective_height
        - submitted_at_height
        - authority
      properties:
        param:
          type: string
        value:
          type: integer
          format: int64
        effective_height:
          type: integer
          format: int64
        submitted_at_height:
          type: integer
          format: int64
        authority:
          type: string
        memo:
          type: string
          description: Omitted when empty.

    GovernanceRegistryEntry:
      type: object
      description: One entry of the static parameter registry.
      required:
        - name
        - description
        - min_value
        - max_value
        - default_value
        - unit
      properties:
        name:
          type: string
        description:
          type: string
        min_value:
          type: integer
          format: int64
        max_value:
          type: integer
          format: int64
        default_value:
          type: integer
          format: int64
        unit:
          type: string

    GovernanceParam:
      type: object
      description: Body of GET /governance/params/{name} (GovernanceParamView).
      required:
        - name
        - active_value
        - registry
      properties:
        name:
          type: string
        active_value:
          type: integer
          format: int64
          description: Value from the snapshot's active map; 0 when the map has no entry for this name.
        pending:
          $ref: '#/components/schemas/GovernancePendingChange'
        registry:
          $ref: '#/components/schemas/GovernanceRegistryEntry'

    AuthLoginRequest:
      type: object
      required:
        - address
        - password
      properties:
        address:
          type: string
          description: |
            Account address, a hex string of 32 to 128 characters. Surrounding
            spaces are removed and letters lowercased before the lookup.
          example: 605ab7550bd6c74ce3e5b394c1f6334cea0f6e2951938ae7fc5c775a7e1ac7e2
        password:
          type: string
          format: password

    AuthRegisterRequest:
      type: object
      required:
        - address
        - password
      properties:
        address:
          type: string
          description: |
            Account address, a hex string of 32 to 128 characters, stored
            trimmed and lowercased. The node does not check that the caller
            controls it.
          example: 605ab7550bd6c74ce3e5b394c1f6334cea0f6e2951938ae7fc5c775a7e1ac7e2
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          description: |
            12 to 256 bytes with at least one uppercase letter, one lowercase
            letter, one digit and one punctuation or symbol character. It must
            not contain, in any letter case, `password`, `123456`, `qwerty`,
            `abc123`, `admin`, `letmein`, `welcome` or `monkey`.

    AuthLoginResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
      properties:
        access_token:
          type: string
          description: |
            Bearer token for authenticated routes, valid for 15 minutes:
            base64url(JSON claims) + "." + base64url(signature), signed with the
            node's ML-DSA-87 key, or with HMAC-SHA256 under QSDM_JWT_HMAC_SECRET
            when ML-DSA is unavailable. It is not a three-part JWT.
        refresh_token:
          type: string
          description: |
            Same format with `token_type` refresh, valid for 7 days. No route
            exchanges it for a new access token, and AuthMiddleware does not
            check `token_type`, so it is also accepted as a bearer token.
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds; always 900.
          example: 900

    AuthRegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: user registered successfully
        address:
          type: string
          description: The registered address, trimmed and lowercased.

    AuthLogoutResponse:
      type: object
      properties:
        message:
          type: string
          example: logged out

    CsrfTokenResponse:
      type: object
      properties:
        csrf_token:
          type: string
          description: |
            32 random bytes, base64url encoded with padding (44 characters).
            The same value is set in the `qsdm_csrf` cookie.
        expires_in_seconds:
          type: integer
          format: int64
          description: Token lifetime in seconds; always 3600.
          example: 3600

    WalletCreateResponse:
      type: object
      properties:
        address:
          type: string
          description: Lowercase hex SHA-256 of the new public key (64 characters).
        balance:
          type: number
          format: double
          description: Always 0.

    WalletBalanceResponse:
      type: object
      properties:
        address:
          type: string
          description: The `address` query parameter, unchanged.
        balance:
          type: number
          format: double
          description: Balance in CELL.
        source:
          type: string
          enum:
            - storage
            - mining-ledger
          description: |
            `mining-ledger` when the canonical account store holds the
            address, otherwise `storage`.

    WalletSendRequest:
      type: object
      required:
        - recipient
        - amount
        - fee
      properties:
        recipient:
          type: string
          description: Recipient address, a hex string of 32 to 128 characters.
        amount:
          type: number
          format: double
          minimum: 0.00000001
          maximum: 1000000000
          description: |
            CELL to send. The node truncates it to a whole number when it
            builds the transaction, so a value below 1 answers 500.
        fee:
          type: number
          format: double
          minimum: 0.00000001
          maximum: 1000000000
          description: CELL fee; a zero or missing fee is refused.
        geotag:
          type: string
          maxLength: 100
          description: Optional tag used for submesh routing.
        parent_cells:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[0-9A-Za-z_-]+$'
          description: |
            IDs of earlier transactions. With fewer than two, the node signs
            the placeholders `parent1` and `parent2` instead.

    WalletSendResponse:
      type: object
      properties:
        transaction_id:
          type: string
          description: ID of the transaction the node built (32 hex characters).
        status:
          type: string
          enum:
            - pending
            - duplicate
          description: |
            `pending` on success (201); `duplicate` when the ID was already
            stored (409).

    WalletTransactionEnvelope:
      type: object
      description: |
        A signed `wallet.TransactionData` envelope. Field order in the request
        does not matter: the node rebuilds the canonical signing payload
        itself.
      required:
        - id
        - sender
        - recipient
        - amount
        - public_key
        - signature
      properties:
        id:
          type: string
          description: |
            Transaction ID chosen by the signer; must not be empty. Keep it 16
            to 128 characters from `[0-9A-Za-z_-]` so later transfers can name
            it as a parent. IDs starting with `solo-reward-` or
            `solo-heartbeat-` are reserved, and a validator answers 409 for
            them.
          example: f2a8b4c6d8e1f0a3b5c7d9e2f4a6b8c0
        sender:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex SHA-256 of `public_key`.
          example: 605ab7550bd6c74ce3e5b394c1f6334cea0f6e2951938ae7fc5c775a7e1ac7e2
        recipient:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase 64-character wallet address.
        amount:
          type: number
          format: double
          minimum: 0.00000001
          maximum: 1000000000
          description: CELL to transfer.
        fee:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000
          description: |
            CELL fee: 0, or 0.00000001 to 1000000000. The sender's balance must
            cover `amount + fee`.
        geotag:
          type: string
          maxLength: 100
          description: Optional tag used for submesh routing.
        parent_cells:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[0-9A-Za-z_-]+$'
          description: |
            IDs of earlier transactions. Once Proof-of-Entanglement admission
            is active on a validator: 2 to 10 distinct IDs of transactions
            committed in the last 8640 blocks, none equal to `id`.
        nonce:
          type: integer
          format: int64
          minimum: 0
          description: |
            The sender's last applied nonce + 1. Omitted or 0 marks a legacy
            envelope: it skips the nonce check where it is accepted, and a
            validator refuses it.
        signature:
          type: string
          description: |
            Hex ML-DSA-87 signature over the canonical payload (4627 bytes,
            9254 hex characters).
        public_key:
          type: string
          description: |
            Hex ML-DSA-87 public key (2592 bytes, 5184 hex characters). Not
            part of the signed payload.
        timestamp:
          type: string
          description: Covered by the signature; the node does not check its format or age.
          example: '2026-05-13T15:34:56Z'

    WalletSubmitSignedResponse:
      type: object
      properties:
        transaction_id:
          type: string
          description: The envelope's `id`.
        status:
          type: string
          enum:
            - accepted
            - pending
            - duplicate
          description: |
            `accepted`: settled at once (200). `pending`: queued on a validator
            until its block commits (202). `duplicate`: see the 409 response.
        broadcast:
          type: string
          enum:
            - p2p
            - local-only
            - block-pending
            - ''
          description: |
            After immediate settlement, `p2p` when the envelope was gossiped
            to peers, else `local-only`; `block-pending` on a validator; empty
            for a duplicate reported by the storage backend.

    WalletNonceResponse:
      type: object
      required:
        - sender
        - nonce
        - next
      properties:
        sender:
          type: string
          description: The `sender` query parameter, unchanged.
        nonce:
          type: integer
          format: int64
          minimum: 0
          description: Last applied nonce; 0 when the sender has none yet.
        next:
          type: integer
          format: int64
          minimum: 1
          description: '`nonce + 1`, the value for the next envelope.'

    WalletAddressResponse:
      type: object
      properties:
        address:
          type: string
          description: Address of the node's own wallet (lowercase hex SHA-256 of its public key).

    WalletMintGoneResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - gone
        reason:
          type: string
          description: Fixed text explaining the removal.
        migration:
          type: object
          description: Fixed pointers to replacement workflows.
          properties:
            new_operator_funding:
              type: string
            named_token_minting:
              type: string
            public_testnet:
              type: string

    TokenMintRequest:
      type: object
      required:
        - token_symbol
        - recipient
        - amount
      properties:
        token_symbol:
          type: string
          description: Token symbol, for example `JOLLY`; not checked against the token registry.
        recipient:
          type: string
          description: Recipient; must not be empty, otherwise not checked.
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true

    TokenMintResponse:
      type: object
      properties:
        transaction_id:
          type: string
          description: '`mint_<token_symbol>_<unix nanoseconds>`.'
        token_symbol:
          type: string
        amount:
          type: number
          format: double
        recipient:
          type: string
        status:
          type: string
          enum:
            - minted

    TokenCreateRequest:
      type: object
      required:
        - name
        - symbol
      properties:
        name:
          type: string
          example: Jolly Token
        symbol:
          type: string
          description: Ticker; not checked for uniqueness.
          example: JOLLY
        decimals:
          type: integer
          format: int64
          minimum: 0
          maximum: 18
          description: Defaults to 0 when omitted.
        total_supply:
          type: number
          format: double
          minimum: 0
          description: Recorded only; no balance is issued. Defaults to 0 when omitted.
        description:
          type: string
          description: Stored in the log record only; not returned or listed.

    TokenCreateResponse:
      type: object
      properties:
        token_id:
          type: string
          description: '`token_<symbol>_<unix nanoseconds>`.'
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
          format: int64
        total_supply:
          type: number
          format: double
        status:
          type: string
          enum:
            - created

    TokenInfo:
      type: object
      properties:
        token_id:
          type: string
          example: main_cell
        name:
          type: string
          example: Cell
        symbol:
          type: string
          example: CELL
        decimals:
          type: integer
          format: int64
          example: 8
        total_supply:
          type: number
          format: double

    TokenListResponse:
      type: object
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenInfo'
        count:
          type: integer
          format: int64
          description: Number of entries in `tokens`.

    TransactionSummary:
      type: object
      description: One row of the storage index; a key is absent when its column is empty.
      properties:
        id:
          type: string
        sender:
          type: string
        recipient:
          type: string
        amount:
          type: number
          format: double
        timestamp:
          type: string
          description: When the storage backend recorded the row.

    TransactionListResponse:
      type: object
      properties:
        transactions:
          type: array
          nullable: true
          description: Newest first; `null` when the SQLite backend finds no rows.
          items:
            $ref: '#/components/schemas/TransactionSummary'
        limit:
          type: integer
          format: int64
          description: The limit applied.
        count:
          type: integer
          format: int64
          description: Number of entries in `transactions`.

    TransactionRecord:
      type: object
      additionalProperties: true
      description: |
        The stored transaction JSON (for a wallet transfer, the signed
        envelope fields such as `id`, `fee`, `parent_cells`, `signature` and
        `public_key`), with `sender`, `recipient`, `amount` and `timestamp`
        replaced by the storage index columns when those are set.
      properties:
        id:
          type: string
        sender:
          type: string
        recipient:
          type: string
        amount:
          type: number
          format: double
        timestamp:
          type: string
          description: When the storage backend recorded the transaction, not the signed timestamp.

    ValidatorParentCell:
      type: object
      description: |
        A mesh parent cell. The Go struct has no JSON tags, so its keys are
        `ID` and `Data`; encoding/json matches keys case-insensitively, so
        `id` and `data` work as well.
      properties:
        ID:
          type: string
        Data:
          type: string
          format: byte
          description: Base64; must equal sha256(ID) for the cell to be valid.

    ValidatorValidateRequest:
      type: object
      description: Missing fields are not refused; the result is then `valid` false.
      properties:
        transaction_id:
          type: string
          description: Mesh transaction ID; at least 16 characters and a prefix of the envelope's `id`.
        parent_cells:
          type: array
          description: |
            3 to 5 cells. The first n-1 IDs are the envelope's first n-1
            `parent_cells` and the last is hex(sha256(data)).
          items:
            $ref: '#/components/schemas/ValidatorParentCell'
        data:
          type: string
          format: byte
          description: Base64 of the signed wallet envelope JSON (see WalletTransactionEnvelope).

    ValidatorValidateResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
        message:
          type: string
          description: Why the transaction is invalid; omitted when it is valid.

    NgcChallengeResponse:
      type: object
      properties:
        qsdm_ingest_nonce:
          type: string
          description: Single-use nonce, 48 hex characters.
        expires_at_unix:
          type: integer
          format: int64
          description: Expiry as Unix seconds.
        ttl_seconds:
          type: integer
          format: int64
          description: Nonce lifetime (QSDM_NVIDIA_LOCK_INGEST_NONCE_TTL; 600 when unset).

    NgcProofBundle:
      type: object
      required:
        - cuda_proof_hash
      additionalProperties: true
      description: |
        A JSON object from the NGC sidecar, stored as sent. Only the keys
        below are read by the node. Each `qsdm_` key also has a pre-rebrand
        `qsdmplus_` form that is read when the `qsdm_` one is absent or empty.
      properties:
        cuda_proof_hash:
          description: Required key; any JSON value is accepted.
        qsdm_ingest_nonce:
          type: string
          description: In ingest-nonce mode, an unused nonce from `GET /monitoring/ngc-challenge`.
        qsdm_proof_hmac:
          type: string
          description: |
            Hex HMAC-SHA256 under QSDM_NVIDIA_LOCK_PROOF_HMAC_SECRET. Required
            in ingest-nonce mode, and checked by NVIDIA lock whenever that
            secret is set.
        qsdm_node_id:
          type: string
          description: Compared by NVIDIA lock with QSDM_NVIDIA_LOCK_EXPECTED_NODE_ID when that is set.
        architecture:
          type: string
          description: NVIDIA lock only counts bundles whose value mentions NVIDIA.
        gpu_fingerprint:
          type: object
          additionalProperties: true
          description: NVIDIA lock only counts bundles whose `available` is true.
        timestamp_utc:
          type: string
          description: RFC 3339 time of the proof, copied into the summaries.

    NgcProofIngestResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true

    NgcProofSummary:
      type: object
      description: |
        One row per stored bundle. Apart from `received_at` and
        `gpu_available`, each key is copied from the bundle (any JSON value)
        and is present only when the bundle has the source field.
      properties:
        received_at:
          type: string
          format: date-time
          description: When the node received the bundle (UTC, nanosecond precision).
        timestamp_utc:
          description: The bundle's `timestamp_utc`.
        cuda_proof_hash:
          description: The bundle's `cuda_proof_hash`.
        replay_computation_hash:
          description: The bundle's `replay_computation_hash`.
        ai_computation_hash:
          description: '`ai_proof.ai_computation_hash`; present, possibly null, whenever `ai_proof` is an object.'
        ai_mode:
          description: '`ai_proof.mode`; present, possibly null, whenever `ai_proof` is an object.'
        tensor_operation_proof:
          description: '`tensor_proof.tensor_operation_proof`; present, possibly null, whenever `tensor_proof` is an object.'
        tensor_mode:
          description: '`tensor_proof.mode`; present, possibly null, whenever `tensor_proof` is an object.'
        execution_seconds:
          description: The bundle's `execution_seconds`.
        gpu_available:
          type: boolean
          description: '`gpu_fingerprint.available`, when it is a boolean.'

    NgcProofListResponse:
      type: object
      properties:
        proofs:
          type: array
          description: Oldest first; at most the newest 32 bundles.
          items:
            $ref: '#/components/schemas/NgcProofSummary'
        count:
          type: integer
          format: int64
          description: Number of entries in `proofs`.

    FaucetClaimRequest:
      type: object
      required:
        - address
      properties:
        address:
          type: string
          description: Wallet to fund, 32 to 128 hex characters. Trimmed and lower-cased before use.
        amount:
          type: number
          format: double
          description: Accepted for compatibility and ignored; operator policy decides the grant.

    FaucetClaimResponse:
      type: object
      required:
        - address
        - status
        - amount_granted
        - balance_before
        - balance_after
        - target_balance
        - source
        - checked_at
      properties:
        address:
          type: string
          description: Normalised (lower-case) wallet address.
        status:
          type: string
          enum:
            - funded
            - already_funded
            - already_claimed
        amount_granted:
          type: number
          format: double
          description: CELL paid by this call; 0 unless status is funded.
        balance_before:
          type: number
          format: double
        balance_after:
          type: number
          format: double
          description: Balance after this call, read back from the account activity ledger when the address is present there, otherwise balance_before plus the grant.
        target_balance:
          type: number
          format: double
        source:
          type: string
          enum:
            - qsdm-onboarding-treasury
        treasury_address:
          type: string
          description: Onboarding treasury signer address.
        transaction_id:
          type: string
          description: Payout transaction id; absent when status is already_funded.
        checked_at:
          type: string
          format: date-time

    ReferralRewardPoolStatus:
      type: object
      required:
        - enabled
        - funded
        - claims_enabled
        - claimable
        - pool_address
        - balance
        - reward_per_qualified_referral
        - min_referred_account_nonce
        - registrations
        - qualified
        - claimed
        - pending_claims
        - present
        - source
        - funding_method
        - ledger_configured
        - message
        - checked_at
      properties:
        enabled:
          type: boolean
          description: QSDM_REFERRAL_REWARD_POOL_ENABLED is set.
        funded:
          type: boolean
          description: Enabled, the signer answered with role referral and the expected address, and its balance covers one reward.
        claims_enabled:
          type: boolean
          description: QSDM_REFERRAL_CLAIMS_ENABLED is set, the referral ledger path is configured and a referral treasury signer is configured.
        claimable:
          type: boolean
          description: Funded, claims enabled, and more qualified registrations than paid claims.
        pool_address:
          type: string
          description: Treasury signer address; empty when the pool is disabled, no signer is configured or the signer did not answer.
        balance:
          type: number
          format: double
          description: Treasury signer balance in CELL.
        reward_per_qualified_referral:
          type: number
          format: double
        min_referred_account_nonce:
          type: integer
          format: int64
        registrations:
          type: integer
          format: int64
        qualified:
          type: integer
          format: int64
        claimed:
          type: integer
          format: int64
        pending_claims:
          type: integer
          format: int64
        present:
          type: boolean
          description: The treasury signer answered its status request.
        source:
          type: string
          enum:
            - qsdm-referral-treasury-wallet
        funding_method:
          type: string
          enum:
            - isolated-signer-signed-transfer
        ledger_configured:
          type: boolean
          description: QSDM_REFERRAL_LEDGER_PATH is set.
        message:
          type: string
        checked_at:
          type: string
          format: date-time

    ReferralRegistrationEnvelope:
      type: object
      required:
        - id
        - referrer
        - referred
        - referral_code
        - signature
        - public_key
      properties:
        id:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[0-9A-Za-z_-]+$'
          description: Registration id.
        referrer:
          type: string
          minLength: 32
          maxLength: 128
          pattern: '^[0-9A-Fa-f]+$'
          description: Referrer wallet address; must differ from referred.
        referred:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Referred wallet address; must equal the lower-case hex SHA-256 of public_key.
        referral_code:
          type: string
          pattern: '^[0-9A-Fa-f]{12}$'
          description: Referrer's code, compared case-insensitively with the first 12 hex digits of the SHA-256 of the referrer string as sent.
        install_id:
          type: string
          maxLength: 128
        timestamp:
          type: string
          description: RFC 3339 time no older than 24 hours and no more than 30 seconds in the future, or empty.
        signature:
          type: string
          description: Hex ML-DSA-87 signature by public_key over the canonical envelope described in the operation.
        public_key:
          type: string
          description: Hex ML-DSA-87 public key of the referred wallet.

    ReferralRegistrationRecord:
      type: object
      required:
        - id
        - referrer
        - referred
        - referral_code
        - signature
        - public_key
        - registered_at
      properties:
        id:
          type: string
        referrer:
          type: string
        referred:
          type: string
        referral_code:
          type: string
        install_id:
          type: string
        signature:
          type: string
        public_key:
          type: string
        registered_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          description: Optional; this node does not write it.

    ReferralClaimReceipt:
      type: object
      required:
        - tx_id
        - referrer
        - referred
        - amount
        - status
        - created_at
      properties:
        tx_id:
          type: string
          description: Payout transaction id once claimed; while pending or failed, the deterministic claim id (refclaim_ followed by 24 hex digits).
        referrer:
          type: string
        referred:
          type: string
        amount:
          type: number
          format: double
        source_address:
          type: string
          description: Treasury signer address that pays the reward.
        status:
          type: string
          enum:
            - pending
            - claimed
            - failed
        reason:
          type: string
          description: Error text of a failed payout.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    ReferralRegisterResponse:
      type: object
      required:
        - status
        - registered
        - registration
        - message
      properties:
        status:
          type: string
          enum:
            - registered
            - already_registered
        registered:
          type: boolean
        registration:
          $ref: '#/components/schemas/ReferralRegistrationRecord'
        message:
          type: string

    ReferralStatusResponse:
      type: object
      required:
        - registered
        - qualified
        - claimable
        - claimed
        - activity_nonce
        - min_referred_account_nonce
        - message
      properties:
        registered:
          type: boolean
        qualified:
          type: boolean
          description: The referred wallet's consensus account nonce has reached min_referred_account_nonce.
        claimable:
          type: boolean
          description: Qualified, the treasury signer is ready (role, address and balance), QSDM_REFERRAL_CLAIMS_ENABLED is set, and no claim is paid or pending.
        claimed:
          type: boolean
        registration:
          $ref: '#/components/schemas/ReferralRegistrationRecord'
        claim:
          $ref: '#/components/schemas/ReferralClaimReceipt'
        activity_nonce:
          type: integer
          format: int64
          description: Consensus account nonce of the referred wallet.
        min_referred_account_nonce:
          type: integer
          format: int64
        message:
          type: string

    ReferralClaimRequest:
      type: object
      required:
        - referrer
        - referred
      properties:
        referrer:
          type: string
          description: Referrer wallet address (32 to 128 hex characters); must match the registration exactly.
        referred:
          type: string
          description: Referred wallet address (32 to 128 hex characters); registrations are keyed by the lower-case hex address.

    ReferralClaimResponse:
      type: object
      required:
        - status
        - referrer
        - referred
        - amount
        - pool_address
        - receipt
        - message
      properties:
        status:
          type: string
          enum:
            - claimed
            - already_claimed
        tx_id:
          type: string
        referrer:
          type: string
        referred:
          type: string
        amount:
          type: number
          format: double
        pool_address:
          type: string
        receipt:
          $ref: '#/components/schemas/ReferralClaimReceipt'
        message:
          type: string

    RecoveryNonceResponse:
      type: object
      required:
        - runtime
        - source
        - sender
        - action_nonce
        - present
      properties:
        runtime:
          type: string
          enum:
            - qsdm-native
        source:
          type: string
          enum:
            - chain
        sender:
          type: string
        action_nonce:
          type: integer
          format: int64
          description: Current consensus account nonce of sender; the next recovery action must carry this value.
        present:
          type: boolean
          description: sender exists in consensus account state. Submitting a capsule requires it.

    RecoveryLegacyCapsule:
      type: object
      additionalProperties: false
      required:
        - version
        - scheme
        - locator
        - address
        - cipher
        - nonce
        - ciphertext
        - created_at
      properties:
        version:
          type: integer
          format: int64
          enum:
            - 1
        scheme:
          type: string
          enum:
            - qsdm-legacy-wallet-recovery-v1
        locator:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lookup locator derived from the recovery words.
        address:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Address of the protected wallet.
        cipher:
          type: string
          enum:
            - aes-256-gcm
        nonce:
          type: string
          format: byte
          description: Standard base64 of the 12-byte AES-GCM nonce.
        ciphertext:
          type: string
          format: byte
          description: Standard base64 of 32 to 16384 bytes of AES-GCM ciphertext.
        created_at:
          type: string
          format: date-time

    RecoveryCapsuleAction:
      type: object
      additionalProperties: false
      required:
        - id
        - sender
        - action
        - locator
        - capsule
        - nonce
        - timestamp
      properties:
        id:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Action id; also used as the transaction id.
        sender:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Wallet address; must equal capsule.address.
        action:
          type: string
          enum:
            - register
        locator:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Must equal capsule.locator.
        capsule:
          $ref: '#/components/schemas/RecoveryLegacyCapsule'
        nonce:
          type: integer
          format: int64
          minimum: 0
          description: Must equal the sender's current consensus account nonce.
        timestamp:
          type: string
          format: date-time
          description: Registration time; not earlier than capsule.created_at.

    RecoveryCapsuleEnvelope:
      type: object
      additionalProperties: false
      required:
        - action
        - signature
        - public_key
      properties:
        action:
          $ref: '#/components/schemas/RecoveryCapsuleAction'
        signature:
          type: string
          description: Hex ML-DSA-87 signature (4627 bytes) by public_key over the compact JSON encoding of action.
        public_key:
          type: string
          description: Hex ML-DSA-87 public key (2592 bytes) whose SHA-256 equals action.sender.

    RecoverySubmitResponse:
      type: object
      required:
        - action_id
        - sender
        - locator
        - status
        - mempool_status
      properties:
        action_id:
          type: string
        sender:
          type: string
        locator:
          type: string
        status:
          type: string
          enum:
            - accepted
        mempool_status:
          type: string
          enum:
            - submitted
            - duplicate

    RecoveryCapsuleState:
      type: object
      required:
        - owner
        - locator
        - capsule
        - action_id
        - registered_at
      properties:
        owner:
          type: string
          description: Wallet that registered the capsule.
        locator:
          type: string
        capsule:
          $ref: '#/components/schemas/RecoveryLegacyCapsule'
        action_id:
          type: string
        registered_at:
          type: string
          format: date-time
          description: Timestamp of the registering action.

    RecoveryCapsuleResponse:
      type: object
      required:
        - runtime
        - source
        - state_root
        - recovery
      properties:
        runtime:
          type: string
          enum:
            - qsdm-native
        source:
          type: string
          enum:
            - chain
        state_root:
          type: string
          description: Hex SHA-256 over all current capsule records, ordered by locator.
        recovery:
          $ref: '#/components/schemas/RecoveryCapsuleState'

    ContractAbiParam:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          description: Type name, for example uint32, uint256, address, string or bool.

    ContractAbiFunction:
      type: object
      properties:
        name:
          type: string
        inputs:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ContractAbiParam'
        outputs:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ContractAbiParam'
        payable:
          type: boolean
        stateMutating:
          type: boolean

    ContractAbiEvent:
      type: object
      properties:
        name:
          type: string
        params:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ContractAbiParam'

    ContractAbi:
      type: object
      description: Contract ABI. Responses include every key; a list that was never set is null.
      properties:
        functions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ContractAbiFunction'
        events:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ContractAbiEvent'

    ContractDeployRequest:
      type: object
      required:
        - contract_id
      properties:
        contract_id:
          type: string
          description: Contract id, unique on this node.
        template:
          type: string
          description: Name of a built-in template (see GET /contracts/templates). When set, the template's code and ABI are used and code and abi are ignored.
        code:
          description: Contract code, used when template is empty. Any JSON value; the node stores the raw JSON text of the value as the code (it is not base64-decoded).
        abi:
          $ref: '#/components/schemas/ContractAbi'

    ContractSummary:
      type: object
      required:
        - contract_id
        - owner

          format: int64
        total_gas:
          type: integer
          format: int64
        avg_duration_ms:
          type: number
          format: double
        unique_calls:
          type: integer
          format: int64
          description: Distinct contract and function pairs among retained traces.
        persist_path:
          type: string
          description: Trace persistence file; present only when persistence is configured.
        max_trace_age_sec:
          type: number
          format: double
          description: Maximum trace age in seconds; present only when configured.


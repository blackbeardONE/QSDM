    # ------------------------------------------------------------------
    # Task registry (pkg/api/handlers_tasks.go, handlers_task_state.go,
    # handlers_task_actions.go; pkg/chain/task_state.go, task_catalog.go)
    # ------------------------------------------------------------------

    TasksListResponse:
      type: object
      description: Body of GET /tasks.
      required:
        - runtime
        - configured
        - tasks
      properties:
        runtime:
          type: string
          enum:
            - qsdm-native
        configured:
          type: boolean
          description: |
            True when the registry file (QSDM_TASK_REGISTRY_PATH) or task state
            (the consensus task store or the task-action log) is configured.
        source:
          type: string
          enum:
            - operator-registry
          description: Present when QSDM_TASK_REGISTRY_PATH is set.
        catalog_source:
          type: string
          enum:
            - chain
            - operator-overlay
          description: |
            Where task state came from: the validator's consensus task store
            (`chain`) or a replay of the task-action log (`operator-overlay`).
            Absent when neither is configured.
        catalog_state_root:
          type: string
          description: |
            Hex SHA-256 fingerprint of the task definitions in `tasks`. Live
            stake, reward, submission and round fields are left out, so it
            changes only when the catalog changes.
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    TaskResponse:
      type: object
      description: Body of GET /tasks/{task_id}.
      required:
        - runtime
        - configured
        - task
      properties:
        runtime:
          type: string
          enum:
            - qsdm-native
        configured:
          type: boolean
          description: Same meaning as in TasksListResponse.
        source:
          type: string
          enum:
            - operator-registry
          description: Present when QSDM_TASK_REGISTRY_PATH is set.
        catalog_source:
          type: string
          enum:
            - chain
            - operator-overlay
          description: Same meaning as in TasksListResponse.
        catalog_state_root:
          type: string
          description: Fingerprint of the whole catalog, as in TasksListResponse.
        task:
          $ref: '#/components/schemas/Task'

    TaskSubmissionsResponse:
      type: object
      description: Body of GET /tasks/{task_id}/submissions.
      required:
        - runtime
        - configured
        - task_id
        - submissions
      properties:
        runtime:
          type: string
          enum:
            - qsdm-native
        configured:
          type: boolean
          description: Same meaning as in TasksListResponse.
        task_id:
          type: string
        submissions:
          $ref: '#/components/schemas/TaskSubmissionsByRound'

    TaskStatesResponse:
      type: object
      description: Body of GET /tasks/state.
      required:
        - runtime
        - configured
        - state_root
        - tasks
      properties:
        runtime:
          type: string
          enum:
            - qsdm-native
        configured:
          type: boolean
          description: True when the consensus task store or the task-action log is configured.
        source:
          type: string
          enum:
            - chain
            - operator-overlay
          description: Absent when `configured` is false.
        state_root:
          type: string
          description: Hex SHA-256 fingerprint of the whole task state store.
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskState'

    TaskStateResponse:
      type: object
      description: Body of GET /tasks/{task_id}/state.
      required:
        - runtime
        - configured
        - state_root
        - task
      properties:
        runtime:
          type: string
          enum:
            - qsdm-native
        configured:
          type: boolean
          description: True when the consensus task store or the task-action log is configured.
        source:
          type: string
          enum:
            - chain
            - operator-overlay
          description: Absent when `configured` is false.
        state_root:
          type: string
          description: Hex SHA-256 fingerprint of the whole task state store.
        task:
          $ref: '#/components/schemas/TaskState'

    Task:
      type: object
      description: |
        One catalog task. Registry entries get defaults for empty fields.
        Tasks with a consensus manifest take their definition from it. When a
        task has consensus state, `stake_list`, `available_balances`,
        `total_stake_amount`, the reward totals, `submissions` and
        `distribution_rewards_submission` come from that state. Amounts are
        in CELL.
      required:
        - task_id
        - task_name
        - task_manager
        - is_allowlisted
        - is_active
        - task_audit_program
        - stake_pot_account
        - total_bounty_amount
        - bounty_amount_per_round
        - current_round
        - available_balances
        - stake_list
        - task_metadata
        - task_description
        - submissions
        - submissions_audit_trigger
        - total_stake_amount
        - minimum_stake_amount
        - ip_address_list
        - round_time
        - starting_slot
        - audit_window
        - submission_window
        - task_executable_network
        - distribution_rewards_submission
        - distributions_audit_trigger
        - distributions_audit_record
        - task_vars
        - koii_vars
        - is_migrated
        - migrated_to
        - allowed_failed_distributions
      properties:
        task_id:
          type: string
        task_name:
          type: string
          description: Display name; the task ID when the registry gives none.
        task_manager:
          type: string
          description: |
            Manager wallet: the manifest manager, the registry value, or the
            placeholder `11111111111111111111111111111111`.
        is_allowlisted:
          type: boolean
          description: Taken from the operator registry entry; false for tasks known only from consensus.
        is_active:
          type: boolean
          description: For manifest tasks, the manifest's `active` flag unless the task is catalog-paused.
        task_audit_program:
          type: string
          description: |
            Registry value or the task ID; for manifest tasks the runtime
            `capability` (capability runtime) or `module_sha256` (wasm
            runtime).
        stake_pot_account:
          type: string
          description: Registry value or the placeholder `11111111111111111111111111111111`.
        total_bounty_amount:
          type: number
          format: double
        bounty_amount_per_round:
          type: number
          format: double
          description: The manifest's `reward_per_round` for manifest tasks.
        current_round:
          type: integer
          format: int64
        available_balances:
          type: object
          description: Pending (unclaimed) reward per participant wallet.
          additionalProperties:
            type: number
            format: double
        stake_list:
          type: object
          description: Stake per participant wallet.
          additionalProperties:
            type: number
            format: double
        task_metadata:
          type: string
          description: Registry value or the task ID; the manifest's `metadata_url` for manifest tasks.
        task_description:
          type: string
        submissions:
          $ref: '#/components/schemas/TaskSubmissionsByRound'
        submissions_audit_trigger:
          $ref: '#/components/schemas/TaskAuditTriggers'
        total_stake_amount:
          type: number
          format: double
        reward_pool_amount:
          type: number
          format: double
        pending_reward_amount:
          type: number
          format: double
        total_reward_paid_amount:
          type: number
          format: double
        minimum_stake_amount:
          type: number
          format: double
        ip_address_list:
          type: object
          additionalProperties:
            type: string
        round_time:
          type: integer
          format: int64
        starting_slot:
          type: integer
          format: int64
        audit_window:
          type: integer
          format: int64
        submission_window:
          type: integer
          format: int64
        task_executable_network:
          type: string
          description: |
            Registry value or `IPFS`; `QSDM-CAPABILITY` or `QSDM-WASM` for
            manifest tasks.
        distribution_rewards_submission:
          description: |
            When the task has consensus state, the submissions that carry a
            positive `reward_amount`; otherwise the registry value.
          allOf:
            - $ref: '#/components/schemas/TaskSubmissionsByRound'
        distributions_audit_trigger:
          $ref: '#/components/schemas/TaskAuditTriggers'
        distributions_audit_record:
          type: object
          additionalProperties:
            type: string
        task_vars:
          type: string
          description: |
            JSON text, `{}` when empty. For manifest tasks, the JSON encoding of
            the manifest `runtime`.
        koii_vars:
          type: string
          description: JSON text, `{}` when empty.
        is_migrated:
          type: boolean
        migrated_to:
          type: string
        allowed_failed_distributions:
          type: integer
          format: int64
        task_type:
          type: string
          enum:
            - CELL
            - KPL
          description: |
            `KPL` when the entry's task_type is KPL or it has a token_type,
            otherwise `CELL`. Manifest tasks get token_type `CELL` and
            therefore task_type `KPL`.
        token_type:
          type: string
          description: Registry value; `CELL` for manifest tasks.
        native_runtime:
          type: string
          enum:
            - qsdm
            - qsdm-capability
            - qsdm-wasm
        manifest:
          description: The consensus catalog manifest, for tasks published by catalog actions.
          allOf:
            - $ref: '#/components/schemas/TaskManifest'
        catalog_version:
          type: integer
          format: int64
        catalog_paused:
          type: boolean
        catalog_published_at:
          type: string
          description: Timestamp of the catalog-register action, as signed.
        catalog_updated_at:
          type: string
          description: Timestamp of the latest catalog action, as signed.

    TaskSubmission:
      type: object
      description: One submission in the catalog view.
      required:
        - submission_value
        - slot
      properties:
        submission_value:
          type: string
        slot:
          type: integer
          format: int64
        reward_amount:
          type: number
          format: double
          description: Reward reserved for this submission, in CELL.
        claimed:
          type: boolean
        claimed_at:
          type: string

    TaskSubmissionsByRound:
      type: object
      description: Submissions keyed by round (a decimal string), then by sender wallet.
      additionalProperties:
        type: object
        additionalProperties:
          $ref: '#/components/schemas/TaskSubmission'

    TaskAuditTriggers:
      type: object
      description: |
        Audit-trigger data copied unchanged from the operator registry entry,
        keyed twice; empty for tasks without such data.
      additionalProperties:
        type: object
        additionalProperties: true

    TaskManifest:
      type: object
      description: |
        Consensus catalog record of a task, published by catalog-register and
        replaced by catalog-update. Consensus enforces the limits stated here.
      required:
        - schema_version
        - task_id
        - version
        - name
        - manager
        - active
        - runtime
        - round_time
      properties:
        schema_version:
          type: integer
          format: int64
          enum:
            - 1
        task_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        version:
          type: integer
          format: int64
          minimum: 1
          description: 1 at registration; each catalog-update adds exactly one.
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        manager:
          type: string
          description: |
            Lower-case wallet address of the registering sender; only this
            wallet may update, pause or resume the task.
        active:
          type: boolean
        runtime:
          $ref: '#/components/schemas/TaskRuntimeManifest'
        minimum_stake_amount:
          type: number
          format: double
          minimum: 0
        reward_per_round:
          type: number
          format: double
          minimum: 0
        round_time:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
        submission_window:
          type: integer
          format: int64
          description: At most `round_time`.
        audit_window:
          type: integer
          format: int64
          description: At most `round_time`.
        metadata_url:
          type: string
          maxLength: 2048
          description: Absolute HTTPS URL without user information.
        source_url:
          type: string
          maxLength: 2048
          description: Absolute HTTPS URL without user information.
        icon_url:
          type: string
          maxLength: 2048
          description: Absolute HTTPS URL without user information.
        tags:
          type: array
          maxItems: 16
          description: Lower-cased, de-duplicated and sorted.
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9._-]{0,31}$'
        authorized_relay_ids:
          type: array
          maxItems: 16
          description: Relay key fingerprints (32 bytes, hex), lower-cased, de-duplicated and sorted.
          items:
            type: string
            pattern: '^[0-9a-f]{64}$'

    TaskRuntimeManifest:
      type: object
      description: How Hive runs the task.
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - capability
            - wasm
        capability:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
          description: Required for `capability` runtimes; names code already shipped in Hive.
        module_url:
          type: string
          maxLength: 2048
          description: |
            Required for `wasm` runtimes: absolute HTTPS URL without user
            information. Not allowed for `capability` runtimes.
        module_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Required for `wasm` runtimes. Not allowed for `capability` runtimes.
        abi:
          type: string
          maxLength: 64
          description: Required for `wasm` runtimes (1 to 64 characters).
        min_hive_version:
          type: string
          pattern: '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$'
        max_memory_mb:
          type: integer
          format: int64
          maximum: 4096
        max_runtime_seconds:
          type: integer
          format: int64
          maximum: 86400

    TaskState:
      type: object
      description: Consensus state of one task. Amounts are in CELL.
      required:
        - task_id
        - total_stake_amount
        - reward_pool_amount
        - pending_reward_amount
        - total_reward_paid_amount
        - running_count
        - is_migrated
        - participants
        - submissions
      properties:
        task_id:
          type: string
        manifest:
          $ref: '#/components/schemas/TaskManifest'
        catalog_paused:
          type: boolean
        catalog_published_at:
          type: string
        catalog_updated_at:
          type: string
        total_stake_amount:
          type: number
          format: double
        reward_pool_amount:
          type: number
          format: double
        pending_reward_amount:
          type: number
          format: double
        total_reward_paid_amount:
          type: number
          format: double
        running_count:
          type: integer
          format: int64
          description: Participants whose last start was not followed by a stop.
        last_action:
          type: string
        last_action_id:
          type: string
        last_action_at:
          type: string
        is_migrated:
          type: boolean
        migrated_to:
          type: string
        participants:
          type: object
          description: Participant state keyed by sender wallet.
          additionalProperties:
            $ref: '#/components/schemas/TaskParticipantState'
        submissions:
          type: object
          description: Submissions keyed by round (a decimal string), then by sender wallet.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/TaskSubmissionState'

    TaskParticipantState:
      type: object
      description: One wallet's state in a task. Amounts are in CELL.
      required:
        - sender
        - running
        - stake
        - submission_count
        - claim_count
        - pending_reward_amount
        - total_reward_claimed_amount
      properties:
        sender:
          type: string
        running:
          type: boolean
        stake:
          type: number
          format: double
        last_action:
          type: string
        last_action_id:
          type: string
        last_action_at:
          type: string
        last_started_at:
          type: string
        last_stopped_at:
          type: string
        submission_count:
          type: integer
          format: int64
        claim_count:
          type: integer
          format: int64
        pending_reward_amount:
          type: number
          format: double
        total_reward_claimed_amount:
          type: number
          format: double
        last_claimed_at:
          type: string

    TaskSubmissionState:
      type: object
      description: |
        One submission in consensus task state. The `settlement_*` fields are
        set only when the submission settled a pooled resource proof in the
        same transaction. Amounts are in CELL.
      required:
        - action_id
        - sender
        - round
        - slot
        - submission_value
        - claimed
        - timestamp
      properties:
        action_id:
          type: string
        sender:
          type: string
        round:
          type: integer
          format: int64
        slot:
          type: integer
          format: int64
        submission_value:
          type: string
        payload:
          type: string
        reward_amount:
          type: number
          format: double
        claimed:
          type: boolean
        claimed_at:
          type: string
        timestamp:
          type: string
        settlement_proof_id:
          type: string
        settlement_coordinator_id:
          type: string
        settlement_contributor_wallet:
          type: string
        settlement_mother_hive_wallet:
          type: string
        settlement_ecosystem_wallet:
          type: string
        settlement_contributor_amount:
          type: number
          format: double
        settlement_mother_hive_amount:
          type: number
          format: double
        settlement_ecosystem_amount:
          type: number
          format: double

    TaskActionEnvelope:
      type: object
      description: |
        Wallet-signed task action: the request body of
        POST /tasks/actions/submit-signed and the `envelope` of each log
        record. The signature covers the compact JSON encoding of this object
        with `public_key` left out and `signature` set to the empty string,
        keys in the order listed here, and `amount`, `payload` and `nonce`
        left out when zero or empty. The handler trims `task_id`, and trims
        and lower-cases `sender` and `action`, before it checks the signature,
        so sign those normalised values. Unknown fields are ignored.
      required:
        - id
        - sender
        - task_id
        - action
        - signature
        - public_key
      properties:
        id:
          type: string
          pattern: '^[0-9A-Za-z_-]{16,128}$'
        sender:
          type: string
          description: Wallet address, hex(sha256(public_key)).
        task_id:
          type: string
          minLength: 1
          maxLength: 256
        action:
          type: string
          enum:
            - start
            - stop
            - stake
            - fund
            - unstake
            - submit
            - claim
            - withdraw
            - migrate
            - catalog-register
            - catalog-update
            - catalog-pause
            - catalog-resume
        amount:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000
          description: |
            CELL amount; when positive, at least 0.00000001. It becomes the
            transaction amount only for stake and fund.
        payload:
          type: string
          maxLength: 100000
          description: |
            Action-specific data. catalog-register and catalog-update carry a
            JSON-encoded TaskManifest; submit, claim and migrate read a JSON
            object (for example `round`, `slot`, `submission_value`,
            `reward_amount`, `migrated_to`).
        nonce:
          type: integer
          format: int64
          minimum: 0
          description: Becomes the transaction nonce; this endpoint does not check it.
        timestamp:
          type: string
          description: |
            RFC 3339 time. It may be empty; otherwise it must lie between 24
            hours in the past and 30 seconds in the future.
        signature:
          type: string
          description: ML-DSA signature over the bytes described above, hex-encoded.
        public_key:
          type: string
          description: ML-DSA public key, hex-encoded.

    TaskActionRecord:
      type: object
      description: One line of the task-action log.
      required:
        - received_at
        - envelope
      properties:
        received_at:
          type: string
          format: date-time
          description: When this node accepted the action (UTC).
        envelope:
          $ref: '#/components/schemas/TaskActionEnvelope'

    TaskActionsListResponse:
      type: object
      description: Body of GET /tasks/actions.
      required:
        - configured
        - actions
      properties:
        configured:
          type: boolean
          description: True when QSDM_TASK_ACTION_LOG_PATH is set.
        source:
          type: string
          description: File path of the log on the node (the QSDM_TASK_ACTION_LOG_PATH value).
        actions:
          type: array
          items:
            $ref: '#/components/schemas/TaskActionRecord'

    TaskActionSubmitResponse:
      type: object
      description: Outcome of POST /tasks/actions/submit-signed.
      required:
        - action_id
        - status
        - sender
        - task_id
        - action
        - mempool_submitted
      properties:
        action_id:
          type: string
        status:
          type: string
          enum:
            - accepted
            - duplicate
            - rejected
        sender:
          type: string
        task_id:
          type: string
        action:
          type: string
        last_nonce:
          type: integer
          format: int64
          description: Declared in the response type but never set by the current handler, so it is always absent.
        mempool_submitted:
          type: boolean
        mempool_status:
          type: string
          enum:
            - submitted
            - duplicate
            - not_configured
            - encode_failed
            - rejected
          description: Absent on 409 responses.
        mempool_error:
          type: string
          description: Mempool or encoding error text, truncated to 256 bytes.

    # ------------------------------------------------------------------
    # CELL streams (pkg/api/handlers_streams.go; pkg/chain/stream_state.go)
    # ------------------------------------------------------------------

    StreamUsageReceipt:
      type: object
      description: |
        Cumulative active-use acknowledgement signed by the stream's Ed25519
        session key, carried only by `receipt` actions. During consensus
        application `sequence` must be the stream's last sequence plus one;
        `cumulative_active_seconds` must grow, stay within
        `max_active_seconds` and the unpaused time elapsed since open, and
        imply a charge within `budget_dust`; `observed_at` must be later than
        the previous receipt's, not before `opened_at`, and not after
        `expires_at` or the action `timestamp`.
      additionalProperties: false
      required:
        - stream_id
        - sequence
        - cumulative_active_seconds
        - observed_at
        - signature
      properties:
        stream_id:
          type: string
          description: Must equal the action's `stream_id`.
        sequence:
          type: integer
          format: int64
          minimum: 1
        cumulative_active_seconds:
          type: integer
          format: int64
          minimum: 1
        observed_at:
          type: string
          format: date-time
        signature:
          type: string
          description: |
            Ed25519 signature (64 bytes, hex) by the session key over the
            compact JSON encoding of this receipt without `signature`.
            Required for receipt actions; checked during consensus
            application, not by this endpoint.

    StreamAction:
      type: object
      description: |
        Wallet-signed consensus command for one CELL stream. `open` creates
        the stream and takes `budget_dust` from the sender, who becomes the
        payer; `receipt` and `settle` are provider actions; `pause`, `resume`
        and `close` are payer actions. The fields from `provider` to
        `expires_at` are required for `open` and must be absent or zero for
        every other action; `receipt` is required for `receipt` actions and
        not allowed otherwise. Amounts are integer dust (1 CELL = 100000000
        dust).
      additionalProperties: false
      required:
        - id
        - sender
        - stream_id
        - action
        - timestamp
      properties:
        id:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        sender:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lower-case QSDM wallet address; must equal hex(sha256(public_key)).
        stream_id:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        action:
          type: string
          enum:
            - open
            - receipt
            - pause
            - resume
            - settle
            - close
        provider:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Open only. Provider wallet address; must differ from `sender`.
        service_id:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Open only.
        device_id_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Open only. SHA-256 digest of the billed device identifier, encoded as lower-case hex.
        session_public_key:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Open only. Ed25519 public key encoded as lower-case hex; it signs the stream's usage receipts.
        price_dust:
          type: integer
          format: int64
          minimum: 0
          description: Open only, positive. Dust charged per `price_period_seconds` of active use.
        price_period_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Open only, positive.
        budget_dust:
          type: integer
          format: int64
          minimum: 0
          description: Open only, positive. Escrow debited from the payer.
        max_active_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Open only, positive. Cap on cumulative active seconds.
        expires_at:
          type: string
          format: date-time
          description: Open only. Must be later than `timestamp`.
        receipt:
          $ref: '#/components/schemas/StreamUsageReceipt'
        nonce:
          type: integer
          format: int64
          minimum: 0
          description: |
            Must equal the sender's current consensus nonce (`action_nonce`
            from GET /streams/nonce); zero may be omitted.
        timestamp:
          type: string
          format: date-time
          description: Must not be earlier than the stream's `last_action_at` (checked during consensus application).

    StreamActionEnvelope:
      type: object
      description: |
        Request body of POST /streams/actions/submit-signed. Unknown fields are
        rejected at every level.
      additionalProperties: false
      required:
        - action
        - signature
        - public_key
      properties:
        action:
          $ref: '#/components/schemas/StreamAction'
        signature:
          type: string
          description: |
            ML-DSA-87 signature (4627 bytes) encoded as hex, over the compact
            JSON encoding of `action`: keys in the order of the StreamAction
            properties, optional fields left out when empty or zero.
        public_key:
          type: string
          description: ML-DSA-87 public key (2592 bytes) encoded as hex.

    StreamActionSubmitResponse:
      type: object
      required:
        - action_id
        - stream_id
        - action
        - sender
        - status
        - mempool_status
      properties:
        action_id:
          type: string
        stream_id:
          type: string
        action:
          type: string
        sender:
          type: string
        status:
          type: string
          enum:
            - accepted
        mempool_status:
          type: string
          enum:
            - submitted
            - duplicate
          description: "`duplicate`: the mempool already held a transaction with this ID."

    StreamActionNonceResponse:
      type: object
      required:
        - runtime
        - source
        - sender
        - action_nonce
        - present
      properties:
        runtime:
          type: string
          enum:
            - qsdm-native
        source:
          type: string
          enum:
            - chain
        sender:
          type: string
          pattern: '^[0-9a-fA-F]{32,128}$'
          description: The `sender` query value, trimmed.
        action_nonce:
          type: integer
          format: int64
          minimum: 0
          description: Value for the `nonce` of the sender's next stream action.
        present:
          type: boolean
          description: Whether the ledger holds an account for this address.

    StreamState:
      type: object
      description: |
        One CELL stream as the API serves it: the consensus stream state plus
        the derived `remaining_budget_dust` and `unsettled_dust`. Amounts are
        integer dust (1 CELL = 100000000 dust); times are the RFC 3339 strings
        of the signed actions.
      required:
        - stream_id
        - payer
        - provider
        - service_id
        - device_id_hash
        - session_public_key
        - price_dust
        - price_period_seconds
        - budget_dust
        - max_active_seconds
        - expires_at
        - status
        - cumulative_active_seconds
        - paused_duration_seconds
        - last_receipt_sequence
        - accrued_dust
        - settled_dust
        - refunded_dust
        - opened_at
        - last_action
        - last_action_id
        - last_action_at
        - action_count
        - remaining_budget_dust
        - unsettled_dust
      properties:
        stream_id:
          type: string
        payer:
          type: string
          description: Wallet that opened and funds the stream.
        provider:
          type: string
          description: Wallet paid for usage; it submits receipts and settles.
        service_id:
          type: string
        device_id_hash:
          type: string
        session_public_key:
          type: string
          description: Ed25519 key (hex) that signs usage receipts.
        price_dust:
          type: integer
          format: int64
        price_period_seconds:
          type: integer
          format: int64
          description: The rate is `price_dust` per `price_period_seconds` of active use.
        budget_dust:
          type: integer
          format: int64
          description: Escrow taken from the payer at open.
        max_active_seconds:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - active
            - paused
            - closed
        cumulative_active_seconds:
          type: integer
          format: int64
          description: From the latest accepted receipt.
        paused_duration_seconds:
          type: integer
          format: int64
          description: Total time spent paused, each pause rounded up to whole seconds.
        last_receipt_sequence:
          type: integer
          format: int64
        last_receipt_observed_at:
          type: string
          format: date-time
        accrued_dust:
          type: integer
          format: int64
          description: floor(cumulative_active_seconds * price_dust / price_period_seconds).
        settled_dust:
          type: integer
          format: int64
          description: Paid to the provider so far.
        refunded_dust:
          type: integer
          format: int64
          description: Returned to the payer at close.
        opened_at:
          type: string
          format: date-time
        last_paused_at:
          type: string
          format: date-time
        last_resumed_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        last_action:
          type: string
          enum:
            - open
            - receipt
            - pause
            - resume
            - settle
            - close
        last_action_id:
          type: string
        last_action_at:
          type: string
          format: date-time
        action_count:
          type: integer
          format: int64
        remaining_budget_dust:
          type: integer
          format: int64
          description: '`budget_dust` minus `accrued_dust`, never below zero.'
        unsettled_dust:
          type: integer
          format: int64
          description: '`accrued_dust` minus `settled_dust`, never below zero.'

    StreamsResponse:
      type: object
      required:
        - runtime
        - source
        - state_root
        - streams
      properties:
        runtime:
          type: string
          enum:
            - qsdm-native
        source:
          type: string
          enum:
            - chain
        state_root:
          type: string
          description: |
            Hex SHA-256 over every stream and every applied stream-action ID;
            the filters do not change it.
        streams:
          type: array
          items:
            $ref: '#/components/schemas/StreamState'

    StreamResponse:
      type: object
      required:
        - runtime
        - source
        - state_root
        - stream
      properties:
        runtime:
          type: string
          enum:
            - qsdm-native
        source:
          type: string
          enum:
            - chain
        state_root:
          type: string
          description: Hex SHA-256 over every stream and every applied stream-action ID.
        stream:
          $ref: '#/components/schemas/StreamState'

    MiningUnavailable:
      type: object
      description: Body of the 503 written by `writeMiningUnavailable` (pkg/api/handlers_mining.go) when a feature or data source is not installed or reports itself unavailable; the mining, receipt, chain, attestation and governance routes use it. Sent with `Retry-After` 5.
      required:
        - error
        - detail
      properties:
        error:
          type: string
          enum:
            - mining_unavailable
        detail:
          type: string
          description: Reason, for example `mining service not configured on this node`.

    MiningTextError:
      type: string
      description: Plain-text message written by Go http.Error (Content-Type text/plain; charset=utf-8), ending in a newline.

    MiningWork:
      type: object
      description: Work payload for one block height. Byte fields are lowercase hex.
      required:
        - epoch
        - height
        - header_hash
        - difficulty
        - dag_size
        - workset_root
        - workset
        - batch_count_maximum
        - blocks_per_epoch
      properties:
        epoch:
          type: integer
          format: int64
        height:
          type: integer
          format: int64
          description: Block height this work is for.
        header_hash:
          type: string
          description: Block header hash, 64 hex characters.
        difficulty:
          type: string
          pattern: '^[0-9]+$'
          description: Difficulty as a decimal integer string (arbitrary precision).
        dag_size:
          type: integer
          format: int64
          description: Unsigned 32-bit integer.
        workset_root:
          type: string
          description: Work-set root, 64 hex characters.
        workset:
          type: array
          description: Work-set batches in canonical order.
          items:
            $ref: '#/components/schemas/MiningWorkBatch'
        batch_count_maximum:
          type: integer
          format: int64
          description: Largest batch_count a proof may claim (uint32).
        blocks_per_epoch:
          type: integer
          format: int64

    MiningWorkBatch:
      type: object
      required:
        - cells
      properties:
        cells:
          type: array
          description: Parent-cell references, sorted by id.
          items:
            $ref: '#/components/schemas/MiningWorkCell'

    MiningWorkCell:
      type: object
      required:
        - id
        - content_hash
      properties:
        id:
          type: string
          description: Parent-cell ID, hex.
        content_hash:
          type: string
          description: SHA-256 content hash, 64 hex characters.

    MiningProof:
      type: object
      description: |
        Canonical proof encoding (`mining.Proof.CanonicalJSON`). The body
        must match it byte for byte: exactly these fields in this order,
        no whitespace, hex in lowercase without a 0x prefix, `epoch` and
        `height` as JSON strings, `version` and `batch_count` as JSON
        numbers.
      required:
        - version
        - epoch
        - height
        - header_hash
        - miner_addr
        - batch_root
        - batch_count
        - nonce
        - mix_digest
        - attestation
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: Protocol version (uint32); version 2 proofs use 2.
        epoch:
          type: string
          pattern: '^[0-9]+$'
          description: Epoch as a decimal string (uint64).
        height:
          type: string
          pattern: '^[0-9]+$'
          description: Block height as a decimal string (uint64).
        header_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 32 bytes, 64 hex characters.
        miner_addr:
          type: string
          minLength: 1
          description: Address the proof is credited to.
        batch_root:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 32 bytes, 64 hex characters.
        batch_count:
          type: integer
          format: int64
          minimum: 1
          description: Number of batches (uint32), at most the work's batch_count_maximum.
        nonce:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: 16 bytes, 32 hex characters.
        mix_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 32 bytes, 64 hex characters.
        attestation:
          $ref: '#/components/schemas/MiningProofAttestation'

    MiningProofAttestation:
      type: object
      description: |
        Hardware attestation, fields in this order. `nonce` and
        `issued_at` are present for version 2 proofs and absent for
        version 1.
      required:
        - type
        - bundle
        - gpu_arch
        - claimed_hashrate_hps
      additionalProperties: false
      properties:
        type:
          type: string
          description: Attestation type, for example `nvidia-hmac-v1` or `nvidia-cc-v1`.
        bundle:
          type: string
          description: Attestation bundle, base64.
        gpu_arch:
          type: string
        claimed_hashrate_hps:
          type: integer
          format: int64
          description: Claimed hash rate in hashes per second (uint64).
        nonce:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Version 2 only. The nonce of a challenge from GET /mining/challenge.
        issued_at:
          type: integer
          format: int64
          description: Version 2 only. The challenge's issued_at (Unix seconds).

    MiningSubmitResponse:
      type: object
      required:
        - accepted
      properties:
        accepted:
          type: boolean
        proof_id:
          type: string
          description: Set on 200. Proof ID, 64 hex characters.
        reject_reason:
          type: string
          description: Set on a 400 rejection.
          enum:
            - bad-version
            - stale-height
            - wrong-epoch
            - non-canonical
            - header-mismatch
            - duplicate
            - bad-addr
            - batch-size
            - batch-root
            - work
            - batch-fraud
            - quarantined
            - too-late
            - attestation
        detail:
          type: string
          description: Rejection detail (400) or error text (500).

    MiningAccount:
      type: object
      required:
        - address
        - balance
        - nonce
        - present
      properties:
        address:
          type: string
          description: The queried address.
        balance:
          type: number
          format: double
          description: Balance in CELL.
        nonce:
          type: integer
          format: int64
          description: Account nonce; the address's next transaction must carry this value.
        present:
          type: boolean
          description: False when the account store has no entry for the address (balance and nonce are then 0).

    MiningEmission:
      type: object
      description: Emission schedule state at the chain tip. Amounts are in dust (1 CELL = 100000000 dust) except the `_cell` strings.
      required:
        - chain_tip
        - mining_cap_dust
        - blocks_per_epoch
        - target_block_time_seconds
        - current_epoch
        - block_reward_dust
        - block_reward_cell
        - emitted_dust
        - emitted_cell
        - remaining_dust
        - next_halving_height
        - next_halving_eta_seconds
      properties:
        chain_tip:
          type: integer
          format: int64
          description: Chain tip height (0 before the first block).
        mining_cap_dust:
          type: integer
          format: int64
          description: Total mining emission cap.
        blocks_per_epoch:
          type: integer
          format: int64
        target_block_time_seconds:
          type: integer
          format: int64
        current_epoch:
          type: integer
          format: int64
          description: Emission epoch at the tip (uint32).
        block_reward_dust:
          type: integer
          format: int64
          description: Reward for the next block (tip + 1).
        block_reward_cell:
          type: string
          description: block_reward_dust as a decimal CELL string.
        emitted_dust:
          type: integer
          format: int64
          description: Cumulative emission through the tip.
        emitted_cell:
          type: string
          description: emitted_dust as a decimal CELL string with 8 decimals.
        remaining_dust:
          type: integer
          format: int64
          description: Mining supply not yet emitted.
        next_halving_height:
          type: integer
          format: int64
        next_halving_eta_seconds:
          type: integer
          format: int64
          description: Estimated seconds until next_halving_height.

    MiningBlockHeader:
      type: object
      required:
        - height
        - hash
        - prev_hash
        - state_root
        - tx_root
        - tx_count
        - timestamp
      properties:
        height:
          type: integer
          format: int64
        hash:
          type: string
        prev_hash:
          type: string
        state_root:
          type: string
        tx_root:
          type: string
        tx_count:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
          description: Block time, RFC 3339 in UTC.
        producer_id:
          type: string
          description: Block producer; omitted when empty.

    MiningBlocksPage:
      type: object
      required:
        - tip
        - from
        - to
        - headers
      properties:
        tip:
          type: integer
          format: int64
        from:
          type: integer
          format: int64
          description: Effective first height.
        to:
          type: integer
          format: int64
          description: Effective last height, as requested (may exceed tip).
        headers:
          type: array
          description: Headers in ascending height order; empty array when none match.
          items:
            $ref: '#/components/schemas/MiningBlockHeader'

    MiningTxAccepted:
      type: object
      description: Admission result of POST /mining/enroll, /mining/unenroll and /mining/slash.
      required:
        - tx_id
        - status
      properties:
        tx_id:
          type: string
          description: The submitted transaction id.
        status:
          type: string
          enum:
            - accepted

    ReceiptView:
      type: object
      description: Outcome of one executed transaction.
      required:
        - tx_id
        - block_height
        - status
        - gas_used
        - fee
        - timestamp
        - index_in_block
      properties:
        tx_id:
          type: string
        block_height:
          type: integer
          format: int64
        block_hash:
          type: string
          description: Omitted when empty.
        status:
          type: integer
          format: int32
          enum:
            - 0
            - 1
          description: 1 when the transaction applied, 0 when it failed.
        gas_used:
          type: integer
          format: int64
        fee:
          type: number
          format: double
        logs:
          type: array
          description: Execution logs, for example a TxApplied or TxFailed entry; omitted when empty.
          items:
            $ref: '#/components/schemas/ReceiptLog'
        error:
          type: string
          description: Failure reason; omitted when empty.
        timestamp:
          type: string
          format: date-time
          description: RFC 3339 with nanoseconds, UTC.
        contract_id:
          type: string
          description: Contract the transaction targeted; omitted when empty.
        index_in_block:
          type: integer
          format: int64

    ReceiptLog:
      type: object
      required:
        - topic
        - index
      properties:
        topic:
          type: string
          description: Log topic, for example TxApplied or TxFailed.
        data:
          type: object
          additionalProperties: true
          description: Log fields; omitted when empty.
        index:
          type: integer
          format: int64

    ReceiptListPage:
      type: object
      required:
        - tip
        - from
        - to
        - limit
        - receipts
      properties:
        tip:
          type: integer
          format: int64
        from:
          type: integer
          format: int64
          description: Effective lowest height.
        to:
          type: integer
          format: int64
          description: Effective highest height.
        limit:
          type: integer
          format: int64
          description: Effective limit.
        receipts:
          type: array
          description: Newest first; empty array when none match.
          items:
            $ref: '#/components/schemas/ReceiptView'

    SpecAnomaliesResponse:
      type: object
      required:
        - snapshot
        - anomalies
      properties:
        snapshot:
          $ref: '#/components/schemas/SpecAnomaliesSnapshot'
        anomalies:
          type: array
          description: Newest first; empty array when there are none.
          items:
            $ref: '#/components/schemas/SpecAnomalyView'

    SpecAnomaliesSnapshot:
      type: object
      description: Catalog size, checker counters (the *_total fields count since process start) and anomaly ring occupancy.
      required:
        - catalog_total_entries
        - catalog_signers
        - catalog_skus
        - checked_total
        - matched_total
        - mismatched_total
        - unknown_sku_total
        - skipped_total
        - ring_cap
        - ring_size
      properties:
        catalog_total_entries:
          type: integer
          format: int64
        catalog_signers:
          type: integer
          format: int64
        catalog_skus:
          type: integer
          format: int64
        checked_total:
          type: integer
          format: int64
        matched_total:
          type: integer
          format: int64
        mismatched_total:
          type: integer
          format: int64
        unknown_sku_total:
          type: integer
          format: int64
        skipped_total:
          type: integer
          format: int64
        ring_cap:
          type: integer
          format: int64
          description: Capacity of the in-memory anomaly ring.
        ring_size:
          type: integer
          format: int64
          description: Records currently in the ring.
        mismatches_by_field:
          type: object
          description: Mismatch count per field name; omitted when empty.
          additionalProperties:
            type: integer
            format: int64

    SpecAnomalyView:
      type: object
      required:
        - observed_at
        - attestation_type
        - node_id
        - gpu_uuid
        - gpu_name
        - gpu_arch
        - compute_cap
        - driver_ver
        - miner_addr
        - height
        - verdict
        - has_major
      properties:
        observed_at:
          type: integer
          format: int64
          description: Unix seconds.
        attestation_type:
          type: string
        node_id:
          type: string
        gpu_uuid:
          type: string
        gpu_name:
          type: string
        gpu_arch:
          type: string
        compute_cap:
          type: string
        driver_ver:
          type: string
        miner_addr:
          type: string
        height:
          type: integer
          format: int64
        verdict:
          type: string
          description: Checker verdict; the reference checker records `mismatch` and `unknown_sku`.
        mismatched_fields:
          type: array
          description: Omitted when empty.
          items:
            type: string
        has_major:
          type: boolean
          description: True when a major field mismatched.
        matched_references:
          type: array
          description: Omitted when empty.
          items:
            type: string

    PenaltyView:
      type: object
      description: Per-miner sliding-window snapshot.
      required:
        - miner_addr
        - window_size
        - window_filled
        - mismatch_count
        - unknown_sku_count
        - match_count
        - mismatch_pct
        - threshold_pct
        - over_threshold
        - below_min_observations
        - multiplier
      properties:
        miner_addr:
          type: string
        window_size:
          type: integer
          format: int64
          description: Configured window length (observations).
        window_filled:
          type: integer
          format: int64
          description: Observations currently in the window.
        mismatch_count:
          type: integer
          format: int64
          description: Major mismatches in the window.
        unknown_sku_count:
          type: integer
          format: int64
        match_count:
          type: integer
          format: int64
        mismatch_pct:
          type: number
          format: double
          description: 100 * mismatch_count / window_filled.
        threshold_pct:
          type: number
          format: double
        over_threshold:
          type: boolean
        below_min_observations:
          type: boolean
        multiplier:
          type: number
          format: double
          description: Reward multiplier currently applied (1.0 when not penalised).
        last_observed_at:
          type: integer
          format: int64
          description: Unix seconds of the last observation; omitted when 0.

    PenaltyConfig:
      type: object
      description: Resolved Tier-3 penalty configuration.
      required:
        - window_size
        - threshold_pct
        - multiplier
        - min_observations
      properties:
        window_size:
          type: integer
          format: int64
        threshold_pct:
          type: number
          format: double
        multiplier:
          type: number
          format: double
          description: Multiplier applied to a miner over the threshold.
        min_observations:
          type: integer
          format: int64

    PenaltyOverview:
      type: object
      required:
        - config
        - penalised_count
        - tracked_miners
        - miners
      properties:
        config:
          $ref: '#/components/schemas/PenaltyConfig'
        penalised_count:
          type: integer
          format: int64
        tracked_miners:
          type: integer
          format: int64
          description: Length of miners.
        miners:
          type: array
          description: Every tracked miner; empty array when none.
          items:
            $ref: '#/components/schemas/PenaltyView'

    Challenge:
      type: object
      required:
        - nonce
        - issued_at
        - signer_id
        - signature
      properties:
        nonce:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 32 random bytes, 64 hex characters.
        issued_at:
          type: integer
          format: int64
          description: Unix seconds.
        signer_id:
          type: string
          description: Identifier of the issuing signer.
        signature:
          type: string
          description: Signer output over the challenge, lowercase hex (64 characters for the reference HMAC signer).

    EnrollmentSubmitRequest:
      type: object
      description: |
        Signed qsdm/enroll/v2 envelope (`enrollment.SignedEnvelope`). The
        ML-DSA-87 signature covers the Go json.Marshal encoding of this
        envelope with `signature` set to "" and `public_key` removed
        (`enrollment.SignedEnvelope.CanonicalBytes`). The body must be one
        JSON object of at most 1 MiB; unknown fields are rejected.
      required:
        - id
        - sender
        - contract_id
        - payload_b64
        - signature
        - public_key
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: Transaction id.
        sender:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex SHA-256 of the decoded public_key.
        nonce:
          type: integer
          format: int64
          description: Sender account nonce; 0 when omitted.
        fee:
          type: number
          format: double
          description: Fee in CELL; the admission gate requires 0 or more.
        gas_limit:
          type: integer
          format: int64
        contract_id:
          type: string
          enum:
            - qsdm/enroll/v2
        payload_b64:
          type: string
          format: byte
          description: |
            Standard base64 of the canonical payload JSON. Its `kind` must
            match the route: `enroll` on /mining/enroll, `unenroll` on
            /mining/unenroll. Enroll payload: kind, node_id (1-64
            characters from a-z, 0-9, `-`, `_`), gpu_uuid (1-96 printable
            ASCII characters, not starting with lowercase `gpu-`),
            hmac_key (base64 of 32-128 bytes), stake_dust (1000000000 for
            bond_mode `upfront` or absent; 0 for `mining_rewards`),
            bond_mode (optional), work_nonce (only with
            `mining_rewards`), memo (optional, at most 256 bytes).
            Unenroll payload: kind, node_id, reason (optional, at most
            256 bytes). Unknown payload fields are rejected.
        signature:
          type: string
          pattern: '^[0-9a-fA-F]{9254}$'
          description: ML-DSA-87 signature, 4627 bytes as hex.
        public_key:
          type: string
          pattern: '^[0-9a-fA-F]{5184}$'
          description: ML-DSA-87 public key, 2592 bytes as hex.

    EnrollmentRecord:
      type: object
      description: On-chain enrollment record without the HMAC key.
      required:
        - node_id
        - owner
        - gpu_uuid
        - stake_dust
        - bond_mode
        - required_stake_dust
        - bond_remaining_dust
        - fully_bonded
        - enrolled_at_height
        - phase
        - slashable
      properties:
        node_id:
          type: string
        owner:
          type: string
          description: Address that enrolled the node; the only sender allowed to unenroll it.
        operator_public_key:
          type: string
          description: ML-DSA public key that proved ownership of owner at enrollment; omitted for legacy records.
        gpu_uuid:
          type: string
        stake_dust:
          type: integer
          format: int64
          description: Stake currently locked.
        bond_mode:
          type: string
          enum:
            - upfront
            - mining_rewards
        required_stake_dust:
          type: integer
          format: int64
          description: Target bond (legacy records report the default minimum stake).
        bond_remaining_dust:
          type: integer
          format: int64
          description: required_stake_dust minus stake_dust, never below 0.
        fully_bonded:
          type: boolean
        enrolled_at_height:
          type: integer
          format: int64
        revoked_at_height:
          type: integer
          format: int64
          description: Height of the unenroll or revocation; omitted while active.
        unbond_matures_at_height:
          type: integer
          format: int64
          description: Height at which the stake can be released; omitted while active.
        phase:
          type: string
          enum:
            - active
            - pending_unbond
            - revoked
          description: active while not revoked; pending_unbond when revoked with stake still locked; revoked when revoked with no stake left.
        slashable:
          type: boolean
          description: True when stake_dust is above 0 and phase is active or pending_unbond.

    EnrollmentListPage:
      type: object
      required:
        - records
        - has_more
        - total_matches
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentRecord'
        next_cursor:
          type: string
          description: Pass as `cursor` to fetch the next page; omitted when has_more is false.
        has_more:
          type: boolean
        total_matches:
          type: integer
          format: int64
          description: Records matching the phase filter, regardless of cursor and limit.
        phase:
          type: string
          description: The phase filter applied; omitted when none.

    SlashSubmitRequest:
      type: object
      description: |
        qsdm/slash/v1 transaction envelope. It carries no signature or
        public_key; unknown fields are rejected.
      required:
        - id
        - sender
        - contract_id
        - payload_b64
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: Transaction id.
        sender:
          type: string
          minLength: 1
          description: Submitting address; it pays the fee.
        nonce:
          type: integer
          format: int64
          description: Sender account nonce; 0 when omitted.
        fee:
          type: number
          format: double
          description: Fee in CELL; the admission gate requires it to be greater than 0.
        gas_limit:
          type: integer
          format: int64
        contract_id:
          type: string
          enum:
            - qsdm/slash/v1
        payload_b64:
          type: string
          format: byte
          description: |
            Standard base64 of the canonical slash payload JSON: node_id
            (1-64 bytes), evidence_kind (`forged-attestation`,
            `double-mining` or `freshness-cheat`), evidence_blob (base64
            of 1 byte to 1 MiB of kind-specific evidence),
            slash_amount_dust (greater than 0), memo (optional, at most
            256 bytes). Unknown fields and trailing data are rejected.

    SlashReceipt:
      type: object
      description: Outcome the slash applier recorded for one transaction.
      required:
        - tx_id
        - outcome
        - recorded_at
        - height
      properties:
        tx_id:
          type: string
        outcome:
          type: string
          enum:
            - applied
            - rejected
        recorded_at:
          type: string
          format: date-time
          description: When the receipt store first saw this tx_id.
        height:
          type: integer
          format: int64
          description: Chain height at which the slash was processed.
        slasher:
          type: string
          description: Sender of the slash transaction.
        node_id:
          type: string
          description: Offending node_id; omitted when the transaction was rejected as wrong_contract or for an undecodable payload.
        evidence_kind:
          type: string
          description: Omitted when the transaction was rejected as wrong_contract or for an undecodable payload.
        slashed_dust:
          type: integer
          format: int64
          description: Stake forfeited; applied only.
        rewarded_dust:
          type: integer
          format: int64
          description: Share paid to the slasher; applied only.
        burned_dust:
          type: integer
          format: int64
          description: slashed_dust minus rewarded_dust.
        auto_revoked:
          type: boolean
          description: True when the slash also revoked the enrollment into its unbond window.
        auto_revoke_remaining_dust:
          type: integer
          format: int64
          description: Stake still locked in the auto-revoked record.
        reject_reason:
          type: string
          description: |
            Rejected only. One of verifier_failed, evidence_replayed,
            node_not_enrolled, decode_failed, fee_invalid, wrong_contract,
            state_lookup_failed.
        error:
          type: string
          description: Rejection error text; rejected only.

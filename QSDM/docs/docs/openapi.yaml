openapi: 3.0.3
info:
  title: QSDM HTTP API
  description: |
    HTTP API of a QSDM node (Quantum-Secure Dynamic Mesh ledger). Native coin:
    Cell (CELL), 8 decimals, smallest unit `dust` (1 CELL = 100,000,000 dust).

    This file describes every route that `registerRoutes` in
    `QSDM/source/pkg/api/handlers.go` mounts under `/api/v1`, with parameters
    and request and response schemas taken from the handler code. It describes
    the code in this repository. The producer of the live pilot network runs
    extra recovery limits on top of it; for what that node accepts today see
    `API_REFERENCE.md` and `NETWORK_STATUS.md`. The operator-only admin API
    under `/api/admin/` is not described here.

    `TestOpenAPIMatchesRegisteredRoutes` (`QSDM/source/pkg/api/openapi_drift_test.go`)
    fails when a registered route is missing from this file, when this file
    lists a path the node does not register, or when the markers below
    disagree with the middleware.

    ## Access (`x-qsdm-access` on every operation)

    - `public`: no login (`isPublicEndpoint` in `pkg/api/middleware.go`).
      Writes on public routes are authorised by a signature inside the
      request body, for example the ML-DSA-87 signature of a wallet transfer,
      task action, stream action or miner enrollment.
    - `authenticated`: needs `Authorization: Bearer <access_token>` from
      `POST /auth/login` (security scheme `bearerAuth`). Requests other than
      GET must also carry `X-Timestamp` (Unix seconds, within 5 minutes of
      the node's clock), `X-Nonce` and `X-Signature`: a URL-safe base64
      signature over `<timestamp>:<nonce>:<body>` made with the node's own
      request-signing key (its ML-DSA key, or the configured JWT HMAC secret
      in builds without one). Only clients that hold that key can make these
      calls.
    - `operator`: no login, but the handler admits only the node operator,
      for example with a shared-secret header or from loopback only.
    - `closed`: registered but permanently disabled.

    ## Read-only nodes (`x-qsdm-follower: refused`)

    A network follower started with `QSDM_API_READ_ONLY=1` answers every
    operation marked `x-qsdm-follower: refused` with 503 and the header
    `X-QSDM-Node-Role: network-follower`. Reads, `/auth/*` and
    `POST /monitoring/ngc-proof` stay available. A producer started with
    `QSDM_RECOVERY_SIGNED_TRANSFERS_ENABLED=1` (which needs
    `QSDM_API_READ_ONLY=1` and `QSDM_NETWORK_BLOCK_PRODUCER=1`) is stricter:
    besides reads it admits only `POST /auth/login`, `/auth/register`,
    `/auth/logout`, `/monitoring/ngc-proof` and `/wallet/submit-signed`, plus
    `POST /mining/submit` while the mining canary admission is open. Other
    writes get 503 with `X-QSDM-Node-Role: recovery-producer`, and every
    response in that mode carries `X-QSDM-Write-Admission: signed-transfers-only`.

    ## Rate limits

    Requests are counted per client IP address. Behind a reverse proxy the
    node uses `X-Real-IP` (or the last `X-Forwarded-For` entry) only when
    `QSDM_TRUST_PROXY_HEADERS` is set. The default is 100 requests per minute
    (`[api] rate_limit_max_requests` / `rate_limit_window`, or
    `QSDM_API_RATE_LIMIT_MAX` / `QSDM_API_RATE_LIMIT_WINDOW`); routes with
    their own limit say so in their description, and GET reads of `/status`,
    `/versions`, `/chain/blocks`, `/chain/parents` and `/tasks*` allow 600 per
    minute. After that, a per-role limit applies: 30 requests per minute for
    callers without a token (per IP), 120 for signed-in users and 600 for
    admins (per address). `/health*`, `/mining/*` and GET reads of `/trust/*`
    and `/audit/*` skip both limits; `/status`, the 600-per-minute reads and
    the NGC ingest routes skip the per-role limit. A limited request gets 429
    with `Retry-After`.

    ## Errors and other common behaviour

    Most errors use the `Error` schema: `{"error": <HTTP status text>,
    "message": <detail>, "status": <code>}`. Some routes answer in plain text
    or with their own JSON; each operation lists its shapes. Request bodies
    are limited to 1 MiB. A request that runs longer than 30 seconds is
    cancelled and answered with 503 (its JSON body says `Gateway Timeout`,
    status 504); the trace WebSocket is exempt. When the node loads submesh
    profiles (`[network] submesh_config`
    / `QSDM_SUBMESH_CONFIG`), wallet sends and ledger writes can return 422
    when fee and geotag match no profile or the payload exceeds the profile's
    `max_tx_size`.
  version: 1.2.0
  contact:
    name: QSDM Development Team
    url: https://github.com/blackbeardONE/QSDM

servers:
  - url: https://api.qsdm.tech/api/v1
    description: Public reference node of the pilot network (see API_REFERENCE.md for what it accepts during recovery)
  - url: https://localhost:8443/api/v1
    description: Local node with TLS
  - url: http://localhost:8080/api/v1
    description: Local node without TLS (development only)

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Status
    description: Public node status (role, chain tip, coin and supply, consensus and mining posture)
  - name: Versions
    description: API version catalogue and lifecycle (deprecation and sunset)
  - name: Chain
    description: Committed blocks for catch-up, and Proof-of-Entanglement parents for new transfers
  - name: Network
    description: Live peer topology
  - name: Trust
    description: NGC attestation transparency; always "X of Y attested", never a bare count
  - name: Audit
    description: The project's self-maintained audit checklist (pkg/audit); not an independent audit
  - name: Attest
    description: Recent rejections of v2 mining attestations
  - name: Governance
    description: Runtime parameters of mining protocol v2 (read only)
  - name: Authentication
    description: Accounts and sessions on this node (JWT), and the CSRF token
  - name: Wallet
    description: Balances, nonces and CELL transfers
  - name: Tokens
    description: Secondary tokens registered on this node
  - name: Transactions
    description: Stored transactions
  - name: Validator
    description: Mesh3D transaction validation
  - name: Monitoring
    description: Ingest from the NVIDIA NGC attestation sidecar (shared secret)
  - name: Faucet
    description: Starter faucet of a local solo validator (loopback only)
  - name: Referrals
    description: Referral reward pool used by QSDM Hive
  - name: Wallet Recovery
    description: Encrypted wallet recovery capsules
  - name: Contracts
    description: Contracts and their call traces
  - name: Bridge
    description: Cross-chain asset locks and atomic swaps
  - name: Tasks
    description: QSDM-native task registry and signed task actions
  - name: Streams
    description: CELL metered-payment streams with signed usage receipts
  - name: Mining
    description: Mining work, proofs, emission, accounts and block headers
  - name: Receipts
    description: Per-transaction receipts
  - name: Enrollment
    description: Miner enrollment registry and signed (un)enrollment
  - name: Slashing
    description: Slashing submissions and their receipts

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: |
        Returns status `healthy` with build metadata and the NVIDIA-lock
        posture. The handler checks no dependencies (use `/health/ready` for
        that) and always answers 200. `nvidia_lock` is always present, also
        when the lock is disabled. Not rate limited. Other methods are not
        rejected.
      operationId: healthCheck
      x-qsdm-access: public
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: |
        Minimal process liveness: 200 whenever the API accepts HTTP. Not rate
        limited.
      operationId: healthLive
      x-qsdm-access: public
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: |
        200 when the storage backend's `Ready()` check succeeds; 503 with
        status `not_ready` when storage is not configured or `Ready()` fails.
        `checks.wallet_service` is `ok` or `unavailable` and is informational:
        it never changes the status code. Not rate limited.
      operationId: healthReady
      x-qsdm-access: public
      responses:
        '200':
          description: Ready (storage OK).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Storage is not configured or its readiness check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'

  /status:
    get:
      tags:
        - Status
      summary: Public node status
      description: |
        Unauthenticated, read-only node status: node ID, build metadata and
        uptime, chain tip and peer count, `node_role`, coin and branding
        metadata, a live emission-schedule snapshot at the chain tip,
        task-action readiness, the `consensus_auth` posture and the `mining`
        protocol posture. `chain_tip` and `peers` are 0 until the server wires
        their sources. Rate limit: 600 GET requests per minute per client IP
        and path; the default per-IP limit and the per-role limit do not
        apply.
      operationId: nodeStatus
      x-qsdm-access: public
      responses:
        '200':
          description: Node status snapshot.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeStatus'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /versions:
    get:
      tags:
        - Versions
      summary: API version catalogue
      description: |
        Returns every registered API major version with its lifecycle status
        and, where set, deprecation and sunset metadata, so an SDK can render
        a "deprecated" badge without scraping every response for
        `Deprecation` / `Sunset` headers. The built-in registry holds only
        `v1` (status `active`), and `current` is always `v1`.

        Lifecycle states (`status`):

        - `active`: the supported line.
        - `deprecated`: still routed; DeprecationMiddleware adds a
          `Deprecation` header, plus `Sunset` and `Link`
          (rel="successor-version", rel="deprecation") headers when those
          fields are set, to every response under the version's prefix.
        - `sunset`: DeprecationMiddleware answers every route under the
          prefix with 410 Gone.

        Rate limit: 600 GET requests per minute per client IP and path; the
        default per-IP limit and the per-role limit do not apply.
      operationId: apiVersions
      x-qsdm-access: public
      responses:
        '200':
          description: Version catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionCatalog'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /chain/blocks:
    get:
      tags:
        - Chain
      summary: Full blocks for ledger catch-up
      description: |
        Bounded, read-only feed of complete blocks (with their transactions)
        for validator catch-up over gateway transports. Receivers must still
        verify each block's hash, continuity and state root before appending.
        `to` defaults to the tip and is clamped to it; `from` defaults to
        `to - limit + 1` (floored at 0); the window is then cut to at most
        `limit` blocks starting at `from`. Returns 503 until a block source is
        wired (`api.SetChainBlocksProbe`; cmd/qsdm wires the block producer,
        clamped to its durable tip). Rate limit: 600 GET requests per minute
        per client IP and path; the default per-IP limit and the per-role
        limit do not apply.
      operationId: chainBlocks
      x-qsdm-access: public
      parameters:
        - name: from
          in: query
          required: false
          description: First height of the window.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: to
          in: query
          required: false
          description: Last height of the window. Defaults to the tip and is clamped to it.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of blocks. 0 selects the default of 16; values above 64 are clamped to 64.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 16
      responses:
        '200':
          description: The blocks in the window, in chain order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainBlocksResponse'
        '400':
          description: |
            `from`, `to` or `limit` is not a non-negative integer, or both
            `from` and `to` are given and `from` is greater than `to` (after
            `to` is clamped to the tip).
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: No block source is wired.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; always 5.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /chain/parents:
    parameters:
      - name: limit
        in: query
        required: false
        description: Maximum length of `recent`. 0 selects the default of 8; other values are clamped to 2..32.
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 8
    get:
      tags:
        - Chain
      summary: Proof-of-Entanglement parents for a new signed transfer
      description: |
        Public read. Returns the node's newest committed transaction IDs, read
        at its durable tip, newest first. Wallets copy `parents` into
        `parent_cells` just before signing. From the network's PoE activation
        height (`poe_activation_height`), a signed transfer must name 2-10
        distinct transactions committed in the last `window_blocks` blocks;
        these parents satisfy that rule before and after activation. Returns
        503 until a parent source is wired (`api.SetPoEParentSource`; cmd/qsdm
        wires the block producer) and while the node has no durable tip or
        fewer than two committed transactions to suggest. Rate limit: 600
        requests per minute per client IP and path, counted separately for GET
        and HEAD; the default per-IP limit and the per-role limit do not
        apply. See `PROOF_OF_ENTANGLEMENT.md`.
      operationId: chainParents
      x-qsdm-access: public
      responses:
        '200':
          description: Suggested parents.
          headers:
            Cache-Control:
              description: Always no-cache.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainParentsResponse'
        '400':
          description: '`limit` is not a non-negative integer.'
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: The method is neither GET nor HEAD.
          headers:
            Allow:
              description: The allowed methods, "GET, HEAD".
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: |
            No parent source is wired, the node has no durable tip yet, or
            fewer than two committed transactions are available.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; always 5.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'
    head:
      tags:
        - Chain
      summary: Probe the Proof-of-Entanglement parent source
      description: |
        Runs the same lookup as GET /chain/parents and returns the same
        status codes (except 405) and headers, without a body. Same rate
        limit as GET.
      operationId: chainParentsHead
      x-qsdm-access: public
      responses:
        '200':
          description: Parents are available.
          headers:
            Cache-Control:
              description: Always no-cache.
              schema:
                type: string
        '400':
          description: '`limit` is not a non-negative integer.'
        '503':
          description: |
            No parent source is wired, the node has no durable tip yet, or
            fewer than two committed transactions are available.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; always 5.
              schema:
                type: integer

  /network/topology:
    get:
      tags:
        - Network
      summary: Live network topology
      description: |
        Live JSON projection of the current peer set, built by
        `internal/topology.BuildLiveView` so the dashboard WebGL renderer can
        consume it directly: the local node plus one cell per peer, grouped
        by region, with links from the local node to every peer and between
        neighbouring peers. Returns an empty topology (200, only the local
        cell) when no `TopologyProvider` is installed, which keeps the
        dashboard functional on cold start. Not public: AuthMiddleware
        requires a Bearer JWT. The default limits apply: 100 requests per
        minute per client IP and path (configurable) and the per-role limit
        of the token's role.
      operationId: networkTopology
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Topology projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkTopology'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trust/attestations/summary:
    get:
      tags:
        - Trust
      summary: NGC attestation summary
      description: |
        Anti-claim transparency widget. Always returns "X of Y attested" so
        the consumer can never display a bare count. Zero opt-in and
        NGC-outage states are legal 200 responses: they are not hidden and
        never load forever. The aggregator is refreshed on every request.
        Returns 503 (warming up) until an aggregator is installed and for the
        first 60 seconds after it is created, and 404 when the operator
        disabled the trust endpoints (`[trust] disabled = true` or
        `QSDM_TRUST_DISABLED=1`). GET requests are exempt from HTTP rate
        limiting.
      operationId: trustSummary
      x-qsdm-access: public
      responses:
        '200':
          description: Aggregator summary snapshot.
          headers:
            Cache-Control:
              description: Always "public, max-age=5".
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustSummary'
        '404':
          description: The trust endpoints are disabled on this node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustError'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: |
            No aggregator is installed yet, or it is still inside its 60-second
            warm-up.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; always 5.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustError'

  /trust/attestations/recent:
    get:
      tags:
        - Trust
      summary: NGC attestation recent rows
      description: |
        Up to `limit` of the fresh attestation rows (attested within
        `fresh_within`), newest first. `node_id_prefix` is always the first 8
        characters of the peer ID, a U+2026 ellipsis character and its last 4
        characters; the aggregator applies this redaction before caching.
        `region_hint` is the coarse four-bucket taxonomy (eu, us, apac,
        other). The 404 (disabled) and 503 (warming up) cases, the
        per-request refresh, the caching and the rate-limit exemption are the
        same as for the summary.
      operationId: trustRecent
      x-qsdm-access: public
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Values below 1 select 50; values above 200 are clamped to 200.
          schema:
            type: integer
            format: int64
            default: 50
      responses:
        '200':
          description: Recent fresh attestations.
          headers:
            Cache-Control:
              description: Always "public, max-age=5".
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustRecent'
        '400':
          description: '`limit` is not an integer.'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: The trust endpoints are disabled on this node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustError'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: |
            No aggregator is installed yet, or it is still inside its 60-second
            warm-up.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; always 5.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustError'

  /audit/summary:
    get:
      tags:
        - Audit
      summary: Audit checklist summary
      description: |
        Public-API mirror of the operator dashboard's `/api/audit/summary`
        (bearer-gated), with the same JSON shape (pinned by
        `TestAuditAPI_WireParity_DashboardAndAPI`). Returns bucket counts,
        score, the blocking-findings flag, count and preview, and a 4-bucket
        evidence-provenance breakdown of the passed items in the compiled-in
        checklist (`pkg/audit/checklist.go`).

        Cache: `Cache-Control: public, max-age=60`. A flip is a Git commit
        plus redeploy event, so 60 s of staleness is acceptable. GET requests
        are exempt from HTTP rate limiting.
      operationId: auditSummary
      x-qsdm-access: public
      responses:
        '200':
          description: Current audit checklist summary.
          headers:
            Cache-Control:
              description: Always "public, max-age=60".
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditSummary'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string

  /audit/items:
    get:
      tags:
        - Audit
      summary: Audit checklist items (filterable)
      description: |
        Full filterable items list, public mirror of the dashboard's
        `/api/audit/items`. Each filter is trimmed and then validated against
        the `pkg/audit` constants: an unknown value returns 400, not a silent
        "all items" passthrough. Items keep checklist order. Applied filters
        are echoed back in `filters`, which is omitted when no filter is set.
        Cache: `Cache-Control: public, max-age=60`. GET requests are exempt
        from HTTP rate limiting.
      operationId: auditItems
      x-qsdm-access: public
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditCategory'
        - name: severity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditSeverity'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditStatus'
      responses:
        '200':
          description: Filtered items list.
          headers:
            Cache-Control:
              description: Always "public, max-age=60".
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditItemsResponse'
        '400':
          description: A filter value is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string

  /audit/badge.svg:
    get:
      tags:
        - Audit
      summary: Server-rendered SVG audit-score badge
      description: |
        Renders a 20-pixel-tall, shields.io-style status pill SVG with the
        current audit score and bucket totals (for example
        `QSDM audit | 95.40% (83/87)`). The count shown is `passed + waived`
        over `total`. Colour is computed from the score:

        | Score range | Colour      | Hex       |
        |-------------|-------------|-----------|
        | `>= 95`     | brightgreen | `#4c1`    |
        | `>= 85`     | yellowgreen | `#a4a61d` |
        | `>= 70`     | yellow      | `#dfb317` |
        | `>= 50`     | orange      | `#fe7d37` |
        | `< 50`      | red         | `#e05d44` |

        When the checklist has zero items the value is a static `0/0` (red)
        instead of a division by zero. Public read (no auth, no signing).
        Cached 60 s (`Cache-Control: public, max-age=60`); a flip is a Git
        commit plus redeploy event so 60 s of staleness is acceptable. GET
        requests are exempt from HTTP rate limiting. Note that the global
        SecurityHeaders middleware also sets
        `Cross-Origin-Resource-Policy: same-origin` on this response.
      operationId: auditBadgeSVG
      x-qsdm-access: public
      responses:
        '200':
          description: SVG badge image.
          headers:
            Cache-Control:
              description: Always "public, max-age=60".
              schema:
                type: string
            X-Content-Type-Options:
              description: Always nosniff.
              schema:
                type: string
          content:
            image/svg+xml:
              schema:
                type: string
                description: Shields.io-style two-panel SVG (label and value), served with charset=utf-8.
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string

  /attest/recent-rejections:
    get:
      tags:
        - Attest
      summary: Recent attestation rejections
      description: |
        Paged read of the bounded in-memory ring of v2 attestation rejections
        (MINING_PROTOCOL_V2.md section 4.6), the per-event companion to the
        `qsdm_attest_archspoof_rejected_total` and
        `qsdm_attest_hashrate_rejected_total` counters. Records come in
        ascending `seq` order; pass `next_cursor` back as `cursor` to read the
        next page. The `kind`, `reason` and `arch` filters are closed enums:
        an unknown value returns 400 instead of being ignored. Returns 503
        until a lister is wired (`api.SetRecentRejectionLister`, called by
        internal/v2wiring). Not public: AuthMiddleware requires a Bearer JWT.
        The default limits apply: 100 requests per minute per client IP and
        path (configurable) and the per-role limit of the token's role.
      operationId: recentRejections
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Exclusive lower bound on `seq`; pass the previous page's `next_cursor`.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Page size. 0 selects the store default of 100; values above 500 are clamped to 500.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 100
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AttestRejectionKind'
        - name: reason
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AttestRejectionReason'
        - name: arch
          in: query
          required: false
          schema:
            type: string
            enum:
              - ada
              - hopper
              - blackwell
              - blackwell_ultra
              - rubin
              - rubin_ultra
              - unknown
        - name: since
          in: query
          required: false
          description: Unix seconds; drops records recorded strictly before this time.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: One page of matching records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestRecentRejectionsPage'
        '400':
          description: |
            `cursor`, `limit` or `since` is not a non-negative integer, or
            `kind`, `reason` or `arch` is not one of the allowed values.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: No recent-rejections store is wired on this node.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; always 5.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /governance/params:
    get:
      tags:
        - Governance
      summary: Governance parameters snapshot
      description: |
        Read companion to the `qsdm/gov/v1` write path that flows through
        `/transactions`. Returns the active values, the staged changes
        (sorted by effective height, then parameter name), the static
        parameter registry (sorted by name), the configured authorities
        (sorted) and whether governance is enabled. Returns 503 until a
        provider is installed via `api.SetGovernanceProvider(...)`
        (internal/v2wiring does this). See `MINING_PROTOCOL_V2.md` section
        9.4. Not public: AuthMiddleware requires a Bearer JWT. The default
        limits apply: 100 requests per minute per client IP and path
        (configurable) and the per-role limit of the token's role.
      operationId: governanceParams
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Governance parameter snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceParams'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: No governance provider is wired on this node.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; always 5.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /governance/params/{name}:
    get:
      tags:
        - Governance
      summary: Single governance parameter
      description: |
        One parameter: its active value, its staged change (if any) and its
        registry entry. Served by the `/api/v1/governance/params/` prefix
        route; one trailing slash after the name is ignored. Returns 503
        until a provider is installed (checked before the name), 400 when the
        name is empty, contains a slash or is longer than 64 bytes, and 404
        when the name is not in the registry. Not public: AuthMiddleware
        requires a Bearer JWT. The default limits apply: 100 requests per
        minute per client IP and path (configurable) and the per-role limit
        of the token's role.
      operationId: governanceParam
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Registry name of the parameter.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: The parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceParam'
        '400':
          description: The name is empty, contains a slash, or is longer than 64 bytes.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No registry entry has this name.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: The method is not GET.
          headers:
            Allow:
              description: The allowed method, GET.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: No governance provider is wired on this node.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; always 5.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiningUnavailable'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: |
        Creates an account with role `user` for `address` (trimmed and
        lowercased) and stores an Argon2id hash of `password`; log in with
        `POST /auth/login` to get bearer tokens. Registration does not prove
        control of the address. Rate limited to 3 requests per minute per
        client IP.
      operationId: register
      x-qsdm-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRegisterResponse'
        '400':
          description: |
            The body is not JSON, `address` is empty or not a hex string of
            32 to 128 characters, or `password` fails the password policy
            (the message starts with `password validation failed:`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An account for this address already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            The account could not be stored. The message is
            `internal server error (id=<id>)`, followed by the raw error
            unless QSDM_PRODUCTION_MODE is on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      description: |
        Checks `address` (trimmed and lowercased) and `password` against the
        account store and returns an access token valid for 15 minutes and a
        refresh token valid for 7 days. Five failed attempts for one address
        within 15 minutes lock that address for 15 minutes. Rate limited to
        5 requests per minute per client IP.
      operationId: login
      x-qsdm-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Credentials accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: The body is not JSON, or `address` is not a hex string of 32 to 128 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            Unknown address or wrong password. The message is
            `invalid credentials. <n> attempts remaining`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            The address is locked after too many failed attempts (JSON Error
            body; the message says how long the lock lasts), or the client IP
            exceeded the 5 requests per minute rate limit (plain text
            `Rate limit exceeded` with a Retry-After header).
          headers:
            Retry-After:
              description: Seconds until the rate-limit window resets. Sent only with the plain-text response.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema:
                type: string
        '500':
          description: |
            A token could not be created. The message is
            `internal server error (id=<id>)`, followed by the raw error
            unless QSDM_PRODUCTION_MODE is on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Revoke the presented bearer token
      description: |
        Revokes the bearer token that authenticated this request: its nonce
        is kept in the node's in-memory revocation store (lost on restart)
        until the token expires, and AuthMiddleware rejects the token from
        then on. Only the presented token is revoked, not the other token
        from the same login, and requests that already passed AuthMiddleware
        complete. The request-signing middleware also requires X-Timestamp,
        X-Nonce and X-Signature headers, checked against the API server's own
        signing key (400 when they are missing, 401 when the signature does
        not verify).
      operationId: logout
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLogoutResponse'
        '400':
          description: |
            X-Timestamp, X-Nonce or X-Signature is missing, or X-Timestamp is
            not an integer (request-signing middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            No valid bearer token (missing, not `Bearer <token>`, malformed,
            expired or revoked), or X-Signature does not verify or X-Timestamp
            is more than 300 seconds from the node's clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The server has no auth manager configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /csrf-token:
    get:
      tags:
        - Authentication
      summary: Issue a CSRF token
      description: |
        Mints a random token valid for one hour and also sets it as the
        `qsdm_csrf` cookie. CSRFMiddleware asks for such a token in the
        X-CSRF-Token header (equal to the cookie when one is sent) on
        requests other than GET, HEAD and OPTIONS to routes that need a JWT,
        when they carry no `Authorization: Bearer` header. This route is
        public, so no JWT claims reach the handler and the tokens it issues
        are never bound to a user.
      operationId: getCsrfToken
      x-qsdm-access: public
      responses:
        '200':
          description: Token issued.
          headers:
            Set-Cookie:
              description: |
                `qsdm_csrf=<csrf_token>; Path=/; Max-Age=3600; SameSite=Strict`,
                with `Secure` when the request arrived over TLS. Not HttpOnly,
                so page scripts can read it.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The token could not be generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No CSRF manager is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/create:
    post:
      tags:
        - Wallet
      summary: Create wallet
      description: |
        Generates a fresh ML-DSA-87 key pair on the node and returns its
        address with balance 0. The request body is not read. The private key
        is neither returned nor kept, so no one can sign for the address
        afterwards. This route does not use the node's wallet service: when
        no key can be generated (for example liboqs or OpenSSL missing on a
        CGO build) it answers 500.
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: createWallet
      x-qsdm-access: public
      x-qsdm-follower: refused
      responses:
        '201':
          description: Address generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletCreateResponse'
        '405':
          description: The method is not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            No key pair could be generated. The message is
            `internal server error (id=<id>)`, followed by the raw error
            unless QSDM_PRODUCTION_MODE is on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/balance:
    get:
      tags:
        - Wallet
      summary: Get wallet balance
      description: |
        Returns the CELL balance of `address`. The node reads its storage
        backend's balance table (0 for an address it has never seen), then
        prefers the validator's canonical account store when that store holds
        the address; `source` says which one answered. The address is not
        format-checked.
      operationId: getBalance
      x-qsdm-access: public
      parameters:
        - name: address
          in: query
          required: true
          description: |
            Wallet address. The handler would fall back to the caller's JWT
            address, but this route is public: AuthMiddleware never reads a
            token here, so the parameter is required in practice.
          schema:
            type: string
      responses:
        '200':
          description: Balance found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceResponse'
        '400':
          description: '`address` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            The storage backend read failed, even if the account store holds
            the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/send:
    post:
      tags:
        - Wallet
      summary: Send CELL from the node's own wallet
      description: |
        Builds a transfer from the node's own wallet to `recipient`, signs it
        with the node wallet's key and settles it at once in the storage
        backend (`ApplyTransferAtomic`: unique transaction ID,
        `balance >= amount + fee`, debit and credit in one database
        transaction; only the SQLite backend implements it). The caller's JWT
        identity is not used, so any authenticated caller spends from the
        node wallet, and the transfer is not queued in the validator mempool
        that `/wallet/submit-signed` uses. After settlement the signed
        transaction is broadcast to peers when P2P gossip is wired. NVIDIA
        lock (403) and, when submesh profiles are loaded, submesh routing
        (422) apply. Rate limited to 10 requests per minute per client IP.
        The request-signing middleware also requires X-Timestamp, X-Nonce and
        X-Signature headers, checked against the API server's own signing key
        (400 when they are missing, 401 when the signature does not verify).
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: sendTransaction
      x-qsdm-access: authenticated
      x-qsdm-follower: refused
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletSendRequest'
      responses:
        '201':
          description: |
            Transfer settled in storage. `status` is `pending` even though the
            balances have already moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletSendResponse'
        '400':
          description: |
            The body is not JSON; `recipient` is not a hex string of 32 to 128
            characters; `amount` or `fee` is outside 0.00000001 to 1000000000
            (so a zero fee is refused); `geotag` is longer than 100
            characters; or `parent_cells` has more than 10 entries or one that
            is not 16 to 128 characters from `[0-9A-Za-z_-]`. Also returned by
            the request-signing middleware when X-Timestamp, X-Nonce or
            X-Signature is missing or X-Timestamp is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            No valid bearer token (missing, not `Bearer <token>`, malformed,
            expired or revoked), or X-Signature does not verify or X-Timestamp
            is more than 300 seconds from the node's clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: The node wallet's storage balance does not cover `amount + fee`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            NVIDIA lock is on (QSDM_NVIDIA_LOCK) and no recent qualifying NGC
            proof bundle is stored; the message names the missing condition.
            With ingest-nonce mode on, every passing check uses up the bundle
            it matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The transaction ID is already stored (WalletSendResponse with
            `status: duplicate`). The handler also maps a storage nonce
            conflict to 409 with an Error body, which this path cannot raise
            today because it settles without a nonce.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WalletSendResponse'
                  - $ref: '#/components/schemas/Error'
        '422':
          description: |
            Submesh policy: no loaded profile matches `fee` and `geotag`, or
            the signed transaction is larger than the matched profile's
            `max_tx_size`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            The transaction could not be built (`failed to create
            transaction`: for example an `amount` below 1, which truncates to
            0, or a node-wallet preflight balance, synced from the canonical
            ledger, below the amount), it carries no ID, or the storage write
            failed (`failed to apply transfer`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: The storage backend cannot settle transfers (only the SQLite backend can).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            The node's wallet service did not initialize at startup, or the
            node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/submit-signed:
    post:
      tags:
        - Wallet
      summary: Submit a self-custody signed transfer
      description: |
        Accepts a fully client-signed `wallet.TransactionData` envelope and
        moves CELL from `sender` to `recipient` when the envelope's ML-DSA-87
        signature verifies against its own embedded `public_key` and
        `sender == hex(sha256(public_key))`.

        Use this endpoint instead of `/wallet/send` when the signer is not the
        node's own wallet, for example a browser wallet or an SDK that holds
        the user's ML-DSA-87 private key. No JWT is needed: the cryptographic
        identity is the envelope's `public_key`. The body is read up to
        64 KiB. Rate limited to 10 requests per minute per client IP. The
        node's wallet service must be up, because it verifies the signature.

        ## Canonical signing payload

        The signature covers the JSON encoding of the envelope with
        `signature` set to `""` and `public_key` cleared, as Go's
        `encoding/json` writes it: fields in struct order (`id`, `sender`,
        `recipient`, `amount`, `fee`, `geotag`, `parent_cells`, `nonce`,
        `signature`, `timestamp`), with `nonce` omitted when it is 0 and
        `public_key` omitted because it is empty. The node rebuilds this
        payload from the decoded envelope, so the signer must format numbers
        exactly as Go does; the browser-wallet WASM helper
        (`qsdm_wallet_sign_transaction`) and `qsdmcli wallet sign-tx` use
        Go's own `json.Marshal` for that reason.

        ## Checks before settlement

        1. **Shape**: `sender` and `recipient` are hex addresses and
           `recipient` is a lowercase 64-character wallet address; `amount`
           is 0.00000001 to 1000000000; `fee` is 0 or in that range;
           `geotag` is at most 100 characters; `parent_cells` has at most 10
           IDs of 16 to 128 characters from `[0-9A-Za-z_-]`; `id`,
           `public_key` and `signature` are present, the last two as hex.
           Failure: 400.
        2. **Sender binding**: `sender == hex(sha256(public_key))`, else 400
           (`qsdm_wallet_send_total{result="sender_mismatch"}`).
        3. **Signature**: ML-DSA-87 over the canonical payload, else 422
           (`result="signature_invalid"`).
        4. **Nonce** (only when `nonce >= 1`): `nonce` must equal the
           sender's last applied nonce + 1 (`next` from `GET /wallet/nonce`).
           A lower nonce is a replay and a higher one a gap; both answer 409.
        5. **Submesh policy** (when submesh profiles are loaded): the same
           gate as `/wallet/send`, else 422.

        ## Settlement on a validator

        A validator queues the transfer for its block producer and applies it
        when the block commits. `nonce` must be at least 1 (400) and the
        sender's committed CELL balance must cover `amount + fee` (402).
        Because the nonce check reads the committed nonce, a sender can have
        only one transfer queued at a time. Proof-of-Entanglement: from 360
        blocks before the configured activation height on
        (`[consensus] poe_activation_height` or QSDM_POE_ACTIVATION_HEIGHT;
        0, the default, never activates), `parent_cells` must hold 2 to 10
        distinct IDs of transactions committed in the last 8640 blocks
        (pending ones do not count), none equal to `id`; otherwise, or when
        the node's committed-history index is not ready, the answer is 422
        with a hint to sign again with parents from `GET /chain/parents`. A
        full queue answers 503. Success is 202 with `status: pending` and
        `broadcast: block-pending`.

        ## Settlement without a validator queue

        Nodes without the queue (tools and tests) settle at once: through a
        local transfer ledger when one is wired, holds the sender and `nonce`
        is at least 1, otherwise through the storage backend's
        `ApplyTransferAtomic` (transaction-ID uniqueness, the nonce
        check-and-set, `balance >= amount + fee`, and the debit and credit in
        one database transaction; only the SQLite backend implements it,
        others answer 501). Success is 200 with `status: accepted`;
        `broadcast` is `p2p` when the envelope was gossiped to peers, else
        `local-only`.

        ## Resubmission

        Sending the same envelope again answers 409: with `status: duplicate`
        and the original `transaction_id` while the first copy is still
        queued (or, for a nonce-0 envelope, already stored), or with a
        `nonce replay` error once it has been applied.

        The one exception to the follower rule below: a recovery producer
        (QSDM_RECOVERY_SIGNED_TRANSFERS_ENABLED=1) admits this route while it
        refuses other writes.
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: submitSignedTransaction
      x-qsdm-access: public
      x-qsdm-follower: refused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletTransactionEnvelope'
      responses:
        '200':
          description: |
            Settled at once on a node without a validator queue
            (`status: accepted`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletSubmitSignedResponse'
        '202':
          description: |
            Queued on a validator (`status: pending`,
            `broadcast: block-pending`); it is applied when its block commits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletSubmitSignedResponse'
        '400':
          description: |
            The body is not a JSON envelope within 64 KiB (`invalid envelope:`
            plus the decode error); a field fails the shape checks; `sender`
            is not hex(sha256(public_key)); `public_key` or `signature` is not
            hex; or a validator received a nonce-0 envelope
            (`legacy nonce-zero wallet transfers are not accepted by a validator`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: |
            The sender's balance does not cover `amount + fee`: on a
            validator its committed CELL balance (or it has no account),
            otherwise its balance in the local ledger or the storage backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `status: duplicate` (WalletSubmitSignedResponse): the validator
            already has a receipt for this `id` or has it queued, the `id`
            starts with a reserved prefix (`solo-reward-`, `solo-heartbeat-`),
            or another transfer from this sender with the same nonce is queued
            (this one is not queued); without a validator queue, the storage
            backend already holds this `id`. Error body: `nonce` is not the
            sender's last applied nonce + 1 (`nonce replay` when lower,
            `nonce gap` when higher), or the stored nonce moved during
            settlement (`nonce conflict`; read the nonce again and retry).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WalletSubmitSignedResponse'
                  - $ref: '#/components/schemas/Error'
        '422':
          description: |
            The signature does not verify under `public_key` over the
            canonical payload; submesh routing failed (no profile for `fee`
            and `geotag`, or the envelope exceeds the profile's
            `max_tx_size`); or, on a validator, a Proof-of-Entanglement rule
            failed (the message starts with `proof-of-entanglement:`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            The nonce lookup failed (`nonce lookup failed`), the validator
            queue refused the transfer for another reason, for example while
            block extension is blocked (`failed to queue signed transfer`), or
            settlement failed (`failed to apply transfer`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: |
            The node has no validator queue and its storage backend cannot
            settle transfers (only the SQLite backend can).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            The node's wallet service did not initialize at startup, the
            validator queue is full (`validator transaction queue is full;
            retry after the next block`), or the node is a read-only
            follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/nonce:
    get:
      tags:
        - Wallet
      summary: Read next nonce for a self-custody envelope
      description: |
        Returns the last applied nonce of `sender` and `next`, the value the
        next `POST /wallet/submit-signed` envelope must carry in `nonce`. The
        value comes from the node's local transfer ledger or canonical account
        store when either holds the address, otherwise from the storage
        backend (0 for a sender it has never seen); transfers still waiting in
        a mempool are not counted. A storage error answers 500 instead of a
        guessed value, so a client never falls back to nonce 1 against
        storage it cannot trust.
      operationId: walletNonce
      x-qsdm-access: public
      parameters:
        - name: sender
          in: query
          required: true
          description: |
            Sender address, a hex string of 32 to 128 characters (for a
            wallet, the lowercase hex SHA-256 of its public key). The handler
            would fall back to the caller's JWT address, but this route is
            public, so the parameter is required in practice.
          schema:
            type: string
      responses:
        '200':
          description: Nonce found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletNonceResponse'
        '400':
          description: '`sender` is missing or is not a hex string of 32 to 128 characters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The storage backend could not return the nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/address:
    get:
      tags:
        - Wallet
      summary: Get the node wallet's address
      description: |
        Returns the address of the node's own wallet, the one
        `POST /wallet/send` spends from, whoever the caller is. It is not the
        caller's address.
      operationId: getAddress
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The node wallet's address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAddressResponse'
        '401':
          description: |
            No valid bearer token: the Authorization header is missing or not
            `Bearer <token>`, or the token is malformed, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/WalletService503'

  /wallet/mint:
    post:
      tags:
        - Wallet
      summary: Removed main-coin mint (always 410 Gone)
      deprecated: true
      description: |
        Removed in v0.3.3. The handler ignores any body and always answers
        410 Gone with a `migration` block, counting the call in
        `qsdm_wallet_mint_total{result="gone"}`. The route stays in the
        public list so old callers get the 410 instead of a 401. The
        `named_token_minting` text says that `POST /tokens/mint` updates
        balances; in this code that route only records the mint. Rate limited
        to 20 requests per minute per client IP.
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: mintMainCoin
      x-qsdm-access: closed
      x-qsdm-follower: refused
      responses:
        '405':
          description: The method is not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: The endpoint is removed; see `migration` for replacements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletMintGoneResponse'
        '503':
          description: The node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tokens/mint:
    post:
      tags:
        - Tokens
      summary: Record a named-token mint
      description: |
        Writes a mint record (`type: mint` with `token`, `amount`, `recipient`
        and `tx_id`) to the storage backend's transaction log and returns its
        ID. No balance is credited: the record has no `sender`, so no storage
        backend applies a balance change, and it has no `id`, so
        `GET /transactions/{tx_id}` cannot find it. `token_symbol` is not
        checked against the token registry and `recipient` is not
        format-checked. NVIDIA lock (403) and the strictest submesh
        `max_tx_size` cap (422) apply. Rate limited to 15 requests per minute
        per client IP. The request-signing middleware also requires
        X-Timestamp, X-Nonce and X-Signature headers, checked against the API
        server's own signing key (400 when they are missing, 401 when the
        signature does not verify).
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: mintToken
      x-qsdm-access: authenticated
      x-qsdm-follower: refused
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenMintRequest'
      responses:
        '200':
          description: Mint recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenMintResponse'
        '400':
          description: |
            The body is not JSON, `token_symbol` or `recipient` is empty, or
            `amount` is not positive. Also returned by the request-signing
            middleware when X-Timestamp, X-Nonce or X-Signature is missing or
            X-Timestamp is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            No valid bearer token (missing, not `Bearer <token>`, malformed,
            expired or revoked), or X-Signature does not verify or X-Timestamp
            is more than 300 seconds from the node's clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            NVIDIA lock is on (QSDM_NVIDIA_LOCK) and no recent qualifying NGC
            proof bundle is stored; the message names the missing condition.
            With ingest-nonce mode on, every passing check uses up the bundle
            it matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/SubmeshPolicy422'
        '500':
          description: The record could not be stored (`failed to store transaction`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tokens/create:
    post:
      tags:
        - Tokens
      summary: Create a new token definition
      description: |
        Writes a `token_creation` record to the storage backend's transaction
        log and adds the token to the node's token registry, which
        `GET /tokens/list` returns and which is saved to the registry file
        when the node has one (a failed save is only logged). Symbols are not
        checked for uniqueness and `total_supply` is not issued to anyone.
        NVIDIA lock (403) and the strictest submesh `max_tx_size` cap (422)
        apply. Rate limited to 10 requests per minute per client IP. The
        request-signing middleware also requires X-Timestamp, X-Nonce and
        X-Signature headers, checked against the API server's own signing key
        (400 when they are missing, 401 when the signature does not verify).
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: createToken
      x-qsdm-access: authenticated
      x-qsdm-follower: refused
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreateRequest'
      responses:
        '201':
          description: Token recorded and registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreateResponse'
        '400':
          description: |
            The body is not JSON, `name` or `symbol` is empty, `decimals` is
            outside 0 to 18, or `total_supply` is negative. Also returned by
            the request-signing middleware when X-Timestamp, X-Nonce or
            X-Signature is missing or X-Timestamp is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            No valid bearer token (missing, not `Bearer <token>`, malformed,
            expired or revoked), or X-Signature does not verify or X-Timestamp
            is more than 300 seconds from the node's clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            NVIDIA lock is on (QSDM_NVIDIA_LOCK) and no recent qualifying NGC
            proof bundle is stored; the message names the missing condition.
            With ingest-nonce mode on, every passing check uses up the bundle
            it matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/SubmeshPolicy422'
        '500':
          description: The record could not be stored (`failed to store token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tokens/list:
    get:
      tags:
        - Tokens
      summary: List known tokens
      description: |
        Lists the native coin twice, as `main_cell` and as the deprecated
        alias `main_coin` (Cell, CELL, 8 decimals, `total_supply` 0), then
        every token added through `POST /tokens/create`, which the node keeps
        in memory and restores from its token registry file at startup when
        it has one. The route is not in the public list, so it needs a bearer
        token. Rate limited to 60 requests per minute per client IP.
      operationId: listTokens
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenListResponse'
        '401':
          description: |
            No valid bearer token: the Authorization header is missing or not
            `Bearer <token>`, or the token is malformed, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions:
    get:
      tags:
        - Transactions
      summary: List transactions
      description: |
        Returns up to `limit` transactions from the storage backend's index
        in which `address` is the sender or the recipient, newest first.
        `address` defaults to the caller's JWT address, and any authenticated
        caller may name any address. The file storage backend keeps no index
        and always returns an empty list.
      operationId: listTransactions
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of transactions. A value that is not an integer
            from 1 to 1000 is ignored and 50 is used.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 1000
            default: 50
        - name: address
          in: query
          required: false
          description: Address to list; defaults to the caller's JWT address. Not format-checked.
          schema:
            type: string
      responses:
        '200':
          description: Transactions found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '401':
          description: |
            No valid bearer token: the Authorization header is missing or not
            `Bearer <token>`, or the token is malformed, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The storage backend query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: The storage backend has no transaction history query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions/{tx_id}:
    get:
      tags:
        - Transactions
      summary: Get transaction by ID
      description: |
        Returns the stored transaction whose indexed ID is `tx_id`: the
        decrypted JSON as stored, with `sender`, `recipient`, `amount` and
        `timestamp` replaced by the storage index columns. Records stored
        without an `id` field (mint and token-creation records) cannot be
        found this way, and the file storage backend does not support lookups
        (500).
      operationId: getTransaction
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      parameters:
        - name: tx_id
          in: path
          required: true
          description: Everything after `/transactions/` in the path; not format-checked.
          schema:
            type: string
      responses:
        '200':
          description: The stored transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRecord'
        '400':
          description: The ID is empty (a request to `/transactions/`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            No valid bearer token: the Authorization header is missing or not
            `Bearer <token>`, or the token is malformed, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            The storage backend reported exactly `transaction not found`. The
            SQLite and Scylla backends wrap that message in a storage error,
            so with them an unknown ID answers 500 instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            The lookup failed (`failed to get transaction`), which includes an
            unknown ID on the SQLite and Scylla backends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: No storage backend is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /validator/validate:
    post:
      tags:
        - Validator
      summary: Validate a mesh wire transaction
      description: |
        Checks a mesh wire transaction against the entanglement-structure
        rules of the mesh3d validator and stores nothing: 3 to 5 parent cells
        with distinct, non-empty IDs, each cell's `Data` equal to sha256 of
        its ID; `transaction_id` at least 16 characters and a prefix of the
        envelope's `id`; `data` a wallet envelope (unknown fields refused)
        that passes the signed-transfer check (ML-DSA-87 signature,
        `sender == hex(sha256(public_key))`, `nonce` at least 1) and whose
        own `parent_cells` pass the Proof-of-Entanglement shape rules; the
        first n-1 cell IDs equal the envelope's first n-1 `parent_cells` and
        the last is hex(sha256(data)). A failed check answers 200 with
        `valid: false` and the reason in `message`. The request-signing
        middleware also requires X-Timestamp, X-Nonce and X-Signature
        headers, checked against the API server's own signing key (400 when
        they are missing, 401 when the signature does not verify).
        A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: validateTransaction
      x-qsdm-access: authenticated
      x-qsdm-follower: refused
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatorValidateRequest'
      responses:
        '200':
          description: Validation result, valid or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorValidateResponse'
        '400':
          description: |
            The body does not decode (including `data` or a cell `Data` that is
            not base64). Also returned by the request-signing middleware when
            X-Timestamp, X-Nonce or X-Signature is missing or X-Timestamp is
            not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            No valid bearer token (missing, not `Bearer <token>`, malformed,
            expired or revoked), or X-Signature does not verify or X-Timestamp
            is more than 300 seconds from the node's clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /monitoring/ngc-challenge:
    get:
      tags:
        - Monitoring
      summary: Issue ingest nonce (NVIDIA-lock nonce mode)
      description: |
        For the node operator's NGC sidecar. No JWT: the request must carry
        the node's NGC ingest secret (QSDM_NGC_INGEST_SECRET) in
        X-QSDM-NGC-Secret, or in the legacy X-QSDMPLUS-NGC-Secret header.
        Returns a single-use nonce for one `POST /monitoring/ngc-proof`
        bundle. Answers 404 when the node has no ingest secret or ingest-nonce
        mode (QSDM_NVIDIA_LOCK_REQUIRE_INGEST_NONCE) is off. Rate limited to
        15 requests per minute per client IP; the rate limiter's 429 is plain
        text with a Retry-After header.
      operationId: ngcIngestChallenge
      x-qsdm-access: operator
      parameters:
        - $ref: '#/components/parameters/NgcIngestSecretPrimary'
        - $ref: '#/components/parameters/NgcIngestSecretLegacy'
      responses:
        '200':
          description: Nonce issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgcChallengeResponse'
        '401':
          description: The secret header is missing or wrong (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            The node has no NGC ingest secret (`not found`), or ingest-nonce
            mode is off (`ingest nonce challenge disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            No nonce could be issued (`failed to issue nonce`), normally
            because 512 issued nonces are still unused and unexpired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /monitoring/ngc-proof:
    post:
      tags:
        - Monitoring
      summary: Ingest NGC GPU proof bundle
      description: |
        For the node operator's NGC sidecar (apps/qsdm-nvidia-ngc). No JWT:
        the request must carry the NGC ingest secret header. Accepts a JSON
        object of at most 512 KiB that has a `cuda_proof_hash` key and keeps
        it in an in-memory ring of the newest 32 bundles, which the NVIDIA-lock
        check and the trust endpoints read. In ingest-nonce mode
        (QSDM_NVIDIA_LOCK_REQUIRE_INGEST_NONCE) the bundle must also carry an
        unused nonce from `GET /monitoring/ngc-challenge` and a valid
        `qsdm_proof_hmac` under QSDM_NVIDIA_LOCK_PROOF_HMAC_SECRET; with no
        HMAC secret set every bundle is refused in that mode. Answers 404 when
        the node has no ingest secret. Rate limited to 30 requests per minute
        per client IP. Read-only followers accept this route.
      operationId: ngcProofIngest
      x-qsdm-access: operator
      parameters:
        - $ref: '#/components/parameters/NgcIngestSecretPrimary'
        - $ref: '#/components/parameters/NgcIngestSecretLegacy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NgcProofBundle'
      responses:
        '200':
          description: Bundle stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgcProofIngestResponse'
        '400':
          description: |
            The body could not be read (`invalid body`), which includes any
            body more than one byte over 512 KiB, or the bundle was refused:
            empty, not a JSON object, no `cuda_proof_hash`, or in ingest-nonce
            mode a missing, unknown, expired or reused nonce or an invalid
            HMAC. The message gives the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The secret header is missing or wrong (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The node has no NGC ingest secret (`not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |
            The body is exactly one byte over 512 KiB (`body too large`);
            larger bodies fail the capped read and answer 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /monitoring/ngc-proofs:
    get:
      tags:
        - Monitoring
      summary: List ingested proof summaries
      description: |
        For the node operator. No JWT: the request must carry the NGC ingest
        secret header. Returns one summary row per bundle in the in-memory
        ring (at most the newest 32, oldest first), without the full GPU
        fingerprint. Answers 404 when the node has no ingest secret. Rate
        limited to 60 requests per minute per client IP.
      operationId: ngcProofList
      x-qsdm-access: operator
      parameters:
        - $ref: '#/components/parameters/NgcIngestSecretPrimary'
        - $ref: '#/components/parameters/NgcIngestSecretLegacy'
      responses:
        '200':
          description: Summary list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgcProofListResponse'
        '401':
          description: The secret header is missing or wrong (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The node has no NGC ingest secret (`not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /faucet/claim:
    post:
      tags:
        - Faucet
      summary: Claim a local starter CELL grant
      description: |
        Tops a wallet up to the operator's target balance (QSDM_LOCAL_CELL_FAUCET_TARGET_BALANCE, default 1 CELL) with a transfer from the onboarding treasury signer, paying at most QSDM_LOCAL_CELL_FAUCET_MAX_GRANT (default 1 CELL). Operator only: the handler admits a request only when its TCP peer address is a loopback address and its X-QSDM-Local-Faucet-Token header equals QSDM_LOCAL_CELL_FAUCET_TOKEN; no JWT is needed. Answers 503 unless QSDM_LOCAL_CELL_FAUCET is enabled and the token, a faucet treasury signer (role faucet; address QSDM_FAUCET_TREASURY_ADDRESS when that is set) and the account activity ledger are configured. Rate limit: 5 requests per rate-limit window (one minute by default) per client IP. A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: claimLocalCellFaucet
      x-qsdm-access: operator
      x-qsdm-follower: refused
      parameters:
        - name: X-QSDM-Local-Faucet-Token
          in: header
          required: true
          description: Operator shared secret; must equal QSDM_LOCAL_CELL_FAUCET_TOKEN.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaucetClaimRequest'
      responses:
        '200':
          description: |
            Grant result. status is funded (a transfer was made), already_funded (the balance already meets the target and nothing was paid) or already_claimed (the signer reported the payout for this address as a duplicate; amount_granted is 0).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaucetClaimResponse'
        '400':
          description: Invalid JSON body or wallet address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: The onboarding treasury balance is lower than the grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The client is not on a loopback address, or the token header does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: More than 5 requests from this client IP in the current rate-limit window. Plain-text body.
          headers:
            Retry-After:
              description: Length of the rate-limit window in seconds.
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string
        '502':
          description: The treasury signer did not answer its status request, or the payout failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Starter grants are disabled or not fully configured (QSDM_LOCAL_CELL_FAUCET off, token unset, no faucet treasury signer, signer address or role mismatch, non-positive grant limits, or no account activity ledger), or the node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /referrals/reward-pool:
    get:
      tags:
        - Referrals
      summary: Referral reward pool status
      description: |
        Public transparency view of the referral reward pool: whether it is enabled (QSDM_REFERRAL_REWARD_POOL_ENABLED), funded and claimable, the referral treasury signer's address and balance, the reward per qualified referral (QSDM_REFERRAL_REWARD_CELL, default 5 CELL) and counts from the referral ledger. When the pool is enabled and a signer is configured, each call asks the signer for its status. message explains the current state.
      operationId: getReferralRewardPool
      x-qsdm-access: public
      parameters: []
      responses:
        '200':
          description: Pool status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralRewardPoolStatus'
        '405':
          description: Method other than GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /referrals/register-signed:
    post:
      tags:
        - Referrals
      summary: Register a signed referral
      description: |
        Binds a referred wallet to its referrer, once. The referred wallet signs the envelope: the lower-case hex SHA-256 of public_key must equal referred, and signature must be an ML-DSA-87 signature by public_key over the compact JSON object with the keys id, referrer, referred, referral_code, install_id (left out when empty), timestamp and signature (set to ""), in that order. Sending the same referrer and referral code again returns status already_registered. Answers 503 until QSDM_REFERRAL_LEDGER_PATH is configured. A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: registerReferralSigned
      x-qsdm-access: public
      x-qsdm-follower: refused
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralRegistrationEnvelope'
      responses:
        '200':
          description: Registration stored (status registered), or the same referrer and code were already registered (status already_registered).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralRegisterResponse'
        '400':
          description: Invalid JSON, or a field fails validation (id, addresses, self-referral, referral_code, install_id, timestamp, missing public_key or signature).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The referred wallet is already bound to a different referrer or referral code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: public_key or signature is not hex, public_key does not hash to referred, the signature does not verify, or the node's wallet service did not initialize.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The referral ledger file could not be read or saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: QSDM_REFERRAL_LEDGER_PATH is not configured, or the node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /referrals/status:
    get:
      tags:
        - Referrals
      summary: Referral status of a referred wallet
      description: |
        Reports whether a referred wallet has a signed referral registration, whether it is qualified (its consensus account nonce has reached QSDM_REFERRAL_MIN_ACCOUNT_NONCE, default 1), and whether a reward is claimable or already claimed. The 200, 500 and 503 responses all use the ReferralStatusResponse shape with message describing the state; 503 means QSDM_REFERRAL_LEDGER_PATH is not configured.
      operationId: getReferralStatus
      x-qsdm-access: public
      parameters:
        - name: referred
          in: query
          required: true
          description: Referred wallet address (32 to 128 hex characters). Registrations are keyed by the lower-case hex address and the lookup is case-sensitive.
          schema:
            type: string
      responses:
        '200':
          description: Referral status. registered is false when the wallet has no signed registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralStatusResponse'
        '400':
          description: referred is missing or is not a valid address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The referral ledger file could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralStatusResponse'
        '503':
          description: QSDM_REFERRAL_LEDGER_PATH is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralStatusResponse'

  /referrals/claim:
    post:
      tags:
        - Referrals
      summary: Claim a referral reward
      description: |
        Pays the referral reward (QSDM_REFERRAL_REWARD_CELL, default 5 CELL) from the referral treasury signer to the referrer registered for referred, at most once per referred wallet. Anyone may call it; referrer must match the registration and referred must be qualified. Answers 503 unless QSDM_REFERRAL_CLAIMS_ENABLED is set, QSDM_REFERRAL_LEDGER_PATH is configured and a referral treasury signer (role referral; address QSDM_REFERRAL_REWARD_POOL_ADDRESS when that is set) is configured. A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: claimReferralReward
      x-qsdm-access: public
      x-qsdm-follower: refused
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralClaimRequest'
      responses:
        '200':
          description: Reward paid (status claimed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralClaimResponse'
        '400':
          description: Invalid JSON, an invalid address, or referrer equals referred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: The referral treasury balance is lower than the reward.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: referred has no signed referral registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The claim cannot be paid. Three bodies are possible: an Error when referrer does not match the registration; a ReferralClaimResponse with status already_claimed when the reward was already paid; a ReferralStatusResponse when referred is not qualified yet.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ReferralClaimResponse'
                  - $ref: '#/components/schemas/ReferralStatusResponse'
        '500':
          description: |
            The referral ledger could not be read, the claim could not be reserved, or the payout was made but its receipt could not be saved (the claim is left pending for reconciliation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The treasury signer did not answer its status request, or the payout failed (the claim is recorded as failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Claims are disabled (QSDM_REFERRAL_CLAIMS_ENABLED), the referral ledger or treasury signer is not configured, the signer's address or role does not match, or the node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/recovery/nonce:
    get:
      tags:
        - Wallet Recovery
      summary: Next nonce for a recovery capsule action
      description: |
        Returns the consensus account nonce that the next recovery capsule action from sender must carry. Answers 503 until the consensus account state probe is wired.
      operationId: getRecoveryCapsuleNonce
      x-qsdm-access: public
      parameters:
        - name: sender
          in: query
          required: true
          description: Wallet address (32 to 128 hex characters).
          schema:
            type: string
      responses:
        '200':
          description: Current nonce of sender.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryNonceResponse'
        '400':
          description: sender is missing or is not a valid address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          headers:
            Allow:
              description: Always GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Consensus account state is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/recovery/capsules/submit-signed:
    post:
      tags:
        - Wallet Recovery
      summary: Register an encrypted legacy-wallet recovery capsule
      description: |
        Submits a wallet-signed consensus action (contract qsdm/wallet-recovery/v1) that registers an encrypted recovery capsule for the sender's existing wallet; once applied it replaces the sender's previous capsule. signature is an ML-DSA-87 signature by public_key over the compact JSON encoding of action (at most 32768 bytes, keys in the order listed in RecoveryCapsuleAction and RecoveryLegacyCapsule), and the SHA-256 of public_key must equal action.sender. The sender must already exist in consensus account state and action.nonce must equal its current nonce (see GET /wallet/recovery/nonce); unknown JSON fields are rejected. Answers 503 until the recovery mempool and the consensus account state are wired. A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: submitRecoveryCapsuleSigned
      x-qsdm-access: public
      x-qsdm-follower: refused
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCapsuleEnvelope'
      responses:
        '200':
          description: Action admitted to the mempool (mempool_status submitted) or already pending there (mempool_status duplicate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverySubmitResponse'
        '400':
          description: Invalid JSON, including unknown fields or a body over 65536 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than POST.
          headers:
            Allow:
              description: Always POST.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            The action fails validation or signature verification, the sender has no consensus account, the nonce is stale, or the mempool rejected the transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Capsule submission or consensus account state is not configured, or the node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/recovery/capsules:
    get:
      tags:
        - Wallet Recovery
      summary: Look up a recovery capsule by owner
      description: |
        Returns the current recovery capsule registered by a wallet. The capsule holds only authenticated ciphertext. Answers 503 until the recovery capsule state is wired.
      operationId: getRecoveryCapsuleByOwner
      x-qsdm-access: public
      parameters:
        - name: owner
          in: query
          required: true
          description: Wallet address (32 to 128 hex characters); matched in lower case.
          schema:
            type: string
      responses:
        '200':
          description: Capsule record.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCapsuleResponse'
        '400':
          description: owner is missing or is not a valid address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The wallet has no recovery capsule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          headers:
            Allow:
              description: Always GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Recovery capsule state is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /wallet/recovery/capsules/{locator}:
    get:
      tags:
        - Wallet Recovery
      summary: Look up a recovery capsule by locator
      description: |
        Returns the recovery capsule registered under a locator, the public lookup key derived from the recovery words. Answers 503 until the recovery capsule state is wired.
      operationId: getRecoveryCapsuleByLocator
      x-qsdm-access: public
      parameters:
        - name: locator
          in: path
          required: true
          description: Capsule locator, 64 lower-case hex characters.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: Capsule record.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCapsuleResponse'
        '400':
          description: The locator is not 64 lower-case hex characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No capsule is registered under the locator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          headers:
            Allow:
              description: Always GET.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Recovery capsule state is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/deploy:
    post:
      tags:
        - Contracts
      summary: Deploy a contract
      description: |
        Deploys a contract owned by the address claim of the caller's JWT, either from a built-in template or from code plus abi; when template is set, code and abi are ignored. With the NVIDIA lock enabled, the call is refused (403) unless a fresh qualifying NGC proof is on record. Answers 503 until a contract engine is attached to the API server. A read-only follower node (QSDM_API_READ_ONLY=1) answers 503.
      operationId: deployContract
      x-qsdm-access: authenticated
      x-qsdm-follower: refused
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractDeployRequest'
      responses:
        '201':
          description: Contract deployed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractSummary'
        '400':
          description: Invalid JSON, contract_id missing, unknown template, or no abi without a template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, invalid or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The NVIDIA lock is enabled and no fresh qualifying NGC proof is on record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A contract with this contract_id already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No contract engine is attached, or the node is a read-only follower.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/list:
    get:
      tags:
        - Contracts
      summary: List deployed contracts
      description: |
        Lists every contract deployed on this node, in no particular order. Answers 503 until a contract engine is attached to the API server.
      operationId: listContracts
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Contract list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractListResponse'
        '401':
          description: Missing, malformed, invalid or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No contract engine is attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/templates:
    get:
      tags:
        - Contracts
      summary: List contract templates
      description: |
        Lists the built-in contract templates (SimpleToken, Voting and Escrow) with their function and event counts. Needs no contract engine.
      operationId: listContractTemplates
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Template list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractTemplateListResponse'
        '401':
          description: Missing, malformed, invalid or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/traces:
    get:
      tags:
        - Contracts
      summary: List contract call traces
      description: |
        Returns the n most recent contract call traces, newest first, or, when both contract and function are given, every retained trace of that call in the order recorded. Answers 503 until a contract engine with a call tracer is attached to the API server.
      operationId: listContractTraces
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      parameters:
        - name: contract
          in: query
          required: false
          description: Contract id; filters only when function is also given.
          schema:
            type: string
        - name: function
          in: query
          required: false
          description: Function name; filters only when contract is also given.
          schema:
            type: string
        - name: n
          in: query
          required: false
          description: Number of recent traces to return. Values that are not positive integers fall back to 20. Ignored when contract and function are both given.
          schema:
            type: integer
            format: int64
            default: 20
      responses:
        '200':
          description: Traces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractTraceListResponse'
        '401':
          description: Missing, malformed, invalid or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No contract engine or call tracer is attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/traces/stats:
    get:
      tags:
        - Contracts
      summary: Contract call trace statistics
      description: |
        Aggregates over all retained call traces. Answers 503 until a contract engine with a call tracer is attached to the API server.
      operationId: getContractTraceStats
      x-qsdm-access: authenticated
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Trace statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractTraceStats'
        '401':
          description: Missing, malformed, invalid or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No contract engine or call tracer is attached.

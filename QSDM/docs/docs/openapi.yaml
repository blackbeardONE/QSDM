          format: int64

    ContractTraceOp:
      type: object
      required:
        - step
        - op_name
        - gas_before
        - gas_after
        - gas_cost
        - timestamp
      properties:
        step:
          type: integer
          format: int64
        op_name:
          type: string
          description: Operation name, for example input_charge or execute_pipeline.
        gas_before:
          type: integer
          format: int64
        gas_after:
          type: integer
          format: int64
        gas_cost:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        detail:
          type: object
          additionalProperties: true
        error:
          type: string

    ContractCallTrace:
      type: object
      required:
        - trace_id
        - contract_id
        - function_name
        - caller
        - start_time
        - end_time
        - duration_ms
        - total_gas
        - success
        - ops
      properties:
        trace_id:
          type: string
          description: Contract id, function name and start time in Unix nanoseconds, joined by underscores.
        contract_id:
          type: string
        function_name:
          type: string
        caller:
          type: string
          description: Caller identity; the engine currently records an empty string.
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        duration_ms:
          type: number
          format: double
        total_gas:
          type: integer
          format: int64
        success:
          type: boolean
        error:
          type: string
        ops:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ContractTraceOp'
        input_args:
          type: object
          additionalProperties: true
        output:
          description: Function result, any JSON value.

    ContractTraceListResponse:
      type: object
      required:
        - traces
        - count
      properties:
        traces:
          type: array
          nullable: true
          description: Matching traces. null when no recent traces are retained; the contract and function filter returns an empty list instead.
          items:
            $ref: '#/components/schemas/ContractCallTrace'
        count:
          type: integer
          format: int64

    ContractTraceStats:
      type: object
      required:
        - total_traces
        - failed_traces
        - total_gas
        - avg_duration_ms
        - unique_calls
      properties:
        total_traces:

# Single QSDM node — typical small VPS (one host, no cluster).
# From this directory: docker compose -f docker-compose.single.yml up -d --build
#
# Host ports: 4001 (libp2p), 8080 (API), 8081 (dashboard), 9000 (log viewer).
# Add peers later: set BOOTSTRAP_PEERS to multiaddrs, e.g. /ip4/1.2.3.4/tcp/4001/p2p/<peerID>

services:
  qsdm:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: qsdm
    hostname: qsdm
    ports:
      - "4001:4001"
      - "8080:8080"
      # Host loopback only. The container binds 0.0.0.0 (see
      # QSDM_DASHBOARD_BIND_ADDRESS below) because Docker routes to the
      # container's non-loopback interface -- but publishing without a host
      # IP would then expose the dashboard on every host NIC, which on the
      # "typical small VPS" this file targets means the public internet.
      # Front it with the Caddyfile in this directory for remote access.
      - "127.0.0.1:8081:8081"
      - "9000:9000"
    volumes:
      - qsdm-data:/app/data
      - qsdm-logs:/app/logs
      - ../config:/app/config:ro
    environment:
      - NODE_ID=node1
      - NETWORK_PORT=4001
      - API_PORT=8080
      - DASHBOARD_PORT=8081
      # Bind the dashboard to all interfaces INSIDE the container. The
      # process default is 127.0.0.1, which is correct on bare metal but
      # unreachable here: Docker's published port and Kubernetes' Service
      # both route to the container's non-loopback interface, not into its
      # loopback namespace. The isolation boundary is the container network,
      # not this listener.
      - QSDM_DASHBOARD_BIND_ADDRESS=0.0.0.0
      - LOG_VIEWER_PORT=9000
      - STORAGE_TYPE=sqlite
      - SQLITE_PATH=/app/data/qsdm.db
      - LOG_FILE=/app/logs/qsdm.log
      - LOG_LEVEL=INFO
      - BOOTSTRAP_PEERS=
      - ENABLE_TLS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-t", "1", "-O", "/dev/null", "http://localhost:8080/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  qsdm-data:
    driver: local
  qsdm-logs:
    driver: local

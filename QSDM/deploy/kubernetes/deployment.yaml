apiVersion: apps/v1
kind: Deployment
metadata:
  name: qsdm-node
  namespace: qsdm
  labels:
    app: qsdm
    component: node
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qsdm
      component: node
  template:
    metadata:
      labels:
        app: qsdm
        component: node
    spec:
      containers:
      - name: qsdm
        # Must match what CI actually publishes (see
        # .github/workflows/release-container.yml). Two separate defects here,
        # in order:
        #
        #   1. The bare `qsdm:latest` this originally carried resolved to
        #      Docker Hub and does not exist, so every apply ended in
        #      ImagePullBackOff. Fixed by adding the ghcr.io/ prefix.
        #   2. `ghcr.io/...:latest` then looked correct but is mutable. The
        #      release workflow sets no `flavor:` block, so
        #      docker/metadata-action's default `latest=auto` applies -- which
        #      publishes `latest` for NON-prerelease semver only. v0.4.3 is the
        #      newest such tag (everything since is -rc.N), so `:latest`
        #      silently resolved to 0.4.3. A stale deploy, not a loud failure.
        #      The audit carried defect 1's ImagePullBackOff description after
        #      the prefix fix had already made it stale.
        #
        # 0.4.3 is therefore exactly what `:latest` already ran: this pin
        # changes WHAT runs not at all, it only makes it explicit and
        # reproducible. Moving to a 0.4.7-rc.N image is a release decision for
        # the operator, not a cleanup, and is deliberately not made here.
        image: ghcr.io/blackbeardone/qsdm:0.4.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: network
          containerPort: 4001
          protocol: TCP
        - name: api
          containerPort: 8080
          protocol: TCP
        - name: dashboard
          containerPort: 8081
          protocol: TCP
        - name: logviewer
          containerPort: 9000
          protocol: TCP
        env:
        # Bind the dashboard to all interfaces INSIDE the pod. The process
        # default is 127.0.0.1, correct on bare metal but unreachable here:
        # the Service and kube-proxy route to the pod's non-loopback
        # interface, not into its loopback namespace.
        - name: QSDM_DASHBOARD_BIND_ADDRESS
          value: "0.0.0.0"
        # WebSocket origin allowlist; see configmap.yaml for how to pick the
        # value. Without it CheckOrigin stays permissive.
        - name: QSDM_WS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: ws_allowed_origins
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NETWORK_PORT
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: network_port
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: api_port
        - name: DASHBOARD_PORT
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: dashboard_port
        - name: LOG_VIEWER_PORT
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: log_viewer_port
        - name: STORAGE_TYPE
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: storage_type
        - name: SQLITE_PATH
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: sqlite_path
        - name: LOG_FILE
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: log_file
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: log_level
        - name: ENABLE_TLS
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: enable_tls
        - name: API_RATE_LIMIT_MAX
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: api_rate_limit_max
        - name: API_RATE_LIMIT_WINDOW
          valueFrom:
            configMapKeyRef:
              name: qsdm-config
              key: api_rate_limit_window
        - name: BOOTSTRAP_PEERS
          value: "qsdm-node-0.qsdm-service:4001"
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # Public API routes (no JWT). If ENABLE_TLS=true on the node, set scheme: HTTPS and/or use tcpProbe.
        livenessProbe:
          httpGet:
            path: /api/v1/health/live
            port: api
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health/ready
            port: api
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Brought to parity with validator-statefulset.yaml so the
        # legacy single-image deploy path is not a security
        # regression. See QSDM/deploy/kubernetes/networkpolicy.yaml
        # for the egress controls and the runtime-* audit-checklist
        # items in pkg/audit/checklist.go for the requirement
        # rationale.
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: qsdm-data
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}


# QSDM Configuration for Development (Game Integration)
# This config disables TLS and uses HTTP on port 8080

# Network Configuration
network:
  port: 4001
  bind_address: "127.0.0.1"
  bootstrap_peers: []

# Storage Configuration
storage:
  type: "sqlite"  # Local validator uses SQLite when built with CGO.
  sqlite_path: "qsdm.db"

# Monitoring Configuration
monitoring:
  dashboard_port: 8081
  dashboard_bind_address: "127.0.0.1"
  log_viewer_port: 8082  # Changed from 8080 to avoid conflict with API
  log_file: "qsdm.log"
  log_level: "INFO"

# API Server Configuration (HTTP for development)
api:
  port: 8080
  bind_address: "127.0.0.1"
  enable_tls: false  # Disable TLS for development
  tls_cert_file: ""
  tls_key_file: ""

# Wallet Configuration
wallet:
  initial_balance: 1000.0

# Governance Configuration
governance:
  proposal_file: "proposals.json"

# Consensus Configuration
consensus:
  # Producers whose blocks this node will append from the `qsdm-blocks` gossip
  # topic. Leaving this empty accepts a block from ANY peer that reaches the
  # topic: TryAppendExternalBlock authenticates the block but not the right to
  # produce one, and live blocks are unsigned, so an arbitrary peer could build
  # a block on the current tip and have this node replay its transactions.
  #
  # The value below is the reference network's sole block producer, and is the
  # same peer ID already pinned as the bootstrap peer in
  # QSDM/scripts/start_local_validator.ps1. Verified against the live chain:
  # every recent block on api.qsdm.tech carries this producer_id.
  #
  # If you run your own producer, replace this with its peer ID. An entry that
  # does not match your producer stops this node following the chain.
  authorized_block_producers:
    - "12D3KooWRH4MGiaRYMZEr9LvdxYrpePT5LPbNqLTMGukD32yhkZ8"

# Performance Configuration
performance:
  demo_transactions: false
  transaction_interval: "30s"
  health_check_interval: "30s"
